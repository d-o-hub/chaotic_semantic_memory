# cargo-audit configuration
# Controls which advisory warnings are suppressed.
# These are transitive dependencies we cannot easily replace:
# - number_prefix: transitive via indicatif→hf-hub→fastembed (fastembed 4.x chain)
# - paste: transitive via tokenizers, rav1e, macro_rules_attribute
# - bincode: direct dependency, pending migration to 2.x (tracked in plans/ACTIONS.md)
[advisories]
ignore = [
    "RUSTSEC-2025-0119",  # number_prefix: unmaintained (transitive via fastembed)
    "RUSTSEC-2024-0436",  # paste: unmaintained (transitive via tokenizers/rav1e)
    "RUSTSEC-2025-0141",  # bincode: unmaintained v1.x (pending upgrade to 2.x)
]
