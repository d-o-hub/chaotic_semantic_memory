# cargo-audit configuration (RUSTSEC database). The ignore list MUST mirror the
# reviewed set in deny.toml (`[advisories] ignore`); scripts/check-audit-ignore-parity.sh
# fails when the two sets diverge, and scripts/validate.sh runs that gate and its fixture.
#
# Deliberately minimal: vulnerabilities still fail the audit (that is the job's point),
# unmaintained notices keep printing as warnings.
#
# GHSA-m665-v7pm-7grj / CVE-2026-115905 (critical, zip <= 9.0.4) was resolved on
# 2026-11-03 when libduckdb-sys 1.20000.1 dropped its zip build-dependency.
# `zip` is no longer in Cargo.lock, so the RUSTSEC-2026-0367/0368/0369 ignores
# were removed above. If zip returns, csm-duckdb enabling `duckdb/bundled` is
# what keeps the vulnerable build_linked ZipArchive::extract path uncompiled;
# scripts/check-bundled-ignore-reason.sh gates exactly that pair.

[advisories]
ignore = [
    "RUSTSEC-2024-0436", # paste unmaintained, transitive via fastembed
    "RUSTSEC-2025-0141", # bincode 1.x unmaintained, pinned by libsql
    "RUSTSEC-2025-0119", # number_prefix unmaintained, transitive via indicatif
    "RUSTSEC-2026-0009", # time 0.3.45 pinned by tantivy; no user-facing RFC2822 parsing
    "RUSTSEC-2026-0002", # lru 0.12.5 pinned by tantivy; informational unsoundness
    "RUSTSEC-2026-0258", # h2 0.3.27 pinned by hyper 0.14 (libsql chain); no 0.3.x patch
    "RUSTSEC-2026-0391", # zstd 0.13.3 pinned by tantivy's zstd 0.13; with_context never called (bulk API only)
    "RUSTSEC-2026-0398", # zstd-safe 7.2.4 behind tantivy pin; seekable decompress never called
    "RUSTSEC-2026-0403", # zstd-safe 7.2.4 behind tantivy pin; DCtx::decompress_stream never called
    "RUSTSEC-2026-0410", # zstd-sys wasm32-only shim; zstd absent from the csm-wasm dependency tree
    "RUSTSEC-2026-0462", # rmcp client response body buffering vulnerability; CSM only uses rmcp server features
]
