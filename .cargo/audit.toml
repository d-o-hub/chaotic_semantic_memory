# cargo-audit configuration (RUSTSEC database). The ignore list MUST mirror the
# reviewed set in deny.toml (`[advisories] ignore`); scripts/check-audit-ignore-parity.sh
# fails when the two sets diverge, and scripts/validate.sh runs that gate and its fixture.
#
# Deliberately minimal: vulnerabilities still fail the audit (that is the job's point),
# unmaintained notices keep printing as warnings.
#
# RUSTSEC-2026-0367/0368/0369 are present because cargo-audit scans the whole lockfile.
# In this workspace, csm-duckdb enables `duckdb/bundled`; libduckdb-sys calls the
# vulnerable ZipArchive::extract path only in its non-bundled build_linked module.
# No repository build sets DUCKDB_DOWNLOAD_LIB.

[advisories]
ignore = [
    "RUSTSEC-2024-0436", # paste unmaintained, transitive via fastembed
    "RUSTSEC-2025-0141", # bincode 1.x unmaintained, pinned by libsql
    "RUSTSEC-2025-0119", # number_prefix unmaintained, transitive via indicatif
    "RUSTSEC-2026-0009", # time 0.3.45 pinned by tantivy; no user-facing RFC2822 parsing
    "RUSTSEC-2026-0002", # lru 0.12.5 pinned by tantivy; informational unsoundness
    "RUSTSEC-2026-0258", # h2 0.3.27 pinned by hyper 0.14 (libsql chain); no 0.3.x patch
    "RUSTSEC-2026-0367", # zip 6 build-dep; vulnerable extraction path is not built with bundled
    "RUSTSEC-2026-0368", # zip 6 build-dep; vulnerable extraction path is not built with bundled
    "RUSTSEC-2026-0369", # zip 6 build-dep; vulnerable extraction path is not built with bundled
]
