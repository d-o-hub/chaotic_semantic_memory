---
# Codacy configuration for chaotic_semantic_memory
# Excludes SIMD/unsafe hot paths from opengrep unsafe-usage rule.
# These files contain justified unsafe blocks for SIMD intrinsics and
# sparse accumulator performance, documented with SAFETY comments.
engines:
  opengrep:
    exclude_paths:
      - crates/csm-core-lib/src/hyperdim_simd.rs
      # VDeH SIMD kernels (AVX2/NEON) use justified unsafe intrinsics with
      # SAFETY comments; see PR #604 / chaotic_lsh.rs precedent.
      - crates/csm-chaos/src/hashing/voronoi_lsh.rs
      # BHVec10240 byte (de)serialization uses justified unsafe pointer casts with
      # SAFETY comments; LE fast path is byte-identical to to_le_bytes loop.
      - crates/csm-core-lib/src/hyperdim_binary.rs
      # ChaoticLsh AVX2/NEON projection loops use justified unsafe SIMD intrinsics
      # with SAFETY comments; 8-way unroll keeps pointer bounds documented inline.
      - crates/csm-chaos/src/hashing/chaotic_lsh.rs
      # BHVec10240 bit-sliced bundling kernels (AVX2/NEON) use justified unsafe
      # intrinsics with # SAFETY docs and runtime feature detection; see PR #663.
      - crates/csm-core-lib/src/hyperdim_simd_bundle.rs
      # Scale-evidence harness (ADR-0095): `std::env::args()` carries measurement
      # parameters and `std::env::current_exe()` re-executes the harness itself to
      # get a clean-process RSS baseline. Neither feeds a security decision, so the
      # rust.lang.security.args/current-exe rules do not apply to it.
      - examples/scale_evidence/**
      # Selector CLI (`csm-ci-select`, #1038): argv carries the change range
      # (`--since`, `--push`) and output switches; no argument feeds an
      # authorization, secret or path-sandbox decision — the workflow wraps the
      # call and enables every job whenever the selector fails. Same class as the
      # scale-evidence harness above (rust.lang.security.args).
      - crates/csm-ci-selection/src/main.rs
