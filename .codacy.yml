---
# Codacy configuration for chaotic_semantic_memory
# Excludes SIMD/unsafe hot paths from opengrep unsafe-usage rule.
# These files contain justified unsafe blocks for SIMD intrinsics and
# sparse accumulator performance, documented with SAFETY comments.
engines:
  opengrep:
    exclude_paths:
      - crates/csm-core-lib/src/hyperdim_simd.rs
      # VDeH SIMD kernels (AVX2/NEON) use justified unsafe intrinsics with
      # SAFETY comments; see PR #604 / chaotic_lsh.rs precedent.
      - crates/csm-chaos/src/hashing/voronoi_lsh.rs
      # BHVec10240 byte (de)serialization uses justified unsafe pointer casts with
      # SAFETY comments; LE fast path is byte-identical to to_le_bytes loop.
      - crates/csm-core-lib/src/hyperdim_binary.rs
