name: benchmark-ci

on:
  pull_request:
    paths:
      - 'src/**'
      - 'benches/**'
      - 'benchmarks/**'
      - '.github/workflows/benchmark-ci.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'benches/**'
      - 'benchmarks/**'
      - '.github/workflows/benchmark-ci.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-small:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      # Caching strategy:
      # - magic-nix-cache caches Nix store paths (compilers, toolchain, system libraries).
      # - actions/cache caches Cargo registry & target directories for faster incremental builds on cold host runners.
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-benchmark-${{ hashFiles('**/Cargo.lock') }}

      # Unit tests for the benchmarks workspace (also run on every PR via ci.yml
      # test-benchmarks). Kept here so path-filtered benchmark changes still
      # validate the harness before the retrieval-only smoke run.
      - name: Benchmark workspace unit tests
        run: nix develop --command scripts/run-with-libs.sh cargo test --manifest-path benchmarks/Cargo.toml --locked --quiet

      - name: Run benchmark
        run: nix develop --command scripts/run-with-libs.sh cargo run --manifest-path benchmarks/Cargo.toml -- --dataset-dir benchmarks/datasets/v1/small --mode retrieval-only --out-dir benchmarks/results/ci

      - name: Verify outputs
        run: |
          if [ ! -f benchmarks/results/ci/summary.json ]; then echo "Missing summary.json"; exit 1; fi
          if [ ! -f benchmarks/results/ci/results.jsonl ]; then echo "Missing results.jsonl"; exit 1; fi
          if [ ! -f benchmarks/results/ci/report.md ]; then echo "Missing report.md"; exit 1; fi

          # Basic schema check for summary.json
          grep -q "recall_at_1" benchmarks/results/ci/summary.json || (echo "Malformed summary.json"; exit 1)
          grep -q "peak_memory_bytes" benchmarks/results/ci/summary.json || (echo "Malformed summary.json: missing peak_memory_bytes"; exit 1)

      - name: Enforce quality thresholds
        run: |
          python - <<'PY'
          import json, sys, pathlib
          summary_path = pathlib.Path('benchmarks/results/ci/summary.json')
          summary = json.loads(summary_path.read_text())

          def require(metric, threshold):
              value = summary.get(metric)
              if value is None or value < threshold:
                  print(f"::error::{metric}={value} below threshold {threshold}")
                  return False
              return True

          def require_positive(metric):
              value = summary.get(metric)
              if value is None or value <= 0:
                  print(f"::error::{metric} must be positive (got {value})")
                  return False
              return True

          ok = True
          # ADR-0095: recall_at_* is multi-label recall (not hit rate). Hit rate was
          # historically ~0.75+; true multi-label mean on the small CI profile is lower.
          ok &= require('recall_at_1', 0.55)
          ok &= require('recall_at_5', 0.55)
          ok &= require('abstain_precision', 0.5)
          ok &= require('abstain_recall', 0.5)
          ok &= require_positive('storage_bytes')

          if not ok:
              sys.exit(1)
          PY

      - name: Generate evidence manifest
        run: |
          chmod +x scripts/benchmark-evidence.sh
          bash scripts/benchmark-evidence.sh benchmarks/results/ci

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: benchmarks/results/ci
