name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
    - uses: actions/checkout@v6
    
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        components: rustfmt, clippy
    
    - name: Cache cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Check formatting
      run: cargo fmt -- --check

    - name: Check version sync
      run: bash scripts/verify-version-sync.sh

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
    
    - name: Run tests
      run: cargo test --all-features

    - name: Run persistence field regression tests
      run: |
        cargo test --all-features batch_save_concepts_preserves_ttl_and_canonical_ids
        cargo test --all-features binary_import_export_preserves_ttl_and_canonical_links

    - name: Validate performance target tests
      run: cargo test --test performance_targets --quiet

    - name: Validate Turso roundtrip target (skips when secrets are missing)
      env:
        TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
        TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      run: cargo test --test turso_roundtrip -- --nocapture
      continue-on-error: true
    
    - name: Check LOC limits
      run: |
        for file in $(find src -name '*.rs'); do
          LOC=$(wc -l < "$file")
          if [ "$LOC" -gt 500 ]; then
            echo "❌ $file exceeds 500 LOC ($LOC lines)"
            exit 1
          fi
          echo "✓ $file: $LOC LOC"
        done

    - name: Check docs sync
      run: bash scripts/sync-docs.sh --check

  build:
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6
    
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Cache cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release
      run: cargo build --release

    - name: Install WASM target
      run: rustup target add wasm32-unknown-unknown

    - name: Build WASM target
      run: cargo build --target wasm32-unknown-unknown --release --features wasm
    
    - name: Enforce WASM size gate (< 500KiB)
      run: scripts/wasm_size_gate.sh

  benchmark:
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: read
      actions: write
    steps:
    - uses: actions/checkout@v6
    
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
    
    - name: Cache cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-bench-v3-${{ hashFiles('**/Cargo.lock') }}

    - name: Clean target for bench
      run: cargo clean -p chaotic_semantic_memory

    - name: Run benchmarks
      run: cargo bench --lib --no-fail-fast
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-results-${{ github.run_id }}
        path: target/criterion/
        retention-days: 30
