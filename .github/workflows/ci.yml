name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROTOC: /usr/bin/protoc
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
    - name: Run tests
      run: cargo test --all-features --locked -- --quiet

  test-duckdb:
    name: Test DuckDB Companion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
    - name: Run DuckDB tests
      run: cargo test -p chaotic_semantic_memory_duckdb --locked -- --test-threads=1 --quiet

  build-cli:
    name: Build CLI (${{ matrix.platform }}-${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: linux
            arch: arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - platform: macos
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - platform: macos
            arch: x64
            runner: macos-latest
            target: x86_64-apple-darwin
          - platform: windows
            arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v6

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1
      with:
        target: ${{ matrix.target }}

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2

    - name: Install cross-compilation linker (Linux arm64)
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu
        echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

    - name: Build CLI
      run: cargo build --release --bin csm --features cli --target ${{ matrix.target }} --locked

  mcp-feature:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROTOC: /usr/bin/protoc
    steps:
    - uses: actions/checkout@v6
    - name: Install Protobuf Compiler
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
    - name: Build MCP feature
      run: cargo build --features mcp --locked
    - name: Test MCP feature
      run: cargo test --features mcp --locked -- --quiet

  mutation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
    - name: Install cargo-mutants
      run: |
        if command -v cargo-binstall &>/dev/null; then
          cargo binstall -y cargo-mutants
        else
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y cargo-mutants
        fi
    - name: Run mutation tests
      run: bash scripts/mutation_test.sh fast --ci
      env:
        MUTATION_THRESHOLD: 85

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1
      with:
        target: wasm32-unknown-unknown
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - name: Build WASM
      run: wasm-pack build --dev --target web -- --features wasm
    - name: Check WASM
      run: cargo check --target wasm32-unknown-unknown --features wasm
    - name: Verify WASM TS Freshness
      run: bash scripts/check-wasm-freshness.sh

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROTOC: /usr/bin/protoc
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1
      with:
        components: clippy, rustfmt
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
    - name: Format check
      run: cargo fmt --all -- --check
    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
    - name: LOC gate
      run: bash scripts/validate.sh
