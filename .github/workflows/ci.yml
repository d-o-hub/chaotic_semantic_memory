name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Path change detection so expensive / specialized jobs can skip when irrelevant.
  # Push to main always runs full coverage (DIFF empty → all true) to protect the trunk.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      duckdb: ${{ steps.filter.outputs.duckdb }}
      wasm: ${{ steps.filter.outputs.wasm }}
      fuzz: ${{ steps.filter.outputs.fuzz }}
      mcp: ${{ steps.filter.outputs.mcp }}
      cli_cross: ${{ steps.filter.outputs.cli_cross }}
      mutation: ${{ steps.filter.outputs.mutation }}
      rust_src: ${{ steps.filter.outputs.rust_src }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=50
            BASE="origin/${{ github.base_ref }}"
            DIFF=$(git diff --name-only "${BASE}...HEAD" || true)
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
            && [ -n "${{ github.event.before }}" ]; then
            DIFF=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" || true)
          else
            # First push / unknown base: run everything
            DIFF=""
          fi

          # Empty DIFF (e.g. first push) → enable all specialized jobs
          if [ -z "${DIFF}" ]; then
            for k in duckdb wasm fuzz mcp cli_cross mutation rust_src; do
              echo "${k}=true" >> "$GITHUB_OUTPUT"
            done
            echo "detect-changes: empty DIFF → all jobs enabled"
            exit 0
          fi

          echo "Changed files:"
          echo "${DIFF}"

          match() {
            local pattern=$1
            echo "${DIFF}" | grep -qE "${pattern}"
          }

          # Always true on push to main for trunk protection of optional crates
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "duckdb=true" >> "$GITHUB_OUTPUT"
            echo "wasm=true" >> "$GITHUB_OUTPUT"
            echo "fuzz=true" >> "$GITHUB_OUTPUT"
            echo "mcp=true" >> "$GITHUB_OUTPUT"
            echo "cli_cross=true" >> "$GITHUB_OUTPUT"
            echo "mutation=false" >> "$GITHUB_OUTPUT"  # mutation is PR-only
            if match '\.rs$|Cargo\.(toml|lock)$|build\.rs$'; then
              echo "rust_src=true" >> "$GITHUB_OUTPUT"
            else
              echo "rust_src=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # PR: path-filtered specialized jobs
          if match '^(crates/csm-duckdb/|Cargo\.(toml|lock)$)'; then
            echo "duckdb=true" >> "$GITHUB_OUTPUT"
          else
            echo "duckdb=false" >> "$GITHUB_OUTPUT"
          fi

          if match '^(crates/csm-wasm/|src/wasm|wasm/|Cargo\.(toml|lock)$)'; then
            echo "wasm=true" >> "$GITHUB_OUTPUT"
          else
            echo "wasm=false" >> "$GITHUB_OUTPUT"
          fi

          if match '^(fuzz/|Cargo\.(toml|lock)$)'; then
            echo "fuzz=true" >> "$GITHUB_OUTPUT"
          else
            echo "fuzz=false" >> "$GITHUB_OUTPUT"
          fi

          if match '^(src/mcp/|Cargo\.(toml|lock)$|\.github/workflows/ci\.yml$)'; then
            echo "mcp=true" >> "$GITHUB_OUTPUT"
          else
            echo "mcp=false" >> "$GITHUB_OUTPUT"
          fi

          # Cross-platform CLI (macOS/Windows): only when CLI surface or build wiring changes
          if match '^(src/bin/|src/cli/|crates/csm-cli/|cli-npm/|Cargo\.(toml|lock)$|\.github/workflows/ci\.yml$)'; then
            echo "cli_cross=true" >> "$GITHUB_OUTPUT"
          else
            echo "cli_cross=false" >> "$GITHUB_OUTPUT"
          fi

          # Mutation: production-relevant sources + manifests + mutation tooling
          if match '\.rs$|Cargo\.(toml|lock)$|build\.rs$|scripts/mutation_test\.sh$|\.cargo/|deny\.toml$'; then
            echo "mutation=true" >> "$GITHUB_OUTPUT"
          else
            echo "mutation=false" >> "$GITHUB_OUTPUT"
          fi

          if match '\.rs$|Cargo\.(toml|lock)$|build\.rs$'; then
            echo "rust_src=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust_src=false" >> "$GITHUB_OUTPUT"
          fi

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7
        with:
          fetch-depth: 0
      - name: Install node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.0.3
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install commitlint
        run: npm ci
      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Validate branch commits with commitlint
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npx commitlint --from ${{ github.event.before }} --to ${{ github.event.after }} --verbose

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROTOC: /usr/bin/protoc
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.7.3
      with:
        shared-key: test
    - name: Run tests
      run: cargo test --all-features --locked -- --quiet

  test-workspace-crates:
    name: Test Workspace Crates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROTOC: /usr/bin/protoc
    strategy:
      fail-fast: false
      matrix:
        crate:
          # Keep in sync with workspace members under crates/ (excl. csm-wasm, csm-duckdb).
          # csm-duckdb has a dedicated job; csm-wasm is covered by the wasm job.
          - csm-chaos
          - csm-cli
          - csm-core
          - csm-embedding
          - csm-memory
          - csm-retrieval
          - csm-persistence
          - csm-traits
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.7.3
      with:
        shared-key: test
    - name: Test ${{ matrix.crate }}
      # Default features only; --all-features activates mutually exclusive
      # crate features (e.g. wasm vs persistence in csm-persistence).
      # Full feature coverage is in the main 'test' job.
      run: cargo test -p ${{ matrix.crate }} --locked -- --quiet

  test-duckdb:
    name: Test DuckDB Companion
    needs: detect-changes
    if: needs.detect-changes.outputs.duckdb == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.7.3
      with:
        shared-key: test
    - name: Run DuckDB tests
      run: cargo test -p csm-duckdb --locked -- --test-threads=1 --quiet

  # Miri: push + PR. Path-skip docs-only when no Rust/Cargo changes (detect-changes.rust_src).
  miri:
    needs: detect-changes
    if: needs.detect-changes.outputs.rust_src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROTOC: /usr/bin/protoc
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7
    - name: Install Rust nightly
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false
        toolchain: nightly
        components: miri
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.7.3
      with:
        shared-key: miri
    - name: Run Miri tests
      run: cargo miri test -p chaotic_semantic_memory --no-default-features --features ann-hnsw --lib
      env:
        # deterministic-floats: BM25/ln/recip scoring must be bit-stable across
        # repeated searches; miri's default non-det floats break cache parity tests.
        MIRIFLAGS: "-Zmiri-disable-isolation -Zmiri-deterministic-floats"

  # Always build linux-x64 CLI after tests (cheap smoke compile).
  build-cli:
    name: Build CLI (linux-x64)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false
        target: x86_64-unknown-linux-gnu
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.7.3
      with:
        shared-key: cli
    - name: Build CLI
      run: cargo build --release --bin csm --features cli --target x86_64-unknown-linux-gnu --locked

  # Cross-platform CLI (arm64/macOS/Windows): PR path-filtered or always on push to main.
  build-cli-cross:
    name: Build CLI (${{ matrix.platform }}-${{ matrix.arch }})
    needs: [test, detect-changes]
    if: needs.detect-changes.outputs.cli_cross == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux
            arch: arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - platform: macos
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - platform: macos
            arch: x64
            runner: macos-latest
            target: x86_64-apple-darwin
          - platform: windows
            arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false
        target: ${{ matrix.target }}

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.7.3
      with:
        shared-key: cli

    - name: Install cross-compilation linker (Linux arm64)
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu
        echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

    - name: Build CLI
      run: cargo build --release --bin csm --features cli --target ${{ matrix.target }} --locked

  mcp-feature:
    needs: detect-changes
    if: needs.detect-changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROTOC: /usr/bin/protoc
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7
    - name: Install Protobuf Compiler
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.7.3
      with:
        shared-key: test
    # cargo test already compiles; no separate cargo build step
    - name: Test MCP feature
      run: cargo test --features mcp --locked -- --quiet

  mutation-test:
    # Fast profile: in-diff + unit tests only (--lib) + tight timeouts.
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.mutation == 'true'
    needs: [test, detect-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7
      with:
        fetch-depth: 0

    - name: Fetch base for three-dot in-diff
      run: git fetch origin "${{ github.base_ref }}" --depth=50

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.7.3
      with:
        shared-key: mutation-test

    - name: Install cargo-mutants
      uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853  # v2.83.2
      with:
        tool: cargo-mutants

    - name: Run mutation tests
      run: bash scripts/mutation_test.sh --ci fast
      env:
        MUTATION_THRESHOLD: ${{ github.event.pull_request.draft && '75' || '85' }}
        DIFF_TARGET: origin/${{ github.base_ref || 'main' }}
        MUTANTS_JOBS: "4"
        # Absolute timeout budget + fraction of viable (see scripts/mutation_test.sh)
        MUTATION_TIMEOUT_BUDGET: "30"
        MUTATION_TIMEOUT_FRACTION: "0.20"
        # Build timeout for complex wave32+ features (default 120s)
        MUTATION_BUILD_TIMEOUT: "180"
        CARGO_TERM_COLOR: always
        RUST_BACKTRACE: "0"

  wasm:
    needs: detect-changes
    if: needs.detect-changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false
        target: wasm32-unknown-unknown
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.7.3
      with:
        shared-key: wasm
    - name: Install wasm-pack
      uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853  # v2.83.2
      with:
        tool: wasm-pack
    - name: Build WASM (web — matches release npm target)
      # ADR-0094: identical crate/path/out-name as release.yml publish-npm-wasm.
      # out-dir must be absolute: wasm-pack resolves relative paths from the crate dir.
      run: |
        wasm-pack build crates/csm-wasm --dev --target web \
          --out-dir "${{ github.workspace }}/wasm/pkg-ci-web" \
          --out-name chaotic_semantic_memory
    - name: Check WASM
      run: cargo check --target wasm32-unknown-unknown -p csm-wasm
    - name: Verify WASM TS Freshness
      run: bash scripts/check-wasm-freshness.sh
    - name: Build WASM (nodejs) + JS smoke
      # Node cannot init --target web (file:// fetch). Nodejs target + out-name
      # matches wasm/test.js / wasm/package.json main field.
      run: |
        set -euo pipefail
        OUT="${{ github.workspace }}/wasm/pkg-ci-node"
        wasm-pack build crates/csm-wasm --dev --target nodejs \
          --out-dir "${OUT}" \
          --out-name chaotic_semantic_memory
        test -f "${OUT}/chaotic_semantic_memory.js"
        WASM_PACKAGE_DIR="${OUT}" node wasm/test.js

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROTOC: /usr/bin/protoc
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false
        components: clippy, rustfmt
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.7.3
      with:
        shared-key: test
    - name: Format check
      run: cargo fmt --all -- --check
    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
    - name: Skill format validation (ADR-0096)
      run: bash scripts/validate-skill-format.sh
    - name: Skill catalog freshness (ADR-0096)
      run: bash scripts/generate-skill-catalog.sh --check
    - name: Critical skill behavioral evals (ADR-0096)
      run: bash scripts/eval-critical-skills.sh
    - name: Plan archive manifest (ADR-0096)
      run: bash scripts/plans-archive-manifest.sh
    - name: LOC gate
      run: bash scripts/validate.sh

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.7.3
      with:
        shared-key: test
    - name: Install cargo-deny
      uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853  # v2.83.2
      with:
        tool: cargo-deny
    - name: cargo deny check
      run: cargo deny --locked check

  test-benchmarks:
    name: Test Benchmark Workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROTOC: /usr/bin/protoc
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.7.3
      with:
        shared-key: test
    - name: Benchmark workspace unit tests
      run: cargo test --manifest-path benchmarks/Cargo.toml --locked --quiet

  fuzz-build:
    name: Fuzz Workspace Build
    needs: detect-changes
    if: needs.detect-changes.outputs.fuzz == 'true'
    runs-on: ubuntu-latest
    # Keep in sync with FUZZ_PR_JOB_TIMEOUT_MINUTES in .github/ci-settings.env
    # (GHA timeout-minutes must be a literal; settings file is the human source of truth).
    timeout-minutes: 30
    env:
      PROTOC: /usr/bin/protoc
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7
    - name: Load CI settings (no bare versions/timeouts in steps)
      run: |
        set -euo pipefail
        # shellcheck source=/dev/null
        set -a
        source "${GITHUB_WORKSPACE}/.github/ci-settings.env"
        set +a
        {
          echo "CARGO_FUZZ_VERSION=${CARGO_FUZZ_VERSION}"
          echo "FUZZ_SHORT_SECONDS=${FUZZ_SHORT_SECONDS}"
          echo "FUZZ_INPUT_TIMEOUT_SECONDS=${FUZZ_INPUT_TIMEOUT_SECONDS}"
          echo "FUZZ_PR_SMOKE_TARGETS=${FUZZ_PR_SMOKE_TARGETS}"
          echo "RUSTUP_TOOLCHAIN_PROFILE=${RUSTUP_TOOLCHAIN_PROFILE}"
        } >> "${GITHUB_ENV}"
    - name: Install clang (libfuzzer-sys build)
      run: |
        sudo apt-get update
        sudo apt-get install -y clang
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.7.3
      with:
        workspaces: fuzz
        shared-key: fuzz
    - name: Check all fuzz targets compile
      # Required gate (ADR-0095 Tier 1 compile). Uses stable + locked fuzz/Cargo.lock.
      run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked
    - name: Install nightly + cargo-fuzz (version from ci-settings.env)
      # No bare version literals here. Do not use taiki cargo-fuzz@ver (musl breakage).
      run: |
        set -euo pipefail
        : "${CARGO_FUZZ_VERSION:?CARGO_FUZZ_VERSION unset — load ci-settings.env}"
        : "${RUSTUP_TOOLCHAIN_PROFILE:?RUSTUP_TOOLCHAIN_PROFILE unset}"
        rustup toolchain install nightly --profile "${RUSTUP_TOOLCHAIN_PROFILE}" --no-self-update
        rustup component add rust-src --toolchain nightly
        cargo install cargo-fuzz --locked --version "${CARGO_FUZZ_VERSION}" --force
    - name: Short fuzz runs (smoke targets)
      # FUZZ_SHORT_SECONDS=0 → compile-only. --sanitizer none for shared PR runners.
      run: |
        set -euo pipefail
        : "${FUZZ_SHORT_SECONDS:?}"
        : "${FUZZ_INPUT_TIMEOUT_SECONDS:?}"
        : "${FUZZ_PR_SMOKE_TARGETS:?}"
        if [[ "${FUZZ_SHORT_SECONDS}" == "0" ]]; then
          echo "FUZZ_SHORT_SECONDS=0 → skip short runs (compile-only gate satisfied)"
          exit 0
        fi
        # shellcheck disable=SC2206
        targets=( ${FUZZ_PR_SMOKE_TARGETS} )
        for target in "${targets[@]}"; do
          echo "::group::fuzz ${target} (${FUZZ_SHORT_SECONDS}s)"
          cargo +nightly fuzz run "${target}" --sanitizer none -- \
            -max_total_time="${FUZZ_SHORT_SECONDS}" \
            -timeout="${FUZZ_INPUT_TIMEOUT_SECONDS}"
          echo "::endgroup::"
        done
