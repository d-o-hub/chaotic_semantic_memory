name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        components: rustfmt, clippy
    
    - name: Cache cargo
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Check formatting
      run: cargo fmt -- --check
    
    - name: Run clippy
      run: cargo clippy -- -D warnings
    
    - name: Run tests
      run: cargo test --all-features

    - name: Validate performance target tests
      run: cargo test --test performance_targets --quiet

    - name: Validate Turso roundtrip target (skips when secrets are missing)
      env:
        TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
        TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      run: cargo test --test turso_roundtrip -- --nocapture
    
    - name: Check LOC limits
      run: |
        for file in src/*.rs; do
          LOC=$(wc -l < "$file")
          if [ "$LOC" -gt 500 ]; then
            echo "❌ $file exceeds 500 LOC ($LOC lines)"
            exit 1
          fi
          echo "✓ $file: $LOC LOC"
        done

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Build release
      run: cargo build --release

    - name: Install WASM target
      run: rustup target add wasm32-unknown-unknown

    - name: Build WASM target
      run: cargo build --target wasm32-unknown-unknown --release --features wasm
    
    - name: Enforce WASM size gate (< 500KiB)
      run: scripts/wasm_size_gate.sh

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
    
    - name: Run benchmarks
      run: cargo bench
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: target/criterion/
