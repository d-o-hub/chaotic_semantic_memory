name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Install WASM target
      run: rustup target add wasm32-unknown-unknown
        components: rustfmt, clippy
    
    - name: Cache cargo
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Check formatting
      run: cargo fmt -- --check
    
    - name: Run clippy
      run: cargo clippy -- -D warnings
    
    - name: Run tests
      run: cargo test --all-features
    
    - name: Check LOC limits
      run: |
        for file in src/*.rs; do
          LOC=$(wc -l < "$file")
          if [ "$LOC" -gt 500 ]; then
            echo "❌ $file exceeds 500 LOC ($LOC lines)"
            exit 1
          fi
          echo "✓ $file: $LOC LOC"
        done

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
    
    - name: Build release
      run: cargo build --release
    
    - name: Build WASM target
      run: cargo build --target wasm32-unknown-unknown --release
    
    - name: Check binary size
      run: |
        echo "Native binary size:"
        ls -lh target/release/*.so target/release/*.rlib target/release/*.a 2>/dev/null || echo "No library artifacts"
        echo "WASM binary size:"
        ls -lh target/wasm32-unknown-unknown/release/*.wasm 2>/dev/null || echo "No WASM artifacts"

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
    
    - name: Run benchmarks
      run: cargo bench
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: target/criterion/
