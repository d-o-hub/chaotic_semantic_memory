name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7
        with:
          fetch-depth: 0
      - name: Install node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.0.3
        with:
          node-version: '20'
      - name: Install commitlint
        run: npm install --save-dev @commitlint/config-conventional @commitlint/cli
      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Validate branch commits with commitlint
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npx commitlint --from ${{ github.event.before }} --to ${{ github.event.after }} --verbose

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROTOC: /usr/bin/protoc
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.7.3
    - name: Run tests
      run: cargo test --all-features --locked -- --quiet

  test-workspace-crates:
    name: Test Workspace Crates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROTOC: /usr/bin/protoc
    strategy:
      fail-fast: false
      matrix:
        crate:
          - csm-cli
          - csm-core
          - csm-embedding
          - csm-memory
          - csm-retrieval
          - csm-persistence
          - csm-traits
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.7.3
    - name: Test ${{ matrix.crate }}
      # Default features only; --all-features activates mutually exclusive
      # crate features (e.g. wasm vs persistence in csm-persistence).
      # Full feature coverage is in the main 'test' job.
      run: cargo test -p ${{ matrix.crate }} --locked -- --quiet

  test-duckdb:
    name: Test DuckDB Companion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.7.3
    - name: Run DuckDB tests
      run: cargo test -p chaotic_semantic_memory_duckdb --locked -- --test-threads=1 --quiet

  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'push'
    env:
      PROTOC: /usr/bin/protoc
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7
    - name: Install Rust nightly
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false
        toolchain: nightly
        components: miri
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.7.3
    - name: Run Miri tests
      run: cargo miri test -p chaotic_semantic_memory --no-default-features --features ann-hnsw --lib
      env:
        MIRIFLAGS: "-Zmiri-disable-isolation"

  build-cli:
    name: Build CLI (${{ matrix.platform }}-${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: linux
            arch: arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - platform: macos
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - platform: macos
            arch: x64
            runner: macos-latest
            target: x86_64-apple-darwin
          - platform: windows
            arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false
        target: ${{ matrix.target }}

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.7.3

    - name: Install cross-compilation linker (Linux arm64)
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu
        echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

    - name: Build CLI
      run: cargo build --release --bin csm --features cli --target ${{ matrix.target }} --locked

  mcp-feature:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROTOC: /usr/bin/protoc
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7
    - name: Install Protobuf Compiler
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.7.3
    - name: Build MCP feature
      run: cargo build --features mcp --locked
    - name: Test MCP feature
      run: cargo test --features mcp --locked -- --quiet

  mutation-test:
    # Mutation testing is expensive (~20 min per run). Run it only on PRs so
    # main-branch CI stays fast enough to fit inside the Release workflow's
    # wait-for-ci window. Push-to-main already gets full mutation coverage on
    # the PR that introduced the change.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: test
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7
      with:
        fetch-depth: 0

    # --- NEW: skip entire job if no Rust source files changed ---
    - name: Check for Rust changes
      id: rust_changes
      run: |
        git fetch origin ${{ github.base_ref }} --depth=1
        CHANGED=$(git diff --name-only origin/${{ github.base_ref }} | grep '\.rs$' || true)
        if [ -n "$CHANGED" ]; then
          echo "has_rust_changes=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_rust_changes=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install Rust
      if: steps.rust_changes.outputs.has_rust_changes == "true"
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false

    - name: Cache Rust dependencies
      if: steps.rust_changes.outputs.has_rust_changes == "true"
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.7.3
      with:
        shared-key: mutation-test   # dedicated cache bucket, avoids evicting test-job cache

    - name: Install cargo-mutants
      if: steps.rust_changes.outputs.has_rust_changes == "true"
      uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3  # v2.82.9
      with:
        tool: cargo-mutants

    - name: Run mutation tests
      if: steps.rust_changes.outputs.has_rust_changes == "true"
      run: bash scripts/mutation_test.sh fast --ci
      env:
        MUTATION_THRESHOLD: ${{ github.event.pull_request.draft && "75" || "85" }}
        DIFF_TARGET: origin/${{ github.base_ref || "main" }}
        MUTANTS_JOBS: "4"   # passed into script below

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false
        target: wasm32-unknown-unknown
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.7.3
    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - name: Build WASM
      run: wasm-pack build --dev --target web -- --no-default-features --features wasm
    - name: Check WASM
      run: cargo check --target wasm32-unknown-unknown --no-default-features --features wasm
    - name: Verify WASM TS Freshness
      run: bash scripts/check-wasm-freshness.sh

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROTOC: /usr/bin/protoc
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false
        components: clippy, rustfmt
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.7.3
    - name: Format check
      run: cargo fmt --all -- --check
    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
    - name: LOC gate
      run: bash scripts/validate.sh
