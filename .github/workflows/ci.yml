name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel stale PR runs but let main pushes complete (prevents release cascading failures).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Path change detection so expensive / specialized jobs can skip when irrelevant.
  # Push to main always runs full coverage (DIFF empty → all true) to protect the trunk.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      duckdb: ${{ steps.filter.outputs.duckdb }}
      wasm: ${{ steps.filter.outputs.wasm }}
      fuzz: ${{ steps.filter.outputs.fuzz }}
      mcp: ${{ steps.filter.outputs.mcp }}
      cli_cross: ${{ steps.filter.outputs.cli_cross }}
      mutation: ${{ steps.filter.outputs.mutation }}
      rust_src: ${{ steps.filter.outputs.rust_src }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=50
            BASE="origin/${{ github.base_ref }}"
            DIFF=$(git diff --name-only "${BASE}...HEAD" || true)
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
            && [ -n "${{ github.event.before }}" ]; then
            DIFF=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" || true)
          else
            # First push / unknown base: run everything
            DIFF=""
          fi

          # Empty DIFF (e.g. first push) → enable all specialized jobs
          if [ -z "${DIFF}" ]; then
            for k in duckdb wasm fuzz mcp cli_cross mutation rust_src; do
              echo "${k}=true" >> "$GITHUB_OUTPUT"
            done
            echo "detect-changes: empty DIFF → all jobs enabled"
            exit 0
          fi

          echo "Changed files:"
          echo "${DIFF}"

          match() {
            local pattern=$1
            echo "${DIFF}" | grep -qE "${pattern}"
          }

          # Always true on push to main for trunk protection of optional crates
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "duckdb=true" >> "$GITHUB_OUTPUT"
            echo "wasm=true" >> "$GITHUB_OUTPUT"
            echo "fuzz=true" >> "$GITHUB_OUTPUT"
            echo "mcp=true" >> "$GITHUB_OUTPUT"
            echo "cli_cross=true" >> "$GITHUB_OUTPUT"
            echo "mutation=false" >> "$GITHUB_OUTPUT"  # mutation is PR-only
            if match '\.rs$|Cargo\.(toml|lock)$|build\.rs$'; then
              echo "rust_src=true" >> "$GITHUB_OUTPUT"
            else
              echo "rust_src=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # PR: path-filtered specialized jobs
          if match '^(crates/csm-duckdb/|Cargo\.(toml|lock)$)'; then
            echo "duckdb=true" >> "$GITHUB_OUTPUT"
          else
            echo "duckdb=false" >> "$GITHUB_OUTPUT"
          fi

          # Any root `src/**` change can alter the generated WASM bindings
          # (crates/csm-wasm depends on the root crate with feature `wasm`), and
          # the checker/build/size-gate scripts and this workflow must exercise
          # the gate they define.
          if match '^(crates/csm-wasm/|src/|wasm/|scripts/(build-wasm|check-wasm-freshness|wasm_size_gate)\.sh$|Cargo\.(toml|lock)$|\.github/workflows/ci\.yml$)'; then
            echo "wasm=true" >> "$GITHUB_OUTPUT"
          else
            echo "wasm=false" >> "$GITHUB_OUTPUT"
          fi

          if match '^(fuzz/|Cargo\.(toml|lock)$)'; then
            echo "fuzz=true" >> "$GITHUB_OUTPUT"
          else
            echo "fuzz=false" >> "$GITHUB_OUTPUT"
          fi

          if match '^(src/mcp/|Cargo\.(toml|lock)$|\.github/workflows/ci\.yml$)'; then
            echo "mcp=true" >> "$GITHUB_OUTPUT"
          else
            echo "mcp=false" >> "$GITHUB_OUTPUT"
          fi

          # Cross-platform CLI (macOS/Windows): only when CLI surface or build wiring changes
          if match '^(src/bin/|src/cli/|crates/csm-cli/|cli-npm/|Cargo\.(toml|lock)$|\.github/workflows/ci\.yml$)'; then
            echo "cli_cross=true" >> "$GITHUB_OUTPUT"
          else
            echo "cli_cross=false" >> "$GITHUB_OUTPUT"
          fi

          # Mutation: production-relevant sources + manifests + mutation tooling
          if match '\.rs$|Cargo\.(toml|lock)$|build\.rs$|scripts/mutation_test\.sh$|\.cargo/|deny\.toml$'; then
            echo "mutation=true" >> "$GITHUB_OUTPUT"
          else
            echo "mutation=false" >> "$GITHUB_OUTPUT"
          fi

          if match '\.rs$|Cargo\.(toml|lock)$|build\.rs$'; then
            echo "rust_src=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust_src=false" >> "$GITHUB_OUTPUT"
          fi

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
        with:
          fetch-depth: 0
      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.0.3
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install commitlint
        run: npm ci
      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Validate PR title (squash subject) with commitlint
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose
      # ADR-0095 evidence tier: a `perf(...)` PR must document its baseline,
      # measurement artifact and before/after numbers (see
      # scripts/check-perf-pr-evidence.py). `always()` so the evidence verdict
      # is reported even when commitlint fails above. Non-`perf(...)` titles
      # exit zero, so bot/dependency PRs are unaffected.
      - name: Perf PR evidence gate (ADR-0095)
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check-perf-pr-evidence.py "$PR_TITLE" "$PR_BODY"
      - name: Validate branch commits with commitlint
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npx commitlint --from ${{ github.event.before }} --to ${{ github.event.after }} --verbose

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROTOC: /usr/bin/protoc
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
    - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
    - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
    # Caching strategy:
    # - magic-nix-cache caches Nix store paths (compilers, toolchain, system libraries).
    # - actions/cache caches Cargo registry & target directories for faster incremental builds on cold host runners.
    - name: Cache cargo
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
    # tests/performance_targets.rs asserts a 20 ms p50 ceiling on a persistence
    # roundtrip, but that number is a property of the storage medium: ~1.2 ms on
    # RAM-backed storage vs 24.47 ms on the runner's disk-backed /tmp for the
    # same revision (main run 34610334012 failed the ceiling with no code
    # change). Back /tmp with tmpfs so the gate keeps its calibrated meaning at
    # the path the suite already uses — src/framework_validation.rs only accepts
    # absolute paths under the working directory or /tmp, so pointing TMPDIR
    # elsewhere would break the export/import tests.
    - name: Use RAM-backed /tmp
      run: sudo mount -t tmpfs -o size=8g,mode=1777 tmpfs /tmp
    - name: Run tests
      run: nix develop --command scripts/run-with-libs.sh cargo test --all-features --locked -- --quiet

  # The crate list for "Test Workspace Crates" is derived here instead of typed
  # by hand (issue #827, audit A6). A hand-written matrix guarded only by a
  # "keep in sync with workspace members" comment let a new crates/* member ship
  # without ever running `cargo test -p` on it — the comment cannot fail.
  # scripts/ci-workspace-crate-matrix.sh reads `cargo metadata --no-deps`, keeps
  # every crates/* member, and drops only crates that a dedicated job below
  # proves it covers (the exclusion list is checked against this file, so it
  # cannot rot either). It also fails on an EMPTY result, because Actions runs
  # zero jobs for an empty matrix and reports success: that would be the same
  # silent skip in a new costume. Run it red locally with
  # `bash scripts/ci-workspace-crate-matrix.sh --check`.
  workspace-matrix:
    name: Derive Workspace Crate Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      crates: ${{ steps.derive.outputs.crates }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        cache: false
    - id: derive
      name: Derive crate matrix from cargo metadata
      shell: bash
      run: bash scripts/ci-workspace-crate-matrix.sh --github-output

  test-workspace-crates:
    name: Test Workspace Crates
    needs: workspace-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROTOC: /usr/bin/protoc
    strategy:
      fail-fast: false
      # {"crate":[...]} from the workspace-matrix job — never a literal list
      # here (enforced by scripts/ci-workspace-crate-matrix.sh).
      matrix: ${{ fromJSON(needs.workspace-matrix.outputs.crates) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        cache: false
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.3
      with:
        shared-key: test
    - name: Test ${{ matrix.crate }}
      # Default features only; --all-features activates mutually exclusive
      # crate features (e.g. wasm vs persistence in csm-persistence).
      # Full feature coverage is in the main 'test' job.
      run: cargo test -p ${{ matrix.crate }} --locked -- --quiet
    # csm-chaos's experimental modules are gated off in the default-features test
    # above, and the root-package all-features jobs never select member crates
    # (`workspace_default_members` is the root package), so this step is the one
    # place they are compiled and tested.
    - name: Test experimental features (csm-chaos)
      if: matrix.crate == 'csm-chaos'
      run: cargo test -p csm-chaos --all-features --locked -- --quiet

  # Native arm64 runner: executes the aarch64 NEON SIMD kernels (e.g.
  # hamming_distance_1280_neon), which the x86_64 ubuntu matrix only compiles
  # and never runs. Path-skip docs-only commits via detect-changes.rust_src.
  test-core-arm64:
    name: Test csm-core-lib (arm64)
    needs: detect-changes
    # rust_src: SIMD kernel changes; cli_cross also covers .github/workflows/ci.yml
    # so workflow edits (like this job itself) still exercise the arm64 path.
    if: needs.detect-changes.outputs.rust_src == 'true' || needs.detect-changes.outputs.cli_cross == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        cache: false
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.3
      with:
        shared-key: test-arm64
    - name: Assert arm64 host
      run: "rustc -vV | grep 'host: aarch64'"
    - name: Test csm-core-lib (executes NEON hamming kernels)
      run: cargo test -p csm-core-lib --locked -- --quiet

  # Runs the graph-candidates criterion bench (added in PR #598) and enforces a
  # regression ceiling. The root-crate benches are otherwise only compiled by
  # the test matrix, never executed. rust_src covers benches/** and
  # crates/csm-memory/**; cli_cross also covers .github/workflows/ci.yml so
  # workflow edits (like this job itself) still exercise the bench.
  benchmark-graph-candidates:
    name: Benchmark graph candidates
    needs: detect-changes
    if: needs.detect-changes.outputs.rust_src == 'true' || needs.detect-changes.outputs.cli_cross == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        cache: false
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.3
      with:
        shared-key: test
    - name: Run graph candidates benchmark
      run: cargo bench --bench graph_candidates_benchmark -- --warm-up-time 1 --measurement-time 3
    - name: Enforce regression ceiling
      run: |
        python3 - <<'PY'
        import json, pathlib
        p = pathlib.Path('target/criterion/graph_candidates/find_similar_graph_500x20_d3/new/estimates.json')
        median_us = json.loads(p.read_text())['median']['point_estimate'] / 1000.0
        # Dev-machine baseline: ~218-240 us. Ceiling ~2.5x tolerates slower CI
        # hardware and noise while catching gross regressions (reintroduced
        # per-node String cloning at scale, O(n^2) BFS blowups). Recalibrate by
        # running the bench locally and updating this constant.
        ceiling_us = 600.0
        print(f'graph_candidates median: {median_us:.1f} us (ceiling {ceiling_us:.0f} us)')
        if median_us > ceiling_us:
            print(f'::error::graph candidate retrieval median {median_us:.1f} us exceeds ceiling {ceiling_us:.0f} us')
            raise SystemExit(1)
        PY

  test-duckdb:
    name: Test DuckDB Companion
    needs: detect-changes
    if: needs.detect-changes.outputs.duckdb == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        cache: false
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.3
      with:
        shared-key: test
    - name: Run DuckDB tests
      # --all-features: the crate defaults to no features, and the cli_tests
      # target is `required-features = ["cli"]`, so a default-feature run
      # executes 0 of its tests (parquet export additionally needs "parquet").
      run: cargo test -p csm-duckdb --all-features --locked -- --test-threads=1 --quiet

  # Miri: push + PR. Path-skip docs-only when no Rust/Cargo changes (detect-changes.rust_src).
  miri:
    needs: detect-changes
    if: needs.detect-changes.outputs.rust_src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROTOC: /usr/bin/protoc
      # setup-rust-toolchain v2.0.0 exports CARGO_BUILD_WARNINGS=deny; `cargo
      # miri setup scaffolds a sysroot workspace that legitimately emits
      # "unused dependency sysroot", which deny turns fatal (run 34752425200);
      # cargo accepts warn/allow/deny — "allow" hides the lints.
      CARGO_BUILD_WARNINGS: allow
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
    - name: Install Rust nightly
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        cache: false
        toolchain: nightly
        components: miri
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.3
      with:
        shared-key: miri
    - name: Run Miri tests
      run: cargo miri test -p chaotic_semantic_memory --no-default-features --features ann-hnsw --lib
      env:
        # deterministic-floats: BM25/ln/recip scoring must be bit-stable across
        # repeated searches; miri's default non-det floats break cache parity tests.
        MIRIFLAGS: "-Zmiri-disable-isolation -Zmiri-deterministic-floats"

  # Always build linux-x64 CLI after tests (cheap smoke compile).
  build-cli:
    name: Build CLI (linux-x64)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        cache: false
        target: x86_64-unknown-linux-gnu
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.3
      with:
        shared-key: cli
    - name: Build CLI
      run: cargo build --release --bin csm --features cli --target x86_64-unknown-linux-gnu --locked

  # Cross-platform CLI (arm64/macOS/Windows): PR path-filtered or always on push to main.
  build-cli-cross:
    name: Build CLI (${{ matrix.platform }}-${{ matrix.arch }})
    needs: [test, detect-changes]
    if: needs.detect-changes.outputs.cli_cross == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux
            arch: arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - platform: macos
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - platform: macos
            arch: x64
            runner: macos-latest
            target: x86_64-apple-darwin
          - platform: windows
            arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        cache: false
        target: ${{ matrix.target }}

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.3
      with:
        shared-key: cli

    - name: Install cross-compilation linker (Linux arm64)
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu
        echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

    - name: Build CLI
      run: cargo build --release --bin csm --features cli --target ${{ matrix.target }} --locked

  mcp-feature:
    needs: detect-changes
    if: needs.detect-changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROTOC: /usr/bin/protoc
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
    - name: Install Protobuf Compiler
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        cache: false
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.3
      with:
        shared-key: test
    # cargo test already compiles; no separate cargo build step
    - name: Test MCP feature
      run: cargo test --features mcp --locked -- --quiet

  mutation-test:
    # Fast profile: in-diff + unit tests only (--lib) + tight timeouts.
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.mutation == 'true'
    needs: [test, detect-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
      with:
        fetch-depth: 0

    - name: Fetch base for three-dot in-diff
      run: git fetch origin "${{ github.base_ref }}" --depth=50

    - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

    - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

    # Caching strategy:
    # - magic-nix-cache caches Nix store paths (compilers, toolchain, system libraries).
    # - actions/cache caches Cargo registry & target directories for faster incremental builds on cold host runners.
    - name: Cache cargo
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-mutation-${{ hashFiles('**/Cargo.lock') }}

    - name: Warm the mcp feature build the mutation profile compiles
      # scripts/mutation_test.sh now passes --features chaotic_semantic_memory/mcp,
      # because src/cli/mcp.rs and src/mcp/** are #[cfg(feature = "mcp")] and `mcp`
      # is not a default feature — without it, mutations in that code were reported
      # MISSED for lines the job never compiled. This job's target/ cache is keyed
      # on Cargo.lock and had never linked rmcp/axum/tower, so the first mutant run
      # would pay that link inside a per-build timeout. Building the test binaries
      # once here makes the mutation baseline incremental; the tight per-mutant
      # bound then measures rebuilds of one crate, as it is meant to.
      run: nix develop --command scripts/run-with-libs.sh cargo test --lib --no-run -p chaotic_semantic_memory -p csm-retrieval --features chaotic_semantic_memory/mcp
      timeout-minutes: 25

    - name: Run unit-target mutation tests
      run: nix develop --command scripts/run-with-libs.sh bash scripts/mutation_test.sh --ci fast
      env:
        MUTATION_THRESHOLD: ${{ github.event.pull_request.draft && '75' || '85' }}
        DIFF_TARGET: origin/${{ github.base_ref || 'main' }}
        MUTANTS_JOBS: "4"
        # Absolute timeout budget + fraction of viable (see scripts/mutation_test.sh)
        MUTATION_TIMEOUT_BUDGET: "5"
        MUTATION_TIMEOUT_FRACTION: "0.10"
        CARGO_TERM_COLOR: always
        RUST_BACKTRACE: "0"

    - name: Upload Mutation Test Artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: mutation-artifacts
        path: progress/mutation
        retention-days: 14

  wasm:
    needs: detect-changes
    if: needs.detect-changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
    - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
    - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
    # Caching strategy:
    # - magic-nix-cache caches Nix store paths (compilers, toolchain, system libraries).
    # - actions/cache caches Cargo registry & target directories for faster incremental builds on cold host runners.
    - name: Cache cargo
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
    # Build the artifact that release.yml publishes (same script, same profile and
    # target), then smoke-test it: `wasm_ci_release_artifact_identical`.
    - name: Build WASM (release/web — the artifact release publishes)
      run: |
        OUT="${{ github.workspace }}/wasm/pkg"
        nix develop --command bash scripts/build-wasm.sh release-web "${OUT}"
    - name: Check WASM
      run: nix develop --command cargo check --target wasm32-unknown-unknown -p csm-wasm
    - name: WASM size gate (same package as above)
      run: nix develop --command bash scripts/wasm_size_gate.sh "${{ github.workspace }}/wasm/pkg"
    - name: Verify WASM TS Freshness
      run: nix develop --command bash scripts/check-wasm-freshness.sh
    - name: WASM JS Smoke Test (release/web package)
      run: |
        cd wasm
        WASM_PACKAGE_DIR="${{ github.workspace }}/wasm/pkg" nix develop --command node test.js
    - name: Upload WASM package (release artifact)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: wasm-pkg-release-web
        path: wasm/pkg/
        retention-days: 7

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # scripts/check-goap-queue-issues.sh reads the tracker through `gh`, and the
    # default GITHUB_TOKEN cannot see issues unless the job asks. Job-level
    # permissions REPLACE the workflow-level block rather than merging into it,
    # so contents has to be restated here or actions/checkout loses its token.
    permissions:
      contents: read
      issues: read
    env:
      PROTOC: /usr/bin/protoc
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        cache: false
        components: clippy, rustfmt
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.3
      with:
        shared-key: test
    - name: Format check
      run: cargo fmt --all -- --check
    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
    - name: Documentation link validation (#840)
      run: bash scripts/check-docs-links.sh
    - name: Documentation link gate fixture
      run: bash scripts/test-check-docs-links.sh
    - name: Skill format validation (ADR-0096)
      run: bash scripts/validate-skill-format.sh
    - name: Skill catalog drift gate (#828)
      run: bash scripts/check-skill-catalog.sh
    - name: Skill catalog drift gate fixture
      run: bash scripts/test-skill-catalog-gate.sh
    # validate.sh runs the same `cargo test --all-targets --all-features` suite
    # as the `test` job, including tests/performance_targets.rs and its 20 ms p50
    # persistence-roundtrip ceiling. That ceiling is a property of the storage
    # medium (~1.2 ms RAM-backed vs 24.47 ms on the runner's disk-backed /tmp,
    # main run 34610334012), so the same tmpfs mitigation the `test` job uses
    # applies here: without it this job fails independently of the diff (run
    # 35846414646, no Rust change).
    - name: Use RAM-backed /tmp
      run: sudo mount -t tmpfs -o size=8g,mode=1777 tmpfs /tmp
    # The workflow YAML gate wired into scripts/validate.sh below prefers
    # yamllint and skipped on every runner before (`grep -rn yamllint
    # .github/workflows/` was empty). Plain `pip install yamllint` is not usable
    # here: ubuntu-24.04's system Python is PEP 668 externally-managed
    # (actions/runner-images#10781), so apt is used instead — same pattern as the
    # protobuf-compiler step in the aarch64 job, and it puts yamllint on PATH at
    # /usr/bin with no PATH or venv setup.
    - name: Install yamllint
      run: sudo apt-get update && sudo apt-get install -y yamllint
    # Git config is not versioned. Bootstrap this checkout before the strict
    # configuration gate; do not make validate.sh silently repair bad setups.
    - name: Install repository hooks
      run: bash scripts/install-hooks.sh
    - name: LOC gate
      # GITHUB_TOKEN is not in a step's environment unless the workflow puts it
      # there — `gh` reads it from env, so without this line the queue gate's
      # tracker half prints "SKIP — NOT A PASS" on every run and the STALE /
      # UNQUEUED drift #851 exists to catch sails. REQUIRED makes that skip
      # fatal here: on a runner with a token, silence is a bug, not a fallback.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CSM_GOAP_QUEUE_REQUIRED: "true"
      run: bash scripts/validate.sh

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
    - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
    - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
    - name: cargo deny check
      run: nix develop --command cargo deny --locked check

  test-benchmarks:
    name: Test Benchmark Workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROTOC: /usr/bin/protoc
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        cache: false
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.3
      with:
        shared-key: test
    - name: Benchmark workspace unit tests
      run: cargo test --manifest-path benchmarks/Cargo.toml --locked --quiet

  fuzz-build:
    name: Fuzz Workspace Build
    needs: detect-changes
    if: needs.detect-changes.outputs.fuzz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROTOC: /usr/bin/protoc
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
    - name: Install clang (libfuzzer-sys build)
      run: |
        sudo apt-get update
        sudo apt-get install -y clang
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        cache: false
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.3
      with:
        workspaces: fuzz
        shared-key: fuzz
    - name: Check all fuzz targets compile
      run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked
