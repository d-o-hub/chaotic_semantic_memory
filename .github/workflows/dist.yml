name: Dist

# Note: dist.yml is disabled to keep release.yml as the single authoritative release publisher.
# Tags pushed by auto-release.yml's ship job carry GITHUB_TOKEN, so they do not trigger
# tag-push workflows; ship dispatches release.yml explicitly instead.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  disabled-notice:
    runs-on: ubuntu-24.04
    steps:
      - name: Dist notice
        run: |
          echo "dist.yml is disabled. release.yml manages all release builds and uploads."
