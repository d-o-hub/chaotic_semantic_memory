name: Dist

# Note: dist.yml is disabled to keep release.yml as the single authoritative release publisher.
# Tags created with GITHUB_TOKEN in release.yml do not trigger tag-push workflows in Actions.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  disabled-notice:
    runs-on: ubuntu-24.04
    steps:
      - name: Dist notice
        run: |
          echo "dist.yml is disabled. release.yml manages all release builds and uploads."
