name: npm Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write  # Required for npm provenance (used when no NPM_TOKEN)

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      should-publish: ${{ steps.check.outputs.should-publish }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.inputs.tag || github.ref }}

    - name: Extract version from tag
      id: version
      run: |
        TAG="${{ github.event.inputs.tag || github.ref_name }}"
        VERSION="${TAG#v}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"

    - name: Check WASM feature exists
      id: check
      run: |
        if grep -q 'wasm' Cargo.toml; then
          echo "should-publish=true" >> $GITHUB_OUTPUT
        else
          echo "should-publish=false" >> $GITHUB_OUTPUT
          echo "::warning::No wasm feature found in Cargo.toml, skipping npm publish"
        fi

  build-wasm:
    runs-on: ubuntu-24.04
    needs: validate
    if: needs.validate.outputs.should-publish == 'true'
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.inputs.tag || github.ref }}

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        target: wasm32-unknown-unknown

    - name: Cache cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}

    - name: Install wasm-pack
      run: cargo install wasm-pack

    - name: Build WASM package
      env:
        WASM_OPT_FLAGS: "--enable-bulk-memory --enable-sign-ext"
      run: |
        wasm-pack build --target web --scope d-o-hub --out-dir pkg

    - name: Prepare npm package
      run: |
        cd pkg
        # Update package.json with proper metadata
        VERSION="${{ needs.validate.outputs.version }}"
        cat package.json | jq --arg v "$VERSION" '.version = $v' > package.json.tmp
        mv package.json.tmp package.json
        # Add provenance support fields
        cat package.json | jq '. += {
          "name": "@d-o-hub/chaotic_semantic_memory",
          "description": "AI memory systems with hyperdimensional vectors and chaotic reservoirs",
          "license": "MIT",
          "repository": {
            "type": "git",
            "url": "git+https://github.com/d-o-hub/chaotic_semantic_memory.git"
          },
          "homepage": "https://github.com/d-o-hub/chaotic_semantic_memory#readme",
          "keywords": ["ai", "memory", "hypervector", "reservoir", "wasm"],
          "sideEffects": false,
          "publishConfig": {
            "access": "public",
            "provenance": true
          }
        }' > package.json.tmp
        mv package.json.tmp package.json
        cat package.json

    - name: Upload WASM package
      uses: actions/upload-artifact@v7
      with:
        name: wasm-package
        path: pkg/
        retention-days: 7

  publish-npm:
    runs-on: ubuntu-24.04
    needs: [validate, build-wasm]
    if: needs.validate.outputs.should-publish == 'true'
    environment: npm
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.inputs.tag || github.ref }}

    - name: Download WASM package
      uses: actions/download-artifact@v8
      with:
        name: wasm-package
        path: pkg

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - name: Install latest npm
      run: npm install -g npm@latest

    - name: Publish to npm
      working-directory: pkg
      run: |
        VERSION="${{ needs.validate.outputs.version }}"
        WORKFLOW_NAME="npm-publish.yml"

        # Determine npm tag - prerelease versions need explicit tag
        if [[ "$VERSION" == *"- "* ]] || [[ "$VERSION" == *"-"* ]]; then
          NPM_TAG="next"
        else
          NPM_TAG="latest"
        fi

        if ! PUBLISHED_VERSIONS=$(npm view "@d-o-hub/chaotic_semantic_memory" versions --json --registry https://registry.npmjs.org 2>/dev/null); then
          echo "❌ Unable to query npm registry for published versions."
          exit 1
        fi

        if echo "$PUBLISHED_VERSIONS" | jq -e --arg v "$VERSION" 'index($v)' >/dev/null; then
          echo "Version ${VERSION} already published; skipping npm publish."
          exit 0
        fi

        echo "Publishing with workflow: ${WORKFLOW_NAME} (must match npmjs Trusted Publisher config)"

        # Try OIDC Trusted Publishing first (preferred)
        if npm publish --provenance --tag "$NPM_TAG" --access public 2>&1 | tee /tmp/npm-publish.log; then
          echo "✅ Published with OIDC Trusted Publishing"
          exit 0
        fi

        # Analyze OIDC failure
        if grep -q "404" /tmp/npm-publish.log; then
          echo "::error::OIDC 404 - Trusted Publisher workflow mismatch or not configured"
          echo "::error::Current workflow: ${WORKFLOW_NAME}"
          echo "::error::Fix: Go to npmjs.com/package/@d-o-hub/chaotic_semantic_memory/settings/trusted-publishers"
          echo "::error::Add Trusted Publisher for workflow: ${WORKFLOW_NAME}"
          echo "::error::If using multiple workflows, add entries for each (release.yml, npm-publish.yml)"
        fi

        # Check if NPM_TOKEN is available for fallback
        if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
          echo "::error::OIDC failed and NPM_TOKEN not configured"
          echo "::error::Fix: Configure Trusted Publisher on npmjs.com OR add NPM_TOKEN secret"
          exit 1
        fi

        # Fallback to NPM_TOKEN
        echo "OIDC failed, falling back to NPM_TOKEN..."
        npm publish --tag "$NPM_TAG" --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  notify:
    runs-on: ubuntu-24.04
    needs: [validate, publish-npm]
    if: always()
    steps:
    - name: Publish summary
      run: |
        echo "## npm Publish Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ needs.publish-npm.result }}" == "success" ]; then
          echo "✅ Successfully published @d-o-hub/chaotic-semantic-memory@${{ needs.validate.outputs.version }} to npm" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "- **Auth**: npm token" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Provenance**: OIDC verified" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Registry**: npmjs.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Scope**: @d-o-hub" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.validate.outputs.should-publish }}" == "false" ]; then
          echo "⚠️ Skipped: No WASM feature configured" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Publishing failed" >> $GITHUB_STEP_SUMMARY
        fi
