name: npm Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write  # Required for npm provenance (used when no NPM_TOKEN)

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      should-publish: ${{ steps.check.outputs.should-publish }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.inputs.tag || github.ref }}

    - name: Extract version from tag
      id: version
      run: |
        TAG="${{ github.event.inputs.tag || github.ref_name }}"
        VERSION="${TAG#v}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"

    - name: Check WASM feature exists
      id: check
      run: |
        if grep -q 'wasm' Cargo.toml; then
          echo "should-publish=true" >> $GITHUB_OUTPUT
        else
          echo "should-publish=false" >> $GITHUB_OUTPUT
          echo "::warning::No wasm feature found in Cargo.toml, skipping npm publish"
        fi

  build-wasm:
    runs-on: ubuntu-24.04
    needs: validate
    if: needs.validate.outputs.should-publish == 'true'
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.inputs.tag || github.ref }}

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        target: wasm32-unknown-unknown

    - name: Cache cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}

    - name: Install wasm-pack
      run: cargo install wasm-pack

    - name: Build WASM package
      env:
        WASM_OPT_FLAGS: "--enable-bulk-memory --enable-sign-ext"
      run: |
        wasm-pack build --target web --scope d-o-hub --out-dir pkg

    - name: Prepare npm package
      run: |
        cd pkg
        # Update package.json with proper metadata
        VERSION="${{ needs.validate.outputs.version }}"
        cat package.json | jq --arg v "$VERSION" '.version = $v' > package.json.tmp
        mv package.json.tmp package.json
        # Add provenance support fields
        cat package.json | jq '. += {
          "name": "@d-o-hub/chaotic_semantic_memory",
          "description": "AI memory systems with hyperdimensional vectors and chaotic reservoirs",
          "license": "MIT",
          "repository": {
            "type": "git",
            "url": "git+https://github.com/d-o-hub/chaotic_semantic_memory.git"
          },
          "homepage": "https://github.com/d-o-hub/chaotic_semantic_memory#readme",
          "keywords": ["ai", "memory", "hypervector", "reservoir", "wasm"],
          "sideEffects": false,
          "publishConfig": {
            "access": "public",
            "provenance": true
          }
        }' > package.json.tmp
        mv package.json.tmp package.json
        cat package.json

    - name: Upload WASM package
      uses: actions/upload-artifact@v7
      with:
        name: wasm-package
        path: pkg/
        retention-days: 7

  publish-npm:
    runs-on: ubuntu-24.04
    needs: [validate, build-wasm]
    if: needs.validate.outputs.should-publish == 'true'
    environment: npm
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.inputs.tag || github.ref }}

    - name: Download WASM package
      uses: actions/download-artifact@v8
      with:
        name: wasm-package
        path: pkg

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - name: Install latest npm
      run: npm install -g npm@latest

    - name: Publish to npm
      working-directory: pkg
      run: |
        VERSION="${{ needs.validate.outputs.version }}"
        
        # Determine npm tag - prerelease versions need explicit tag
        if [[ "$VERSION" == *"- "* ]] || [[ "$VERSION" == *"-"* ]]; then
          NPM_TAG="next"
        else
          NPM_TAG="latest"
        fi
        
        # Always use NPM_TOKEN if available (not OIDC)
        if [ -n "$NPM_TOKEN" ]; then
          echo "Publishing with npm token..."
          # Configure auth in home directory for npm to use
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
          npm publish --tag "$NPM_TAG" --access public
        else
          echo "Publishing with OIDC provenance..."
          npm publish --provenance --tag "$NPM_TAG" --access public
        fi
      env:
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  notify:
    runs-on: ubuntu-24.04
    needs: [validate, publish-npm]
    if: always()
    steps:
    - name: Publish summary
      run: |
        echo "## npm Publish Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ needs.publish-npm.result }}" == "success" ]; then
          echo "✅ Successfully published @d-o-hub/chaotic-semantic-memory@${{ needs.validate.outputs.version }} to npm" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "- **Auth**: npm token" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Provenance**: OIDC verified" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Registry**: npmjs.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Scope**: @d-o-hub" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.validate.outputs.should-publish }}" == "false" ]; then
          echo "⚠️ Skipped: No WASM feature configured" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Publishing failed" >> $GITHUB_STEP_SUMMARY
        fi
