name: Pre-Release Gate

on:
  # Deliberately no workflow_dispatch: a write-capable trigger combined with a
  # head_sha checkout is what CodeQL's actions/cache-poisoning queries report
  # (https://codeql.github.com/codeql-query-help/actions/actions-cache-poisoning-poisonable-step/);
  # workflow_run has read-only default-branch cache scope and is not reported.
  # Manual runs of the scheduled evidence tier go through the dispatch on
  # scheduled-evidence.yml instead.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  pr-drain-check:
    runs-on: ubuntu-24.04
    if: >-
      github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        persist-credentials: false

    - name: Check for blocking open PRs
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Get open PRs without hold-for-next or deferred labels
        OPEN_PRS=$(gh pr list --state open --json number,title,labels \
          --jq '[.[] | select(.labels == null or all(.labels[].name; . != "hold-for-next" and . != "deferred"))] | length')

        if [ "$OPEN_PRS" -gt 0 ]; then
          echo "❌ Found $OPEN_PRS open PRs without hold-for-next/deferred labels"
          gh pr list --state open
          exit 1
        fi
        echo "✅ No blocking open PRs"

  version-triad:
    runs-on: ubuntu-24.04
    if: >-
      github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        persist-credentials: false

    - name: Verify version triad integrity
      run: |
        CARGO_VERSION=$(grep '^version =' Cargo.toml | head -1 | cut -d'"' -f2)
        # CHANGELOG uses ## [version] - YYYY-MM-DD format (Keep a Changelog)
        # Use sed to avoid grep -P backslash escaping across YAML layers
        CHANGELOG_VERSION=$(sed -n 's/^## \[\([0-9.]*\)\].*/\1/p' CHANGELOG.md | head -1)
        WASM_VERSION=$(grep '"version"' wasm/package.json | cut -d'"' -f4)

        echo "Cargo.toml: $CARGO_VERSION"
        echo "CHANGELOG:  $CHANGELOG_VERSION"
        echo "wasm/pkg:   $WASM_VERSION"

        if [ "$CARGO_VERSION" != "$CHANGELOG_VERSION" ] || [ "$CARGO_VERSION" != "$WASM_VERSION" ]; then
          echo "❌ Version mismatch!"
          exit 1
        fi
        echo "✅ Version triad matches: $CARGO_VERSION"

  security-audit:
    runs-on: ubuntu-24.04
    if: >-
      github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        persist-credentials: false

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        cache: false

    - name: Install cargo-audit
      run: cargo install cargo-audit --locked

    - name: Run security audit
      # cargo audit (no --deny warnings) reports advisories visibly in CI logs
      # but does not fail the gate. Known unmaintained crates are documented
      # in plans/UNMAINTAINED_CRATES.md with migration plans.
      # If cargo audit ever exits non-zero, that indicates a NEW real vulnerability.
      run: cargo audit

  wasm-smoke-build:
    runs-on: ubuntu-24.04
    if: >-
      github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        persist-credentials: false

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        cache: false
        target: wasm32-unknown-unknown

    - name: WASM smoke build
      run: cargo check --target wasm32-unknown-unknown --features wasm

  planning-state-check:
    runs-on: ubuntu-24.04
    if: >-
      github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        persist-credentials: false

    - name: Verify ADR-0042 is Accepted
      run: |
        STATUS=$(grep -A2 "^## Status" plans/adr/0042-release-automation-v010.md | tail -1 | tr -d '\r')
        if [ "$STATUS" != "Accepted" ]; then
          echo "❌ ADR-0042 status is '$STATUS', expected 'Accepted'"
          exit 1
        fi
        echo "✅ ADR-0042 status is Accepted"

  benchmark-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: >-
      github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        persist-credentials: false
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        cache: false
    - name: Benchmark workspace unit tests
      run: cargo test --manifest-path benchmarks/Cargo.toml --locked --quiet
    - name: Run benchmark
      run: cargo run --manifest-path benchmarks/Cargo.toml -- --dataset-dir benchmarks/datasets/v1/small --mode retrieval-only --out-dir benchmarks/results/pre-release
    - name: Verify outputs
      run: |
        if [ ! -f benchmarks/results/pre-release/summary.json ]; then echo "Missing summary.json"; exit 1; fi
        if [ ! -f benchmarks/results/pre-release/results.jsonl ]; then echo "Missing results.jsonl"; exit 1; fi
        if [ ! -f benchmarks/results/pre-release/report.md ]; then echo "Missing report.md"; exit 1; fi
        grep -q "recall_at_1" benchmarks/results/pre-release/summary.json || (echo "Malformed summary.json"; exit 1)

  mutation-test:
    runs-on: ubuntu-24.04
    if: >-
      github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        persist-credentials: false
        fetch-depth: 0

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        cache: false

    - name: Install cargo-mutants
      uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0  # v2.87.22
      with:
        tool: cargo-mutants

    - name: Run unit-target mutation testing
      env:
        MUTATION_THRESHOLD: 85
        DIFF_TARGET: origin/main
        MUTANTS_JOBS: 4
      run: bash scripts/mutation_test.sh fast --ci

    - name: Upload Mutation Test Artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pre-release-mutation-artifacts
        path: progress/mutation
        retention-days: 30

  gate-summary:
    runs-on: ubuntu-24.04
    needs: [pr-drain-check, version-triad, security-audit, wasm-smoke-build, planning-state-check, benchmark-gate, mutation-test]
    if: always()
    steps:
    - name: Gate summary
      run: |
        echo "## Pre-Release Gate Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| PR Drain | ${{ needs.pr-drain-check.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Version Triad | ${{ needs.version-triad.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Security Audit | ${{ needs.security-audit.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| WASM Build | ${{ needs.wasm-smoke-build.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Planning State | ${{ needs.planning-state-check.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Benchmark Gate | ${{ needs.benchmark-gate.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Unit-Target Mutation Score | ${{ needs.mutation-test.result }} |" >> $GITHUB_STEP_SUMMARY

        if [ "${{ needs.pr-drain-check.result }}" != "success" ] || \
           [ "${{ needs.version-triad.result }}" != "success" ] || \
           [ "${{ needs.security-audit.result }}" != "success" ] || \
           [ "${{ needs.wasm-smoke-build.result }}" != "success" ] || \
           [ "${{ needs.planning-state-check.result }}" != "success" ] || \
           [ "${{ needs.benchmark-gate.result }}" != "success" ] || \
           [ "${{ needs.mutation-test.result }}" != "success" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "❌ **Gate failed** - one or more checks did not pass" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ **All gates passed**" >> $GITHUB_STEP_SUMMARY
