name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      recover:
        description: Retry missing artifacts for a release even when its tag exists
        required: false
        default: false
        type: boolean
      recovery_tag:
        description: Required when recover=true (e.g. v0.3.9)
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"

jobs:
  validate:
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      actions: read
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release-needed: ${{ steps.tag.outputs.release-needed }}
      release-ref: ${{ steps.tag.outputs.release-ref }}
      release-sha: ${{ steps.target_sha.outputs.sha }}
      is-recovery: ${{ steps.tag.outputs.is-recovery }}
      cli-matrix: ${{ steps.cli_matrix.outputs.json }}
    steps:
    - name: Determine target commit SHA
      id: target_sha
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.recover }}" = "true" ]; then
          TAG_NAME="${{ inputs.recovery_tag }}"
          if [ -z "$TAG_NAME" ]; then
            echo "::error::recovery_tag is required when recover=true."
            return 1 2>/dev/null || exit 1
          fi
          git fetch --tags --force
          SHA=$(git rev-list -n 1 "$TAG_NAME" || true)
          if [ -z "$SHA" ]; then
            echo "::error::Tag $TAG_NAME not found."
            return 1 2>/dev/null || exit 1
          fi
          echo "sha=$SHA" >> $GITHUB_OUTPUT
        else
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$SHA" >> $GITHUB_OUTPUT
        fi

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        ref: ${{ steps.target_sha.outputs.sha }}

    - name: Compute the CLI release matrix
      id: cli_matrix
      # Issue #974: one source for the platform list. The build matrix and the
      # verifier's expected asset set both read this output, so adding a target
      # cannot leave the verifier checking a stale hardcoded copy.
      # Issue #1011: `release-cli-matrix.sh` emits multi-line JSON, and the runner
      # parses $GITHUB_OUTPUT as one `key=value` per line — `echo "json=$(…)"` made
      # it reject lines 2-6 with "Invalid format" and fail `validate` before any
      # gate check. The heredoc form below is the documented way to write a
      # multi-line value. Fixture: scripts/test-release-cli-matrix.sh.
      run: |
        {
          echo 'json<<CSM_CLI_MATRIX_EOF'
          bash scripts/release-cli-matrix.sh --json
          echo 'CSM_CLI_MATRIX_EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Verify CI and Pre-Release Gate are green for target commit
      run: |
        SHA="${{ steps.target_sha.outputs.sha }}"
        echo "Checking gates for target SHA ${SHA}..."

        # Verify CI
        CI_RUN=$(gh run list --repo "${{ github.repository }}" --workflow=ci.yml --commit "$SHA" --limit 1 --json status,conclusion --jq '.[0] // {}')
        CI_STATUS=$(echo "$CI_RUN" | jq -r '.status // "missing"')
        CI_CONCLUSION=$(echo "$CI_RUN" | jq -r '.conclusion // "none"')
        echo "CI on ${SHA}: status=${CI_STATUS} conclusion=${CI_CONCLUSION}"
        if [ "$CI_STATUS" != "completed" ] || [ "$CI_CONCLUSION" != "success" ]; then
          echo "::error::Refusing release: CI on ${SHA} is ${CI_STATUS}/${CI_CONCLUSION}, expected completed/success."
          return 1 2>/dev/null || exit 1
        fi

        # Verify Pre-Release Gate
        #
        # Both this workflow and pre-release-gate.yml are triggered by the same `CI` completion, so the
        # gate is still running when this step executes: its `gate-summary` fans in on six jobs
        # (pre-release-gate.yml:184). Measured on the release that settled it (run 41110522627, 642238f0):
        # the gate's first job started 18:53:01 and `gate-summary` completed 18:59:01, so the *run* this
        # poll waits for is 6m00s — of which `security-audit` (18:54:14 -> 18:58:52, 4m38s) is the slowest
        # single job, close to the 4m37s first written here. `validate` ran 18:52:06 -> 19:02:29, so
        # ~6m55s of that was this wait, and it produced completed/success and the v0.3.9 tag. The pre-fix
        # one-shot read would have seen in_progress/none at that moment — run 39648046550 reached the step
        # in 62s while its gate run 39648046307 was open 17:55:10 -> 17:59:17 — though no *false* refusal
        # is on record yet: 4ac8422d's refusal (run 41078875362) was a genuinely red gate. Fail-closed is
        # preserved: anything but completed/success still blocks, and a gate that never starts costs the
        # deadline rather than failing instantly, because sibling run creation is not ordered. `validate`
        # declares no timeout-minutes, so the 360-min default covers this 30-min wait (~4.3x the measured
        # 6m55s, not the ~6.5x a job-level figure suggested) plus the rest of the job.
        #
        # This deliberately keeps a poll, against the standing rule in progress/LEARNINGS.md
        # ("Polling a gate is a ceiling you will raise forever; migrate to the event", 2026-09-30). The
        # rule came from `wait-for-ci`, which polled a run that might never be *scheduled* — an
        # unbounded quantity, so the ceiling had to be raised twice. What is polled here is bounded by
        # the gate's own job timeouts. Re-keying the trigger to `workflows: ['Pre-Release Gate']` was
        # option 2 in #953 and is rejected on one measured ground: it turns "the gate never ran" into
        # *no release run at all*, and this repo spent eight days in exactly that silent state
        # (0f77c0d0, 2026-10-22T06:30Z, to #947 on 2026-10-30): 69 consecutive release runs, every one
        # with zero jobs, no notification, and nothing publishing. Revisit the poll if this deadline is
        # ever hit while a gate run was actually in flight — that would mean the 30m bound is wrong, not
        # that the design is.
        GATE_DEADLINE=$(( $(date +%s) + 1800 ))
        # #960: name the job that blocked the release. The blended run verdict is
        # byte-identical for a RUSTSEC finding, a red benchmark and "somebody has an
        # open PR", so a refusal could not be triaged from the release log. The
        # per-job conclusions are one API call away; scripts/gate-failure-detail.sh
        # parses them from stdin so the logic is fixture-tested without network
        # (scripts/test-gate-failure-detail.sh) and always exits 0 — a diagnostic must
        # never itself become the reason a release refuses.
        gate_refusal_detail() {
          if [ "${GATE_RUN_ID}" = "missing" ] || [ "${GATE_RUN_ID}" = "null" ]; then
            echo "SUMMARY: no pre-release-gate run exists for ${SHA} — that workflow never started for this commit"
            return 0
          fi
          gh api "repos/${{ github.repository }}/actions/runs/${GATE_RUN_ID}/jobs" 2>/dev/null \
            | bash scripts/gate-failure-detail.sh "${GATE_RUN_ID}" "${SHA}" \
            || echo "SUMMARY: gate job detail could not be rendered for run ${GATE_RUN_ID}"
        }
        while :; do
          GATE_RUN=$(gh run list --repo "${{ github.repository }}" --workflow=pre-release-gate.yml --commit "$SHA" --limit 1 --json databaseId,status,conclusion --jq '.[0] // {}')
          GATE_RUN_ID=$(echo "$GATE_RUN" | jq -r '.databaseId // "missing"')
          GATE_STATUS=$(echo "$GATE_RUN" | jq -r '.status // "missing"')
          GATE_CONCLUSION=$(echo "$GATE_RUN" | jq -r '.conclusion // "none"')
          echo "Pre-Release Gate on ${SHA}: status=${GATE_STATUS} conclusion=${GATE_CONCLUSION} run=${GATE_RUN_ID}"
          if [ "$GATE_STATUS" = "completed" ]; then
            break
          fi
          if [ "$(date +%s)" -ge "$GATE_DEADLINE" ]; then
            GATE_DETAIL="$(gate_refusal_detail)"
            printf '%s\n' "${GATE_DETAIL}"
            GATE_SUMMARY="$(printf '%s\n' "${GATE_DETAIL}" | sed -n 's/^SUMMARY: //p')"
            echo "::error::Refusing release: Pre-Release Gate on ${SHA} had no verdict within 30m (last seen ${GATE_STATUS}/${GATE_CONCLUSION}). ${GATE_SUMMARY}"
            return 1 2>/dev/null || exit 1
          fi
          sleep 60
        done
        if [ "$GATE_CONCLUSION" != "success" ]; then
          GATE_DETAIL="$(gate_refusal_detail)"
          printf '%s\n' "${GATE_DETAIL}"
          GATE_SUMMARY="$(printf '%s\n' "${GATE_DETAIL}" | sed -n 's/^SUMMARY: //p')"
          echo "::error::Refusing release: Pre-Release Gate on ${SHA} is ${GATE_STATUS}/${GATE_CONCLUSION}, expected completed/success. ${GATE_SUMMARY}"
          return 1 2>/dev/null || exit 1
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        cache: false
        toolchain: stable

    - name: Extract version from Cargo.toml
      id: version
      run: |
        VERSION=$(grep '^version =' Cargo.toml | head -1 | cut -d'"' -f2)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"

    - name: Verify changelog entry exists
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        if ! grep -q "^## \\[${VERSION}\\]" CHANGELOG.md; then
          echo "❌ Missing changelog entry for ${VERSION}"
          return 1 2>/dev/null || exit 1
        fi
        HEADER_COUNT=$(grep -c "^## \\[${VERSION}\\]" CHANGELOG.md || true)
        if [ "$HEADER_COUNT" -gt 1 ]; then
          echo "❌ Duplicate CHANGELOG header for ${VERSION} found"
          return 1 2>/dev/null || exit 1
        fi
        if ! grep -q "^## \\[${VERSION}\\] - [0-9]\\{4\\}-[0-9]\\{2\\}-[0-9]\\{2\\}" CHANGELOG.md; then
          echo "❌ CHANGELOG header for ${VERSION} missing date"
          return 1 2>/dev/null || exit 1
        fi
        echo "✅ CHANGELOG validation passed"

    - name: Verify local version synchronization
      run: |
        bash scripts/verify-version-sync.sh

    - name: Ensure release tag exists
      id: tag
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        TAG="v${VERSION}"
        echo "release-ref=${TAG}" >> $GITHUB_OUTPUT
        git fetch --tags --force
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.recover }}" = "true" ]; then
            echo "Tag ${TAG} exists; recovery mode active."
            echo "release-needed=true" >> $GITHUB_OUTPUT
            echo "is-recovery=true" >> $GITHUB_OUTPUT
            return 0 2>/dev/null || exit 0
          fi
          echo "Tag ${TAG} already exists; skipping release."
          echo "release-needed=false" >> $GITHUB_OUTPUT
          echo "is-recovery=false" >> $GITHUB_OUTPUT
          return 0 2>/dev/null || exit 0
        fi

        tag="$TAG"
        echo "Tagging ${tag}"
        git tag "${tag}"
        # Trigger remote update via git
        git push origin "${tag}"
        echo "Created tag ${TAG}"
        echo "release-needed=true" >> $GITHUB_OUTPUT
        echo "is-recovery=false" >> $GITHUB_OUTPUT

    - name: Create pull request with regenerated llms.txt
      if: steps.tag.outputs.release-needed == 'true' && steps.tag.outputs.is-recovery != 'true'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore: regenerate llms.txt for release [skip ci]"
        branch: regenerate-llms-${{ steps.version.outputs.version }}-${{ github.run_id }}
        title: "chore: regenerate llms.txt for v${{ steps.version.outputs.version }}"
        body: |
          This PR updates llms.txt and llms-full.txt as part of the release workflow.
        labels: automated
        add-paths: llms.txt,llms-full.txt
        base: main

    - name: Validate package assembly
      run: |
        cargo package --list --allow-dirty > /dev/null
        echo "✅ Package assembly validated"

  build-cli-matrix:
    strategy:
      matrix:
        include: ${{ fromJSON(needs.validate.outputs.cli-matrix) }}
    runs-on: ${{ matrix.runner }}
    needs: validate
    if: needs.validate.outputs.release-needed == 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.validate.outputs.release-ref }}

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        cache: false
        toolchain: stable
        target: ${{ matrix.target }}

    - name: Install cross-compilation linker (Linux arm64)
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu
        echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

    - name: Build release binary
      run: cargo build --release -p chaotic_semantic_memory --target ${{ matrix.target }}

    - name: Prepare binary artifact
      shell: bash
      run: |
        mkdir -p release
        BINARY_NAME=csm-${{ matrix.platform }}-${{ matrix.arch }}
        if [ "${{ matrix.platform }}" = "win32" ]; then
          BINARY_NAME="${BINARY_NAME}.exe"
          cp target/${{ matrix.target }}/release/csm.exe release/${BINARY_NAME}
        else
          cp target/${{ matrix.target }}/release/csm release/${BINARY_NAME}
        fi
        cd release
        tar -czvf csm-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz ${BINARY_NAME}

    - name: Upload binary artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: csm-${{ matrix.platform }}-${{ matrix.arch }}
        path: release/*.tar.gz
        retention-days: 30

  build-wasm:
    runs-on: ubuntu-24.04
    needs: validate
    if: needs.validate.outputs.release-needed == 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.validate.outputs.release-ref }}

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        cache: false
        toolchain: stable

    - name: Install WASM target
      run: rustup target add wasm32-unknown-unknown

    - name: Build WASM release
      run: cargo build --target wasm32-unknown-unknown --release -p csm-wasm

    - name: Prepare WASM artifact
      run: |
        mkdir -p release
        cp target/wasm32-unknown-unknown/release/csm_wasm.wasm release/chaotic_semantic_memory.wasm
        cd release
        tar -czvf chaotic_semantic_memory-${{ needs.validate.outputs.version }}-wasm.tar.gz chaotic_semantic_memory.wasm

    - name: Upload WASM artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: wasm-artifact
        path: release/*.tar.gz
        retention-days: 30

  # crates.io publishing lives in publish-crates.yml, not in this file. crates.io
  # refuses OIDC tokens minted from the `workflow_run` event that triggers release.yml
  # (release.yml:4-7), so no edit to a job here could ever have used Trusted
  # Publishing: the trigger had to move, not the job.
  #
  # `verify-release` still probes the nine crates and still reds the run when they are
  # absent, by design — that is how v0.3.9 ended up missing from crates.io for weeks
  # while the release itself looked finished. It now names the remedy instead of
  # waiting for a job: dispatch publish-crates.yml, then re-run verify-release.

  create-github-release:
    runs-on: ubuntu-24.04
    needs: [validate, build-cli-matrix, build-wasm]
    if: needs.validate.outputs.release-needed == 'true'
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.validate.outputs.release-ref }}
        fetch-depth: 0

    - name: Download CLI binary artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: csm-*
        path: release
        merge-multiple: true

    - name: Download WASM artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: wasm-artifact
        path: release

    - name: Compute SHA-256 Checksums
      run: |
        cd release
        sha256sum *.tar.gz > SHA256SUMS
        cat SHA256SUMS

    - name: Extract changelog
      id: changelog
      run: |
        VERSION="${{ needs.validate.outputs.version }}"
        CHANGELOG_CONTENT=$(awk -v ver="$VERSION" '
          /^## \[/ {
            if (found) exit
            if (index($0, "[" ver "]") > 0) { found=1; next }
          }
          found { print }
        ' CHANGELOG.md)
        if [ -z "$CHANGELOG_CONTENT" ]; then
          echo "Release $VERSION" > release_notes.md
        else
          printf '%s\n' "$CHANGELOG_CONTENT" > release_notes.md
        fi

    - name: Create or update GitHub Release with Draft -> Publish flow
      run: |
        VERSION="${{ needs.validate.outputs.version }}"
        TAG="v${VERSION}"

        if gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1; then
          echo "GitHub Release $TAG exists. Ensuring missing assets are attached..."
          for file in release/*; do
            filename=$(basename "$file")
            if gh release view "$TAG" --repo ${{ github.repository }} --json assets --jq '.assets[].name' | grep -q "^${filename}$"; then
              echo "  ⏭️ Asset $filename already attached, skipping"
            else
              echo "  Uploading missing asset $filename..."
              gh release upload "$TAG" "$file" --repo ${{ github.repository }} --clobber
            fi
          done
        else
          echo "Creating draft release for $TAG..."
          gh release create "$TAG" release/* \
            --repo ${{ github.repository }} \
            --title "$TAG" \
            --notes-file release_notes.md \
            --draft

          echo "Publishing release $TAG..."
          gh release edit "$TAG" --repo ${{ github.repository }} --draft=false
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm-wasm:
    runs-on: ubuntu-24.04
    needs: [validate, build-wasm]
    if: needs.validate.outputs.release-needed == 'true'
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.validate.outputs.release-ref }}

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        cache: false
        toolchain: stable
        target: wasm32-unknown-unknown

    - name: Install wasm-pack
      run: cargo install wasm-pack

    - name: Check npm status
      id: npm-check
      run: |
        VERSION="${{ needs.validate.outputs.version }}"
        NPM_VERSION=$(npm view @d-o-hub/chaotic_semantic_memory version 2>/dev/null || echo "none")
        if [ "$NPM_VERSION" = "$VERSION" ]; then
          echo "already-published=true" >> $GITHUB_OUTPUT
        else
          echo "already-published=false" >> $GITHUB_OUTPUT
        fi

    - name: Build WASM package
      if: steps.npm-check.outputs.already-published != 'true'
      run: |
        if ! grep -q '^\[package.metadata.wasm-pack.profile.release\]' crates/csm-wasm/Cargo.toml; then
          cat >> crates/csm-wasm/Cargo.toml <<'EOF'

        [package.metadata.wasm-pack.profile.release]
        wasm-opt = ["-O4", "--enable-bulk-memory"]
        EOF
        fi
        bash scripts/build-wasm.sh release-web
        jq ".version = \"${{ needs.validate.outputs.version }}\"" wasm/package.json > wasm/package.json.tmp
        mv wasm/package.json.tmp wasm/package.json

    - name: Publish WASM to npm
      if: steps.npm-check.outputs.already-published != 'true'
      run: |
        cd wasm
        # Issue #955: no fallback publish. publishConfig.provenance makes the
        # retry harmless to the artifact but buries the first error; if provenance
        # ever stops being configured, the retry silently becomes an unattested
        # publish. A failed attested publish is a red job.
        npm publish --provenance --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-npm-cli:
    runs-on: ubuntu-24.04
    needs: [validate, build-cli-matrix, create-github-release]
    if: needs.validate.outputs.release-needed == 'true'
    environment: npm-cli
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.validate.outputs.release-ref }}

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - name: Download CLI binary artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: csm-*
        path: cli-artifacts
        merge-multiple: true

    - name: Stage binaries inside npm package
      shell: bash
      run: |
        rm -f cli-npm/bin/* || true
        mkdir -p cli-npm/bin
        shopt -s nullglob
        COUNT=0
        for archive in cli-artifacts/*.tar.gz; do
          tar -xzf "$archive" -C cli-npm/bin
          COUNT=$((COUNT + 1))
        done
        # Issue #974: the expected count comes from the same matrix output that
        # drives build-cli-matrix; a hardcoded 5 would drift when a target changes.
        EXPECTED_COUNT="$(jq 'length' <<< '${{ needs.validate.outputs.cli-matrix }}')"
        if [ "$COUNT" -lt "$EXPECTED_COUNT" ]; then
          echo "::error::Missing platform binaries! Expected ${EXPECTED_COUNT}, found $COUNT."
          return 1 2>/dev/null || exit 1
        fi

    - name: Check npm status
      id: npm-check
      run: |
        VERSION="${{ needs.validate.outputs.version }}"
        NPM_VERSION=$(npm view @d-o-hub/csm version 2>/dev/null || echo "none")
        if [ "$NPM_VERSION" = "$VERSION" ]; then
          echo "already-published=true" >> $GITHUB_OUTPUT
        else
          echo "already-published=false" >> $GITHUB_OUTPUT
        fi

    - name: Build CLI npm package
      if: steps.npm-check.outputs.already-published != 'true'
      run: |
        VERSION="${{ needs.validate.outputs.version }}"
        jq ".version = \"$VERSION\"" cli-npm/package.json > cli-npm/package.json.tmp
        mv cli-npm/package.json.tmp cli-npm/package.json
        cp LICENSE cli-npm/

    - name: Publish CLI to npm
      if: steps.npm-check.outputs.already-published != 'true'
      run: |
        cd cli-npm
        # Issue #955: no fallback publish. publishConfig.provenance makes the
        # retry harmless to the artifact but buries the first error; if provenance
        # ever stops being configured, the retry silently becomes an unattested
        # publish. A failed attested publish is a red job.
        npm publish --provenance --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  verify-release:
    runs-on: ubuntu-24.04
    needs: [validate, create-github-release, publish-npm-wasm, publish-npm-cli]
    if: always() && needs.validate.outputs.release-needed == 'true'
    steps:
    - name: Verify complete release across all registries
      run: |
        VERSION="${{ needs.validate.outputs.version }}"
        ERRORS=""
        echo "## Release Verification for v${VERSION}" >> $GITHUB_STEP_SUMMARY

        check_with_retry() {
          local name="$1"
          local check_cmd="$2"
          local max_retries=8
          local delays=(5 10 15 20 30 45 60 60)
          local attempt=0
          while [ $attempt -lt $max_retries ]; do
            if eval "$check_cmd"; then
              echo "✅ $name: Published" >> $GITHUB_STEP_SUMMARY
              return 0
            fi
            attempt=$((attempt + 1))
            sleep ${delays[$attempt - 1]}
          done
          ERRORS="${ERRORS}${name}; "
          echo "❌ $name: Missing" >> $GITHUB_STEP_SUMMARY
          return 1
        }

        # Every probe is a function invoked by name, for two reasons that are the same shape.
        # check_with_retry evals its command once per attempt, so a probe written inline as
        # "[ "$(npm view …)" = "$VERSION" ]" in a double-quoted argument has already been substituted
        # by the caller: eval then re-runs the literal `[[ 0.3.9 = 0.3.9 ]]` eight times and the
        # 245 s backoff can never observe a registry that propagated late (#972). A function name has
        # nothing left to interpolate. And the inline form cannot survive two parse layers anyway —
        # the pattern this step shipped, '"vers":"$VERSION"', is collapsed by the outer quotes into
        # 'vers:0.3.9', which the sparse index does not contain (#971). Same splice as the four
        # publish-side probes above, reached from the other direction.
        crates_io_path() { bash scripts/crates-io-index-path.sh "$1"; }
        published_on_crates_io() {
          local crate="$1" path
          path="$(crates_io_path "${crate}")"
          curl -sL "https://index.crates.io/${path}" | grep -qF "\"vers\":\"$VERSION\""
        }
        published_on_npm() {
          [ "$(npm view "$1" version 2>/dev/null || echo none)" = "$VERSION" ]
        }
        npm_attestation_present() {
          local pkg="$1" encoded doc
          # Issue #955: `.dist.attestations` is served only by the abbreviated
          # packument. `npm view <pkg> dist --json` reads the full packument and
          # returns no attestations key at all, so a probe written that way says
          # "missing" for an attested release. One segment short was the original
          # bug; this query names the field and the endpoint.
          encoded="${pkg/\//%2f}"
          doc="$(curl -sSL -H 'Accept: application/vnd.npm.install-v1+json' \
            "https://registry.npmjs.org/${encoded}")"
          # Measured on the live registry 2026-11-03: the abbreviated packument
          # serves `dist.attestations = {url, provenance: {predicateType}}`.
          # There is no `provenance.url` field; a probe written against that
          # invented path reports "missing" for an attested release, which is the
          # same one-segment-short class as the original bug.
          jq -e --arg v "$VERSION" \
            '(.versions[$v].version == $v)
              and (.versions[$v].dist.attestations.url != null)
              and (.versions[$v].dist.attestations.provenance.predicateType != null)' \
            <<< "${doc}" >/dev/null
        }

        # Issue #974: every published crate, not only the root. The set is the
        # publish order plus csm-duckdb; csm-cli/csm-wasm are workspace members
        # that are never published to crates.io.
        CRATES_PUBLISHED="csm-chaos csm-core-lib csm-traits csm-embedding csm-memory csm-retrieval csm-persistence chaotic_semantic_memory csm-duckdb"
        for crate in ${CRATES_PUBLISHED}; do
          if ! check_with_retry "crates.io/${crate}" "published_on_crates_io ${crate}"; then :; fi
        done
        for pkg in @d-o-hub/chaotic_semantic_memory @d-o-hub/csm; do
          if ! check_with_retry "npm (${pkg}) version" "published_on_npm ${pkg}"; then :; fi
          if ! check_with_retry "npm (${pkg}) provenance" "npm_attestation_present ${pkg}"; then :; fi
        done

        # Issue #974: the release's assets, not its existence. The CLI list comes
        # from the same job output that drives build-cli-matrix, so adding a
        # target cannot leave a hardcoded copy behind.
        CLI_MATRIX='${{ needs.validate.outputs.cli-matrix }}'
        EXPECTED_ASSETS="SHA256SUMS chaotic_semantic_memory-${VERSION}-wasm.tar.gz"
        while IFS=$'\t' read -r platform arch; do
          [ -n "${platform}" ] || continue
          EXPECTED_ASSETS="${EXPECTED_ASSETS} csm-${platform}-${arch}.tar.gz"
        done < <(jq -r '.[] | [.platform, .arch] | @tsv' <<< "${CLI_MATRIX}")
        EXPECTED_COUNT="$(wc -w <<< "${EXPECTED_ASSETS}" | tr -d ' ')"
        ASSETS="$(gh release view "v${VERSION}" --repo ${{ github.repository }} --json assets --jq '.assets[].name' 2>/dev/null || true)"
        if [ -z "${ASSETS}" ]; then
          ERRORS="${ERRORS}github-assets; "
          echo "❌ GitHub Release assets: missing (no release or no assets)" >> $GITHUB_STEP_SUMMARY
        else
          MISSING_ASSETS=""
          for asset in ${EXPECTED_ASSETS}; do
            if ! grep -qxF "${asset}" <<< "${ASSETS}"; then
              MISSING_ASSETS="${MISSING_ASSETS} ${asset}"
              ERRORS="${ERRORS}asset:${asset}; "
            fi
          done
          if [ -n "${MISSING_ASSETS}" ]; then
            echo "❌ GitHub Release assets: missing${MISSING_ASSETS}" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ GitHub Release assets: ${EXPECTED_COUNT}/${EXPECTED_COUNT}" >> $GITHUB_STEP_SUMMARY
          fi
        fi

        if [ -n "$ERRORS" ]; then
          echo "::error::Partial release detected! Missing: ${ERRORS}"
          # A crates.io miss is no longer a failed job to re-run: publishing there is a
          # human dispatch now, because crates.io refuses OIDC tokens minted from this
          # file's `workflow_run` trigger. Say what closes the gap, or the red run reads
          # as a flake and the release ships half-done — which is how 0.3.9 happened.
          if [[ "$ERRORS" == *crates.io/* ]]; then
            echo "::error title=Crates.io not published::dispatch publish-crates.yml with ref refs/tags/v${VERSION} and version ${VERSION}, then re-run this job"
          fi
          return 1 2>/dev/null || exit 1
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  no-verdict:
    # Issue #969: a run whose trigger was not a successful CI push must say so.
    # Without this job, `validate` and every dependent job skip and only `notify`
    # executes — GitHub renders that all-skipped-plus-one-green shape as success,
    # which is exactly how release run 41186134783 published nothing and looked
    # green. The sibling pre-release gate got this treatment in #903.
    runs-on: ubuntu-24.04
    needs: [validate]
    if: always() && needs.validate.result != 'success'
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Explain the missing release verdict
      run: |
        bash scripts/release-no-verdict.sh \
          "${{ github.event_name }}" \
          "${{ github.event.workflow_run.event || 'dispatch' }}" \
          "${{ github.event.workflow_run.conclusion || 'n/a' }}"

  notify:
    runs-on: ubuntu-24.04
    # Issue #969: render the verdict from explicit sibling results, not a fixed
    # sentence. `if: always()` alone is what let a partial or absent release read
    # as routine; the results are read in scripts/release-verdict.sh.
    needs: [validate, build-cli-matrix, build-wasm, create-github-release, publish-npm-wasm, publish-npm-cli, verify-release, no-verdict]
    if: always()
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Release verdict
      run: bash scripts/release-verdict.sh >> "$GITHUB_STEP_SUMMARY"
      env:
        VERSION: ${{ needs.validate.outputs.version }}
        EVENT_NAME: ${{ github.event_name }}
        RELEASE_NEEDED: ${{ needs.validate.outputs.release-needed }}
        VALIDATE_RESULT: ${{ needs.validate.result }}
        BUILD_CLI_RESULT: ${{ needs.build-cli-matrix.result }}
        BUILD_WASM_RESULT: ${{ needs.build-wasm.result }}
        NPM_WASM_RESULT: ${{ needs.publish-npm-wasm.result }}
        NPM_CLI_RESULT: ${{ needs.publish-npm-cli.result }}
        RELEASE_RESULT: ${{ needs.create-github-release.result }}
        VERIFY_RESULT: ${{ needs.verify-release.result }}
