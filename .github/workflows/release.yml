name: release

# Publishing contract (ported from do-harness's release pipeline, adapted to
# this repository's registries and gates):
#
#   - `v*` tag push: preflight (`validate`) verifies the tagged commit — the
#     tag must equal the root `[package].version`, and CI plus the Pre-Release
#     Gate must already be green for that exact commit — then the build matrix
#     packages the CLI (and the WASM artifact), crates.io publishes through the
#     `publish-crates.yml` dispatch (ADR-0104: crates.io refuses OIDC tokens
#     minted from any trigger this file could carry the publish in), npm
#     publishes the wrapper packages, and the release job creates the GitHub
#     Release with `SHA256SUMS`.
#   - tagged `workflow_dispatch`: release that tag end to end —
#     `gh workflow run release.yml -f tag=vX.Y.Z`. A dispatch runs *this* file
#     (the default branch's) against the tag's commit, so a pipeline fix
#     applies to an already-pushed tag without deleting and re-pushing it.
#     Every publish step is idempotent: crates.io and npm versions already
#     published are skipped, and an existing GitHub Release has its assets
#     replaced. This is the recovery path (it replaces the old
#     `recover=true`/`recovery_tag` inputs).
#   - untagged `workflow_dispatch`: dry run — build and package every target
#     but never publish. Registry publication is always coupled to an immutable
#     version tag and its GitHub Release.
#
# Tags are cut by `auto-release.yml`'s `ship` job (or by a human), never by
# this workflow: a tag pushed with GITHUB_TOKEN does not trigger tag-push
# workflows, which is why `ship` dispatches this file explicitly.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.3.9). Empty = dry run on this ref."
        type: string
        default: ""
      publish:
        description: "Deprecated safety switch; publishing still requires tag"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  # The tag this run releases. A tag push carries it in `github.ref_name`; the
  # recovery dispatch passes it as an input. Jobs that must act on the tag
  # rather than on the triggering ref read RELEASE_TAG, and `inputs.tag` is the
  # switch that says "this dispatch names a tag".
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  # Keyed on the effective release tag, not on the triggering ref: a `vX.Y.Z`
  # tag push runs under `refs/tags/vX.Y.Z`, while a recovery dispatch
  # (`gh workflow run release.yml -f tag=vX.Y.Z`) runs under the default branch,
  # so keying on `github.ref` put the two runs in different groups and let them
  # race over the same GitHub Release. A tag push supplies `github.ref_name`
  # (the tag) with no input; a dispatch supplies `inputs.tag`, falling back to
  # the ref name for an untagged dry run.
  group: release-${{ inputs.tag || github.ref_name }}
  # `queue: max` so more than one pending run can wait in the group. The default
  # (`single`) cancels an already-`pending` run when a new run is queued into
  # the same group, so a recovery dispatch that lands while the tag push is
  # still pending would cancel the push — and the release would have to be
  # dispatched again by hand. `cancel-in-progress` must stay false:
  # `queue: max` with `cancel-in-progress: true` is a workflow validation error.
  queue: max
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    # The gate poll below waits up to 30 minutes for the Pre-Release Gate run
    # that shadows the CI run this release is verified against; keep headroom
    # for the rest of the job on top of that measured wait.
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release-needed: ${{ steps.tag.outputs.release-needed }}
      release-ref: ${{ steps.tag.outputs.release-ref }}
      release-sha: ${{ steps.target_sha.outputs.sha }}
      cli-matrix: ${{ steps.cli_matrix.outputs.json }}
    steps:
    - name: Determine target commit SHA
      id: target_sha
      run: |
        if [ -n "${{ inputs.tag }}" ]; then
          # A tagged dispatch releases that tag's commit, not the dispatched ref.
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch --tags --force origin
          SHA="$(git rev-list -n 1 "${{ inputs.tag }}")"
          if [ -z "$SHA" ]; then
            echo "::error::Tag ${{ inputs.tag }} not found."
            exit 1
          fi
        else
          # A tag push names its own commit; an untagged dispatch (dry run)
          # verifies the ref it was sent against.
          SHA="${{ github.sha }}"
        fi
        echo "sha=$SHA" >> $GITHUB_OUTPUT

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        ref: ${{ steps.target_sha.outputs.sha }}
        persist-credentials: false

    - name: Compute the CLI release matrix
      id: cli_matrix
      # Issue #974: one source for the platform list. The build matrix and the
      # verifier's expected asset set both read this output, so adding a target
      # cannot leave the verifier checking a stale hardcoded copy.
      # `release-cli-matrix.sh` emits multi-line JSON; the heredoc form is the
      # documented way to write a multi-line output value.
      run: |
        {
          echo 'json<<CSM_CLI_MATRIX_EOF'
          bash scripts/release-cli-matrix.sh --json
          echo 'CSM_CLI_MATRIX_EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Extract version from Cargo.toml
      id: version
      run: |
        VERSION=$(grep '^version =' Cargo.toml | head -1 | cut -d'"' -f2)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"

    - name: Assert the tag matches the workspace version
      # A tag push always names its tag, and so does a tagged dispatch — there
      # the assertion is what refuses `-f tag=` pointing at the wrong commit.
      if: github.event_name == 'push' || inputs.tag != ''
      run: |
        expected="v${{ steps.version.outputs.version }}"
        test "$expected" = "${RELEASE_TAG}" || {
          echo "FAIL: tag ${RELEASE_TAG} does not match workspace version ${expected}" >&2
          exit 1
        }

    - name: Refuse untagged publication
      if: inputs.publish && !inputs.tag
      run: |
        echo "FAIL: registry publication requires an explicit version tag; run a tagged release or tagged recovery dispatch" >&2
        exit 1

    - name: Verify CI and Pre-Release Gate are green for target commit
      run: |
        SHA="${{ steps.target_sha.outputs.sha }}"
        echo "Checking gates for target SHA ${SHA}..."

        # Verify CI
        CI_RUN=$(gh run list --repo "${{ github.repository }}" --workflow=ci.yml --commit "$SHA" --limit 1 --json status,conclusion --jq '.[0] // {}')
        CI_STATUS=$(echo "$CI_RUN" | jq -r '.status // "missing"')
        CI_CONCLUSION=$(echo "$CI_RUN" | jq -r '.conclusion // "none"')
        echo "CI on ${SHA}: status=${CI_STATUS} conclusion=${CI_CONCLUSION}"
        if [ "$CI_STATUS" != "completed" ] || [ "$CI_CONCLUSION" != "success" ]; then
          echo "::error::Refusing release: CI on ${SHA} is ${CI_STATUS}/${CI_CONCLUSION}, expected completed/success."
          exit 1
        fi

        # Verify Pre-Release Gate
        #
        # The gate is triggered by the same `CI` completion, so when this run
        # was itself triggered by that completion the gate may still be running:
        # poll until it reaches a verdict (bounded — a gate that never starts
        # costs the deadline rather than failing instantly, because sibling run
        # creation is not ordered; see the history of this poll in the v0.3.9
        # release notes). Fail-closed is preserved: anything but
        # completed/success blocks.
        GATE_DEADLINE=$(( $(date +%s) + 1800 ))
        # Name the job that blocked the release. The blended run verdict is
        # byte-identical for a RUSTSEC finding, a red benchmark and "somebody
        # has an open PR"; scripts/gate-failure-detail.sh parses the per-job
        # conclusions so a refusal can be triaged from the release log.
        gate_refusal_detail() {
          if [ "${GATE_RUN_ID}" = "missing" ] || [ "${GATE_RUN_ID}" = "null" ]; then
            echo "SUMMARY: no pre-release-gate run exists for ${SHA} — that workflow never started for this commit"
            return 0
          fi
          gh api "repos/${{ github.repository }}/actions/runs/${GATE_RUN_ID}/jobs" 2>/dev/null \
            | bash scripts/gate-failure-detail.sh "${GATE_RUN_ID}" "${SHA}" \
            || echo "SUMMARY: gate job detail could not be rendered for run ${GATE_RUN_ID}"
        }
        while :; do
          GATE_RUN=$(gh run list --repo "${{ github.repository }}" --workflow=pre-release-gate.yml --commit "$SHA" --limit 1 --json databaseId,status,conclusion --jq '.[0] // {}')
          GATE_RUN_ID=$(echo "$GATE_RUN" | jq -r '.databaseId // "missing"')
          GATE_STATUS=$(echo "$GATE_RUN" | jq -r '.status // "missing"')
          GATE_CONCLUSION=$(echo "$GATE_RUN" | jq -r '.conclusion // "none"')
          echo "Pre-Release Gate on ${SHA}: status=${GATE_STATUS} conclusion=${GATE_CONCLUSION} run=${GATE_RUN_ID}"
          if [ "$GATE_STATUS" = "completed" ]; then
            break
          fi
          if [ "$(date +%s)" -ge "$GATE_DEADLINE" ]; then
            GATE_DETAIL="$(gate_refusal_detail)"
            printf '%s\n' "${GATE_DETAIL}"
            GATE_SUMMARY="$(printf '%s\n' "${GATE_DETAIL}" | sed -n 's/^SUMMARY: //p')"
            echo "::error::Refusing release: Pre-Release Gate on ${SHA} had no verdict within 30m (last seen ${GATE_STATUS}/${GATE_CONCLUSION}). ${GATE_SUMMARY}"
            exit 1
          fi
          sleep 60
        done
        if [ "$GATE_CONCLUSION" != "success" ]; then
          GATE_DETAIL="$(gate_refusal_detail)"
          printf '%s\n' "${GATE_DETAIL}"
          GATE_SUMMARY="$(printf '%s\n' "${GATE_DETAIL}" | sed -n 's/^SUMMARY: //p')"
          echo "::error::Refusing release: Pre-Release Gate on ${SHA} is ${GATE_STATUS}/${GATE_CONCLUSION}, expected completed/success. ${GATE_SUMMARY}"
          exit 1
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Verify changelog entry exists
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
          echo "❌ Missing changelog entry for ${VERSION}"
          exit 1
        fi
        HEADER_COUNT=$(grep -c "^## \[${VERSION}\]" CHANGELOG.md || true)
        if [ "$HEADER_COUNT" -gt 1 ]; then
          echo "❌ Duplicate CHANGELOG header for ${VERSION} found"
          exit 1
        fi
        if ! grep -q "^## \[${VERSION}\] - [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}" CHANGELOG.md; then
          echo "❌ CHANGELOG header for ${VERSION} missing date"
          exit 1
        fi
        echo "✅ CHANGELOG validation passed"

    - name: Verify local version synchronization
      run: |
        bash scripts/verify-version-sync.sh

    - name: Assert the release tag exists
      id: tag
      # The tag is the release's identity and the input the registries are
      # coupled to: this workflow never creates or moves it (that is
      # `auto-release.yml`'s `ship` job, or a human). A push event names an
      # existing tag by construction; a tagged dispatch re-resolves it; an
      # untagged dispatch is a dry run and publishes nothing.
      if: github.event_name == 'push' || inputs.tag != ''
      run: |
        git fetch --tags --force
        if ! git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null; then
          echo "::error::Tag ${RELEASE_TAG} does not exist."
          exit 1
        fi
        echo "release-needed=true" >> $GITHUB_OUTPUT
        echo "release-ref=${RELEASE_TAG}" >> $GITHUB_OUTPUT

    - name: Mark the untagged dispatch as a dry run
      id: dry_run
      if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
      run: |
        echo "Dry run: building every target without publishing (no tag supplied)."
        echo "release-needed=false" >> $GITHUB_OUTPUT
        echo "release-ref=" >> $GITHUB_OUTPUT

    - name: Validate package assembly
      run: |
        cargo package --list --allow-dirty > /dev/null
        echo "✅ Package assembly validated"

  build-cli-matrix:
    strategy:
      matrix:
        include: ${{ fromJSON(needs.validate.outputs.cli-matrix) }}
    runs-on: ${{ matrix.runner }}
    needs: validate
    # The build also runs for an untagged dry-run dispatch: build and package
    # every target, publish nothing.
    timeout-minutes: 45
    permissions:
      contents: read
      # Provenance is signed through Sigstore: a token is minted here and the
      # resulting attestation is stored against the artifact's digest, so no
      # long-lived signing key exists.
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # A tagged run checks out the release tag; an untagged dry-run dispatch
        # checks out the ref it was sent against.
        ref: ${{ needs.validate.outputs.release-ref || github.sha }}
        persist-credentials: false

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      with:
        cache: false
        toolchain: stable
        target: ${{ matrix.target }}

    - name: Install cross-compilation linker (Linux arm64)
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu
        echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

    - name: Build release binary
      run: cargo build --release --locked -p chaotic_semantic_memory --target ${{ matrix.target }}

    - name: Smoke-test the binary
      shell: bash
      run: |
        ./target/${{ matrix.target }}/release/csm${{ matrix.platform == 'win32' && '.exe' || '' }} version

    - name: Prepare binary artifact
      shell: bash
      run: |
        mkdir -p release
        BINARY_NAME=csm-${{ matrix.platform }}-${{ matrix.arch }}
        if [ "${{ matrix.platform }}" = "win32" ]; then
          BINARY_NAME="${BINARY_NAME}.exe"
          cp target/${{ matrix.target }}/release/csm.exe release/${BINARY_NAME}
        else
          cp target/${{ matrix.target }}/release/csm release/${BINARY_NAME}
        fi
        cd release
        tar -czvf csm-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz ${BINARY_NAME}

    - name: Attest the artifact's build provenance
      # Signed inside the job that produced the archive, so the attestation
      # names the workflow, ref, and commit that actually built it rather than
      # a later reaggregation step. `SHA256SUMS` protects integrity; this
      # protects origin. Verify with `gh attestation verify <file> --repo …`.
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: release/*.tar.gz

    - name: Upload binary artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: csm-${{ matrix.platform }}-${{ matrix.arch }}
        path: release/*.tar.gz
        retention-days: 30
        if-no-files-found: error

  build-wasm:
    runs-on: ubuntu-24.04
    needs: validate
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.validate.outputs.release-ref || github.sha }}
        persist-credentials: false

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      with:
        cache: false
        toolchain: stable

    - name: Install WASM target
      run: rustup target add wasm32-unknown-unknown

    - name: Build WASM release
      run: cargo build --target wasm32-unknown-unknown --release -p csm-wasm

    - name: Prepare WASM artifact
      run: |
        mkdir -p release
        cp target/wasm32-unknown-unknown/release/csm_wasm.wasm release/chaotic_semantic_memory.wasm
        cd release
        tar -czvf chaotic_semantic_memory-${{ needs.validate.outputs.version }}-wasm.tar.gz chaotic_semantic_memory.wasm

    - name: Attest the artifact's build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: release/*.tar.gz

    - name: Upload WASM artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: wasm-artifact
        path: release/*.tar.gz
        retention-days: 30
        if-no-files-found: error

  # crates.io publishing lives in publish-crates.yml, not in a job here. crates.io
  # refuses OIDC tokens minted from events this file can be triggered by that a
  # publish job could run under (ADR-0104), so publishing stays in its dedicated
  # dispatch-triggered workflow — the trigger had to move, not the job. What this
  # file can still do is cause a `workflow_dispatch` run of that workflow — the
  # documented GITHUB_TOKEN recursion block exempts workflow_dispatch, so a
  # dispatch posted from inside a run does create one. See
  # trigger-crates-io-publish, right after create-github-release.

  create-github-release:
    runs-on: ubuntu-24.04
    needs: [validate, build-cli-matrix, build-wasm]
    if: needs.validate.outputs.release-needed == 'true'
    timeout-minutes: 15
    permissions:
      # Least privilege: read source, write the release and its assets.
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.validate.outputs.release-ref }}
        fetch-depth: 0
        persist-credentials: false

    - name: Download CLI binary artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: csm-*
        path: release
        merge-multiple: true

    - name: Download WASM artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: wasm-artifact
        path: release

    - name: Compute SHA-256 Checksums
      run: |
        cd release
        sha256sum *.tar.gz > SHA256SUMS
        cat SHA256SUMS

    - name: Extract changelog
      id: changelog
      run: |
        VERSION="${{ needs.validate.outputs.version }}"
        CHANGELOG_CONTENT=$(awk -v ver="$VERSION" '
          /^## \[/ {
            if (found) exit
            if (index($0, "[" ver "]") > 0) { found=1; next }
          }
          found { print }
        ' CHANGELOG.md)
        if [ -z "$CHANGELOG_CONTENT" ]; then
          echo "Release $VERSION" > release_notes.md
        else
          printf '%s\n' "$CHANGELOG_CONTENT" > release_notes.md
        fi

    - name: Create or update GitHub Release
      # Idempotent so a tagged dispatch can re-run a release that failed
      # halfway: an existing Release has its body and assets replaced rather
      # than the job failing on "already exists". `--verify-tag` refuses to
      # publish a Release for a tag that does not point at this commit.
      run: |
        VERSION="${{ needs.validate.outputs.version }}"
        TAG="v${VERSION}"
        if gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1; then
          echo "GitHub Release $TAG exists; replacing its assets and notes."
          gh release upload "$TAG" release/* --repo ${{ github.repository }} --clobber
          gh release edit "$TAG" \
            --repo ${{ github.repository }} \
            --title "$TAG" \
            --notes-file release_notes.md
        else
          gh release create "$TAG" release/* \
            --repo ${{ github.repository }} \
            --verify-tag \
            --title "$TAG" \
            --notes-file release_notes.md
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-crates-io-publish:
    runs-on: ubuntu-24.04
    # The tag exists once validate has asserted it; waiting on
    # create-github-release means the ref dispatched here is public and final.
    needs: [validate, create-github-release]
    if: needs.validate.outputs.release-needed == 'true'
    permissions:
      contents: read
      actions: write
    # publish-crates.yml bounds its own publish job at 25 min (ADR-0104 item 5, under
    # crates.io's 30-minute token); this covers that plus queue time, and stays under
    # the 40-minute job bound so the job reports the gap itself instead of the runner
    # killing it mid-poll.
    timeout-minutes: 40
    env:
      REPO: ${{ github.repository }}
      VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_SHA: ${{ needs.validate.outputs.release-sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Dispatch publish-crates.yml and wait for its verdict
      run: |
        WORKFLOW_FILE="publish-crates.yml"
        TAG_REF="refs/tags/v${VERSION}"
        POLL_SECONDS=30
        DISCOVER_LIMIT=180
        WAIT_LIMIT=2100

        # Nothing below is interpolated by the runner: REPO/VERSION/RELEASE_SHA arrive
        # through the job `env:` block, so dispatch and event text can only ever reach the
        # shell as data.
        before="$(gh api "repos/${REPO}/actions/workflows/${WORKFLOW_FILE}/runs?per_page=1" \
          2>/dev/null | jq -r '.workflow_runs[0].id // 0' 2>/dev/null || true)"
        if ! [[ "${before}" =~ ^[0-9]+$ ]]; then
          MSG="could not read the last run id of ${WORKFLOW_FILE}, so a run this job "
          MSG="${MSG}dispatches could not be told apart from an older one. Nothing was "
          MSG="${MSG}published. Fix the Actions API read, then dispatch publish-crates.yml by hand."
          echo "::error title=Crates.io dispatch blocked::${MSG}"
          return 1 2>/dev/null || exit 1
        fi

        # The ref is sent twice, from one variable, on purpose: the top-level `ref` chooses
        # which revision of publish-crates.yml runs, `inputs.ref` chooses the tree it checks
        # out and publishes. Allow them to differ and a release would run one file against
        # another tree. `version` is a required input there, and GitHub answers 422 for a
        # missing one — so a wrong payload is a red job, not a silent no-op. `dry_run` is
        # absent, so publish-crates.yml's default (false) applies: a release publishes for
        # real, and a dry run stays a human decision.
        jq -n --arg ref "${TAG_REF}" --arg ver "${VERSION}" \
          '{ref: $ref, inputs: {ref: $ref, version: $ver}}' \
          | gh api --method POST \
              "repos/${REPO}/actions/workflows/${WORKFLOW_FILE}/dispatches" --input -
        echo "Dispatched ${WORKFLOW_FILE} for ${TAG_REF}, version ${VERSION}."

        # Match the spawned run by its head sha, not by recency alone: run ids are
        # monotonic, but a concurrent manual dispatch of the same workflow would
        # otherwise be waited on and credited with this release's outcome.
        RUN_ID=""
        waited=0
        while [ "${waited}" -lt "${DISCOVER_LIMIT}" ]; do
          RUN_ID="$(gh api \
            "repos/${REPO}/actions/workflows/${WORKFLOW_FILE}/runs?event=workflow_dispatch&per_page=20" \
            2>/dev/null \
            | jq -r --argjson after "${before}" --arg sha "${RELEASE_SHA}" \
              '[(.workflow_runs // [])[] | select(.id > $after and .head_sha == $sha)] | (.[0].id // empty)' \
            2>/dev/null || true)"
          if [ -n "${RUN_ID}" ]; then
            break
          fi
          sleep "${POLL_SECONDS}"
          waited=$((waited + POLL_SECONDS))
        done

        if [ -z "${RUN_ID}" ]; then
          MSG="${WORKFLOW_FILE} created no workflow_dispatch run for ${RELEASE_SHA} within "
          MSG="${MSG}$((DISCOVER_LIMIT / 60)) min. The usual cause is that ${WORKFLOW_FILE} is "
          MSG="${MSG}not on the default branch yet — workflow_dispatch only fires for a file "
          MSG="${MSG}that has already merged. crates.io is not proven for ${VERSION}."
          echo "::error title=No crates.io run::${MSG}"
          return 1 2>/dev/null || exit 1
        fi
        RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
        echo "Found run ${RUN_ID}: ${RUN_URL}"

        STATE=""
        CONCLUSION=""
        waited=0
        while [ "${waited}" -lt "${WAIT_LIMIT}" ]; do
          run_json="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}" 2>/dev/null || true)"
          STATE="$(jq -r '.status // "unknown"' <<< "${run_json}" 2>/dev/null || echo unknown)"
          if [ "${STATE}" = "completed" ]; then
            CONCLUSION="$(jq -r '.conclusion // "none"' <<< "${run_json}" 2>/dev/null || echo none)"
            break
          fi
          sleep "${POLL_SECONDS}"
          waited=$((waited + POLL_SECONDS))
        done

        {
          echo "## crates.io publish (v${VERSION})"
          echo ""
          echo "- dispatched \`${WORKFLOW_FILE}\` at \`${TAG_REF}\`"
          echo "- run: <${RUN_URL}>"
          echo "- outcome: \`${STATE}\` / \`${CONCLUSION}\`"
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "${STATE}" != "completed" ]; then
          if [ "${STATE}" = "waiting" ]; then
            MSG="run ${RUN_ID} is parked on an environment approval; keep the crates.io "
            MSG="${MSG}environment unguarded (agents-docs/release-safety.md) or a release "
            MSG="${MSG}waits this long and still publishes nothing"
            echo "::warning title=Crates.io environment held::${MSG}"
          fi
          MSG="${WORKFLOW_FILE} run ${RUN_ID} was still \`${STATE}\` after "
          MSG="${MSG}$((WAIT_LIMIT / 60)) min, so crates.io is not proven for ${VERSION}. "
          MSG="${MSG}Re-run that workflow, then re-run verify-release."
          echo "::error title=Crates.io unpublished::${MSG}"
          return 1 2>/dev/null || exit 1
        fi
        # publish-crates.yml exits 1 unless all nine crates are in the sparse index at
        # this version, so its own success is the crates.io proof; nothing here re-probes
        # the index — that would be a second, weaker copy of the same check.
        if [ "${CONCLUSION}" != "success" ]; then
          MSG="${WORKFLOW_FILE} run ${RUN_ID} finished \`${CONCLUSION}\` (${RUN_URL}). "
          MSG="${MSG}Its reconciliation step names every crate missing at ${VERSION}, and "
          MSG="${MSG}publishing is idempotent, so re-dispatch the same ref and version to "
          MSG="${MSG}land the rest. verify-release stays red until then."
          echo "::error title=Crates.io publish failed::${MSG}"
          return 1 2>/dev/null || exit 1
        fi
        echo "✅ crates.io run ${RUN_ID} succeeded; its reconciliation step proved all nine crates at ${VERSION}."
  publish-npm-wasm:
    runs-on: ubuntu-24.04
    # npm publication waits for the crates.io handoff like every other
    # advertised channel: a release is advertised only once the whole surface
    # is proven.
    needs: [validate, build-wasm, trigger-crates-io-publish]
    if: needs.validate.outputs.release-needed == 'true'
    environment: npm
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.validate.outputs.release-ref }}
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      with:
        cache: false
        toolchain: stable
        target: wasm32-unknown-unknown

    - name: Install wasm-pack
      run: cargo install wasm-pack

    - name: Check npm status
      id: npm-check
      run: |
        VERSION="${{ needs.validate.outputs.version }}"
        NPM_VERSION=$(npm view @d-o-hub/chaotic_semantic_memory version 2>/dev/null || echo "none")
        if [ "$NPM_VERSION" = "$VERSION" ]; then
          echo "already-published=true" >> $GITHUB_OUTPUT
        else
          echo "already-published=false" >> $GITHUB_OUTPUT
        fi

    - name: Build WASM package
      if: steps.npm-check.outputs.already-published != 'true'
      run: |
        if ! grep -q '^\[package.metadata.wasm-pack.profile.release\]' crates/csm-wasm/Cargo.toml; then
          cat >> crates/csm-wasm/Cargo.toml <<'EOF'

        [package.metadata.wasm-pack.profile.release]
        wasm-opt = ["-O4", "--enable-bulk-memory"]
        EOF
        fi
        bash scripts/build-wasm.sh release-web
        jq ".version = \"${{ needs.validate.outputs.version }}\"" wasm/package.json > wasm/package.json.tmp
        mv wasm/package.json.tmp wasm/package.json

    - name: Publish WASM to npm
      if: steps.npm-check.outputs.already-published != 'true'
      run: |
        cd wasm
        # Issue #955: no fallback publish. publishConfig.provenance makes the
        # retry harmless to the artifact but buries the first error; if provenance
        # ever stops being configured, the retry silently becomes an unattested
        # publish. A failed attested publish is a red job.
        npm publish --provenance --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-npm-cli:
    runs-on: ubuntu-24.04
    needs: [validate, build-cli-matrix, trigger-crates-io-publish]
    if: needs.validate.outputs.release-needed == 'true'
    environment: npm-cli
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.validate.outputs.release-ref }}
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - name: Download CLI binary artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: csm-*
        path: cli-artifacts
        merge-multiple: true

    - name: Stage binaries inside npm package
      shell: bash
      run: |
        rm -f cli-npm/bin/* || true
        mkdir -p cli-npm/bin
        shopt -s nullglob
        COUNT=0
        for archive in cli-artifacts/*.tar.gz; do
          tar -xzf "$archive" -C cli-npm/bin
          COUNT=$((COUNT + 1))
        done
        # Issue #974: the expected count comes from the same matrix output that
        # drives build-cli-matrix; a hardcoded 5 would drift when a target changes.
        EXPECTED_COUNT="$(jq 'length' <<< '${{ needs.validate.outputs.cli-matrix }}')"
        if [ "$COUNT" -lt "$EXPECTED_COUNT" ]; then
          echo "::error::Missing platform binaries! Expected ${EXPECTED_COUNT}, found $COUNT."
          exit 1
        fi

    - name: Check npm status
      id: npm-check
      run: |
        VERSION="${{ needs.validate.outputs.version }}"
        NPM_VERSION=$(npm view @d-o-hub/csm version 2>/dev/null || echo "none")
        if [ "$NPM_VERSION" = "$VERSION" ]; then
          echo "already-published=true" >> $GITHUB_OUTPUT
        else
          echo "already-published=false" >> $GITHUB_OUTPUT
        fi

    - name: Build CLI npm package
      if: steps.npm-check.outputs.already-published != 'true'
      run: |
        VERSION="${{ needs.validate.outputs.version }}"
        jq ".version = \"$VERSION\"" cli-npm/package.json > cli-npm/package.json.tmp
        mv cli-npm/package.json.tmp cli-npm/package.json
        cp LICENSE cli-npm/

    - name: Publish CLI to npm
      if: steps.npm-check.outputs.already-published != 'true'
      run: |
        cd cli-npm
        # Issue #955: no fallback publish. publishConfig.provenance makes the
        # retry harmless to the artifact but buries the first error; if provenance
        # ever stops being configured, the retry silently becomes an unattested
        # publish. A failed attested publish is a red job.
        npm publish --provenance --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  verify-release:
    runs-on: ubuntu-24.04
    # trigger-crates-io-publish is in this list so the nine index probes are not racing
    # the publish that is supposed to fill them. `if: always()` keeps the job running
    # when that sibling fails, which is what names the half that is missing.
    needs: [validate, create-github-release, publish-npm-wasm, publish-npm-cli, trigger-crates-io-publish]
    if: always() && needs.validate.outputs.release-needed == 'true'
    timeout-minutes: 20
    permissions:
      # Read the released source and assets; no write anywhere.
      contents: read
      # `gh attestation verify` reads the archive's build provenance.
      attestations: read
    steps:
    - name: Verify complete release across all registries
      run: |
        VERSION="${{ needs.validate.outputs.version }}"
        ERRORS=""
        echo "## Release Verification for v${VERSION}" >> $GITHUB_STEP_SUMMARY

        check_with_retry() {
          local name="$1"
          local check_cmd="$2"
          local max_retries=8
          local delays=(5 10 15 20 30 45 60 60)
          local attempt=0
          while [ $attempt -lt $max_retries ]; do
            if eval "$check_cmd"; then
              echo "✅ $name: Published" >> $GITHUB_STEP_SUMMARY
              return 0
            fi
            attempt=$((attempt + 1))
            sleep ${delays[$attempt - 1]}
          done
          ERRORS="${ERRORS}${name}; "
          echo "❌ $name: Missing" >> $GITHUB_STEP_SUMMARY
          return 1
        }

        # Every probe is a function invoked by name, for two reasons that are the same shape.
        # check_with_retry evals its command once per attempt, so a probe written inline as
        # "[ "$(npm view …)" = "$VERSION" ]" in a double-quoted argument has already been substituted
        # by the caller: eval then re-runs the literal `[[ 0.3.9 = 0.3.9 ]]` eight times and the
        # 245 s backoff can never observe a registry that propagated late (#972). A function name has
        # nothing left to interpolate. And the inline form cannot survive two parse layers anyway —
        # the pattern this step shipped, '"vers":"$VERSION"', is collapsed by the outer quotes into
        # 'vers:0.3.9', which the sparse index does not contain (#971). Same splice as the four
        # publish-side probes above, reached from the other direction.
        crates_io_path() { bash scripts/crates-io-index-path.sh "$1"; }
        published_on_crates_io() {
          local crate="$1" path
          path="$(crates_io_path "${crate}")"
          curl -sL "https://index.crates.io/${path}" | grep -qF "\"vers\":\"$VERSION\""
        }
        published_on_npm() {
          [ "$(npm view "$1" version 2>/dev/null || echo none)" = "$VERSION" ]
        }
        npm_attestation_present() {
          local pkg="$1" encoded doc
          # Issue #955: `.dist.attestations` is served only by the abbreviated
          # packument. `npm view <pkg> dist --json` reads the full packument and
          # returns no attestations key at all, so a probe written that way says
          # "missing" for an attested release. One segment short was the original
          # bug; this query names the field and the endpoint.
          encoded="${pkg//\//%2f}"
          doc="$(curl -sSL -H 'Accept: application/vnd.npm.install-v1+json' \
            "https://registry.npmjs.org/${encoded}")"
          jq -e --arg v "$VERSION" \
            '(.versions[$v].version == $v)
              and (.versions[$v].dist.attestations.url != null)
              and (.versions[$v].dist.attestations.provenance.predicateType != null)' \
            <<< "${doc}" >/dev/null
        }

        # Issue #974: every published crate, not only the root. The set is the
        # publish order plus csm-duckdb; csm-cli/csm-wasm and csm-ci-selection
        # (workspace tooling, `publish = false`) are workspace members that are
        # never published to crates.io.
        CRATES_PUBLISHED="csm-chaos csm-core-lib csm-traits csm-embedding csm-memory csm-retrieval csm-persistence chaotic_semantic_memory csm-duckdb"
        for crate in ${CRATES_PUBLISHED}; do
          if ! check_with_retry "crates.io/${crate}" "published_on_crates_io ${crate}"; then :; fi
        done
        for pkg in @d-o-hub/chaotic_semantic_memory @d-o-hub/csm; do
          if ! check_with_retry "npm (${pkg}) version" "published_on_npm ${pkg}"; then :; fi
          if ! check_with_retry "npm (${pkg}) provenance" "npm_attestation_present ${pkg}"; then :; fi
        done

        # Issue #974: the release's assets, not its existence. The CLI list comes
        # from the same job output that drives build-cli-matrix, so adding a
        # target cannot leave a hardcoded copy behind.
        CLI_MATRIX='${{ needs.validate.outputs.cli-matrix }}'
        EXPECTED_ASSETS="SHA256SUMS chaotic_semantic_memory-${VERSION}-wasm.tar.gz"
        while IFS=$'\t' read -r platform arch; do
          [ -n "${platform}" ] || continue
          EXPECTED_ASSETS="${EXPECTED_ASSETS} csm-${platform}-${arch}.tar.gz"
        done < <(jq -r '.[] | [.platform, .arch] | @tsv' <<< "${CLI_MATRIX}")
        EXPECTED_COUNT="$(wc -w <<< "${EXPECTED_ASSETS}" | tr -d ' ')"
        ASSETS="$(gh release view "v${VERSION}" --repo ${{ github.repository }} --json assets --jq '.assets[].name' 2>/dev/null || true)"
        if [ -z "${ASSETS}" ]; then
          ERRORS="${ERRORS}github-assets; "
          echo "❌ GitHub Release assets: missing (no release or no assets)" >> $GITHUB_STEP_SUMMARY
        else
          MISSING_ASSETS=""
          for asset in ${EXPECTED_ASSETS}; do
            if ! grep -qxF "${asset}" <<< "${ASSETS}"; then
              MISSING_ASSETS="${MISSING_ASSETS} ${asset}"
              ERRORS="${ERRORS}asset:${asset}; "
            fi
          done
          if [ -n "${MISSING_ASSETS}" ]; then
            echo "❌ GitHub Release assets: missing${MISSING_ASSETS}" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ GitHub Release assets: ${EXPECTED_COUNT}/${EXPECTED_COUNT}" >> $GITHUB_STEP_SUMMARY
          fi
        fi

        if [ -n "$ERRORS" ]; then
          echo "::error::Partial release detected! Missing: ${ERRORS}"
          # A crates.io miss now has a named cause in this same run: publishing there is
          # a workflow_dispatch of publish-crates.yml (crates.io refuses OIDC tokens minted
          # from this file's triggers), and trigger-crates-io-publish is the job
          # that dispatches it and waits. Read that job first; the manual dispatch below is
          # the recovery when it never ran. Say this or the red run reads as a flake, which
          # is how 0.3.9 shipped half-done.
          if [[ "$ERRORS" == *crates.io/* ]]; then
            MSG="see trigger-crates-io-publish in this run, then dispatch "
            MSG="${MSG}publish-crates.yml with ref refs/tags/v${VERSION} and version "
            MSG="${MSG}${VERSION} and re-run this job"
            echo "::error title=Crates.io not published::${MSG}"
          fi
          exit 1
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-windows-npm:
    # The wrapper bundles the same binaries as the GitHub release assets, so it
    # is gated on the same preconditions. Run after both are available,
    # including on tagged recovery: the wrapper needs both the registry package
    # and a working `csm version` on Windows.
    needs: [validate, create-github-release, publish-npm-cli]
    if: needs.validate.outputs.release-needed == 'true' && needs.validate.outputs.version != ''
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
    - name: Run the published Windows npm wrapper
      shell: pwsh
      env:
        VERSION: ${{ needs.validate.outputs.version }}
      run: |
        $package = "@d-o-hub/csm@$env:VERSION"
        $work = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "windows-npm-smoke")
        $env:npm_config_cache = Join-Path $work.FullName "npm-cache"
        Set-Location $work.FullName
        $published = ""
        for ($attempt = 0; $attempt -lt 20; $attempt++) {
          $published = npm.cmd view $package version --loglevel=silent
          if ($LASTEXITCODE -eq 0 -and $published -eq $env:VERSION) { break }
          Start-Sleep -Seconds 15
        }
        if ($published -ne $env:VERSION) { throw "npm did not expose $package" }
        $output = npm.cmd exec --yes --package=$package -- csm version
        if ($LASTEXITCODE -ne 0) { throw "Windows npm wrapper failed" }
        $output | Write-Output
        if (($output -join "`n") -notmatch [regex]::Escape($env:VERSION)) {
          throw "Windows npm wrapper reported an unexpected version"
        }

  notify:
    runs-on: ubuntu-24.04
    # Render the verdict from explicit sibling results, not a fixed sentence:
    # `if: always()` alone is what let a partial or absent release read as
    # routine; the results are read in scripts/release-verdict.sh.
    needs: [validate, build-cli-matrix, build-wasm, create-github-release, publish-npm-wasm, publish-npm-cli, trigger-crates-io-publish, verify-release, verify-windows-npm]
    if: always()
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Release verdict
      run: bash scripts/release-verdict.sh >> "$GITHUB_STEP_SUMMARY"
      env:
        VERSION: ${{ needs.validate.outputs.version }}
        EVENT_NAME: ${{ github.event_name }}
        RELEASE_NEEDED: ${{ needs.validate.outputs.release-needed }}
        DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}
        VALIDATE_RESULT: ${{ needs.validate.result }}
        BUILD_CLI_RESULT: ${{ needs.build-cli-matrix.result }}
        BUILD_WASM_RESULT: ${{ needs.build-wasm.result }}
        NPM_WASM_RESULT: ${{ needs.publish-npm-wasm.result }}
        NPM_CLI_RESULT: ${{ needs.publish-npm-cli.result }}
        RELEASE_RESULT: ${{ needs.create-github-release.result }}
        CRATES_TRIGGER_RESULT: ${{ needs.trigger-crates-io-publish.result }}
        VERIFY_RESULT: ${{ needs.verify-release.result }}
        WINDOWS_NPM_RESULT: ${{ needs.verify-windows-npm.result }}
