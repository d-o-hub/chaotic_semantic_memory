name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write  # Required for OIDC trusted publishing

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v6

    - name: Extract version from tag
      id: version
      run: |
        VERSION="${GITHUB_REF#refs/tags/v}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"

    - name: Validate version matches Cargo.toml
      run: |
        TAG_VERSION="${GITHUB_REF#refs/tags/v}"
        CARGO_VERSION=$(grep '^version =' Cargo.toml | head -1 | cut -d'"' -f2)
        if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
          echo "❌ Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
          exit 1
        fi
        echo "✓ Version matches: $TAG_VERSION"

  build-artifacts:
    runs-on: ubuntu-24.04
    needs: validate
    steps:
    - uses: actions/checkout@v6

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Cache cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release binary
      run: cargo build --release

    - name: Install WASM target
      run: rustup target add wasm32-unknown-unknown

    - name: Build WASM release
      run: cargo build --target wasm32-unknown-unknown --release --features wasm

    - name: Prepare release artifacts
      run: |
        mkdir -p release
        # Binary artifact
        cp target/release/csm release/csm-x86_64-unknown-linux-gnu
        # WASM artifacts
        cp target/wasm32-unknown-unknown/release/chaotic_semantic_memory.wasm release/
        # Create archive
        cd release
        tar -czvf chaotic_semantic_memory-${{ needs.validate.outputs.version }}-linux-x86_64.tar.gz csm-x86_64-unknown-linux-gnu
        tar -czvf chaotic_semantic_memory-${{ needs.validate.outputs.version }}-wasm.tar.gz chaotic_semantic_memory.wasm

    - name: Upload release artifacts
      uses: actions/upload-artifact@v6
      with:
        name: release-artifacts
        path: release/*.tar.gz
        retention-days: 30

  publish-crates:
    runs-on: ubuntu-24.04
    needs: [validate, build-artifacts]
    environment: crates.io
    steps:
    - uses: actions/checkout@v6

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Publish to crates.io (Trusted Publishing)
      uses: rust-lang/crates-io-auth-action@v1
      with:
        name: chaotic_semantic_memory

  create-github-release:
    runs-on: ubuntu-24.04
    needs: [validate, publish-crates, build-artifacts]
    steps:
    - uses: actions/checkout@v6

    - name: Download release artifacts
      uses: actions/download-artifact@v6
      with:
        name: release-artifacts
        path: release

    - name: Extract changelog for this version
      id: changelog
      run: |
        VERSION="${{ needs.validate.outputs.version }}"
        # Extract changelog section for this version
        awk "/^## \\[${VERSION}\\]/,/^## \\[|^$/" CHANGELOG.md | head -n -1 > release_notes.md
        if [ ! -s release_notes.md ]; then
          echo "No changelog entry found for version $VERSION"
          echo "Release $VERSION" > release_notes.md
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: chaotic_semantic_memory v${{ needs.validate.outputs.version }}
        body_path: release_notes.md
        files: release/*.tar.gz
        draft: false
        prerelease: ${{ contains(needs.validate.outputs.version, '-') }}
        generate_release_notes: true

  notify:
    runs-on: ubuntu-24.04
    needs: [create-github-release]
    if: always()
    steps:
    - name: Release summary
      run: |
        echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Successfully released v${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **crates.io**: Published with Trusted Publishing (OIDC)" >> $GITHUB_STEP_SUMMARY
        echo "- **GitHub Release**: Created with artifacts" >> $GITHUB_STEP_SUMMARY
