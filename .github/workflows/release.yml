name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      recover:
        description: Retry missing artifacts for the current version even when its tag exists
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Guardrail: Wait for CI workflow to complete successfully before releasing
  wait-for-ci:
    runs-on: ubuntu-24.04
    permissions:
      actions: read    # required by `gh run list` to query CI workflow status
      contents: read
    outputs:
      ci-passed: ${{ steps.check-ci.outputs.passed }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 1

    - name: Wait for CI workflow to complete
      id: check-ci
      run: |
        # Wait up to 30 minutes for CI workflow to complete.
        # The mutation-test job alone can take ~20 min on PRs, and main-branch CI
        # has historically been cancelled and re-triggered by the concurrency group,
        # so 10 min was not enough and Release silently timed out (see run #412).
        MAX_WAIT=1800
        SLEEP_INTERVAL=30
        ELAPSED=0

        while [ $ELAPSED -lt $MAX_WAIT ]; do
          # Get the CI workflow run for this commit
          CI_RUN=$(gh run list --repo ${{ github.repository }} --workflow=ci.yml --commit ${{ github.sha }} --limit 1 --json conclusion,status --jq '.[0]' || echo '')
          if [ -z "$CI_RUN" ] || [ "$CI_RUN" = "null" ]; then
            CI_RUN='{"status":"queued","conclusion":null}'
          fi

          CI_STATUS=$(echo "$CI_RUN" | jq -r '.status // "queued"')
          CI_CONCLUSION=$(echo "$CI_RUN" | jq -r '.conclusion // "null"')

          echo "CI status: $CI_STATUS, conclusion: $CI_CONCLUSION"

          if [ "$CI_STATUS" = "completed" ]; then
            if [ "$CI_CONCLUSION" = "success" ]; then
              echo "✅ CI passed"
              echo "passed=true" >> $GITHUB_OUTPUT
              exit 0
            else
              # Covers failure, cancelled, timed_out, action_required, etc.
              echo "❌ CI ended with conclusion: $CI_CONCLUSION"
              echo "::error::CI workflow $CI_CONCLUSION. Release blocked."
              echo "passed=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          fi

          echo "Waiting for CI to complete... ($ELAPSED/$MAX_WAIT seconds)"
          sleep $SLEEP_INTERVAL
          ELAPSED=$((ELAPSED + SLEEP_INTERVAL))
        done

        echo "::error::Timeout waiting for CI workflow to complete after ${MAX_WAIT}s"
        echo "passed=false" >> $GITHUB_OUTPUT
        exit 1
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    runs-on: ubuntu-24.04
    needs: wait-for-ci
    if: needs.wait-for-ci.outputs.ci-passed == 'true'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release-needed: ${{ steps.tag.outputs.release-needed }}
      release-ref: ${{ steps.tag.outputs.release-ref }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false
        toolchain: stable

    - name: Extract version from Cargo.toml
      id: version
      run: |
        VERSION=$(grep '^version =' Cargo.toml | head -1 | cut -d'"' -f2)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"

    - name: Verify changelog entry exists
      run: |
        VERSION="${{ steps.version.outputs.version }}"

        # Check for version header
        if ! grep -q "^## \\[${VERSION}\\]" CHANGELOG.md; then
          echo "❌ Missing changelog entry for ${VERSION}"
          exit 1
        fi

        # Guardrail: Check for duplicate headers (causes empty release notes)
        HEADER_COUNT=$(grep -c "^## \\[${VERSION}\\]" CHANGELOG.md || true)
        if [ "$HEADER_COUNT" -gt 1 ]; then
          echo "❌ Duplicate CHANGELOG header for ${VERSION} found (${HEADER_COUNT} occurrences)"
          echo "   This breaks release note extraction. Fix: keep only one '## [${VERSION}] - YYYY-MM-DD'"
          exit 1
        fi

        # Guardrail: Verify header has date (required by Keep a Changelog)
        if ! grep -q "^## \\[${VERSION}\\] - [0-9]\\{4\\}-[0-9]\\{2\\}-[0-9]\\{2\\}" CHANGELOG.md; then
          echo "❌ CHANGELOG header for ${VERSION} missing date"
          echo "   Expected format: ## [${VERSION}] - YYYY-MM-DD"
          exit 1
        fi

        echo "✅ CHANGELOG validation passed"

    - name: Sync version across codebase
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        bash scripts/sync-version.sh "$VERSION"

    - name: Regenerate llms files
      run: |
        bash scripts/gen-llms-txt.sh

        # Verify API surface threshold
        LOC=$(grep -cE '^\s*(pub |fn |struct |enum |trait |impl )' llms-full.txt || true)
        echo "Public API surface: $LOC symbols"
        THRESHOLD=5000
        if [[ "$LOC" -gt "$THRESHOLD" ]]; then
          echo "❌ API surface $LOC exceeds threshold of $THRESHOLD"
          exit 1
        fi

    - name: Ensure version sync is clean
      run: |
        # Exclude llms.txt and llms-full.txt from clean check as they may be mutated
        # by the gen-llms-txt.sh step or sync-version.sh.
        git add -A
        if ! git diff --staged --quiet -- ':!llms.txt' ':!llms-full.txt'; then
          echo "❌ sync-version produced changes. Run scripts/sync-version.sh and commit before tagging."
          git diff --staged -- ':!llms.txt' ':!llms-full.txt'
          exit 1
        fi

    - name: Ensure release tag exists
      id: tag
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        TAG="v${VERSION}"
        echo "release-ref=${TAG}" >> $GITHUB_OUTPUT
        git fetch --tags --force
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.recover }}" = "true" ]; then
            echo "Tag ${TAG} already exists; recovering missing release artifacts."
            echo "release-needed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Tag ${TAG} already exists; skipping release."
          echo "release-needed=false" >> $GITHUB_OUTPUT
          exit 0
        fi

        git tag "$TAG"
        git push origin "$TAG"
        echo "Created tag ${TAG}"
        echo "release-needed=true" >> $GITHUB_OUTPUT

    - name: Create pull request with regenerated llms.txt
      if: steps.tag.outputs.release-needed == 'true'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore: regenerate llms.txt for release [skip ci]"
        branch: regenerate-llms-${{ steps.version.outputs.version }}-${{ github.run_id }}
        title: "chore: regenerate llms.txt for v${{ steps.version.outputs.version }}"
        body: |
          This PR updates llms.txt and llms-full.txt as part of the release workflow.
          Files updated by scripts/gen-llms-txt.sh
        labels: automated
        add-paths: llms.txt,llms-full.txt
        base: main

    - name: Validate publish dry-run
      run: |
        # Workspace crates (csm-core, csm-embedding, etc.) are published alongside
        # the main crate in the publish-crates job. During validation, they don't
        # yet exist on crates.io, so a full dry-run would fail dependency resolution.
        # Instead, verify the package can be assembled (--list shows included files).
        cargo package --list --allow-dirty > /dev/null
        echo "✅ Package contents validated"

    - name: Verify npm OIDC Trusted Publisher configuration
      run: |
        echo "Checking npm Trusted Publisher configuration..."

        # Get OIDC token to verify it's available
        if ! command -v curl &>/dev/null; then
          echo "::warning::Cannot verify OIDC configuration (curl not available)"
          exit 0
        fi

        # Request OIDC token from GitHub
        OIDC_TOKEN_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm"
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          echo "✓ OIDC token endpoint available"

          # Verify we can get an OIDC token
          TOKEN_RESPONSE=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$OIDC_TOKEN_URL" 2>/dev/null || echo '{"error": "no response"}')

          if echo "$TOKEN_RESPONSE" | grep -q '"value"'; then
            echo "✓ OIDC token can be generated"
          else
            echo "::error::OIDC token generation failed. Check workflow has 'id-token: write' permission."
            exit 1
          fi
        else
          echo "::warning::Cannot verify OIDC (not in Actions context)"
        fi

        # Note: npm Trusted Publisher must be configured on npmjs.com
        # Go to: npmjs.com → @d-o-hub/chaotic_semantic_memory AND @d-o-hub/csm → Settings → Trusted Publishers
        # Add repository: d-o-hub/chaotic_semantic_memory
        echo ""
        echo "⚠️ IMPORTANT: Ensure Trusted Publisher is configured on npmjs.com:"
        echo "   1. Go to https://www.npmjs.com/package/@d-o-hub/chaotic_semantic_memory AND /@d-o-hub/csm"
        echo "   2. Click Settings → Trusted Publishers"
        echo "   3. Add GitHub repository: d-o-hub/chaotic_semantic_memory"
        echo "   4. Set workflow: release.yml (or * for all workflows)"
        echo ""
        echo "If OIDC fails, the workflow will fall back to NPM_TOKEN secret."
      env:
        ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}

  build-cli-matrix:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
          - runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
          - runner: macos-latest
            target: aarch64-apple-darwin
            platform: darwin
            arch: arm64
          - runner: macos-latest
            target: x86_64-apple-darwin
            platform: darwin
            arch: x64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32
            arch: x64
    runs-on: ${{ matrix.runner }}
    needs: validate
    if: needs.validate.outputs.release-needed == 'true'
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ needs.validate.outputs.release-ref }}

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false
        toolchain: stable
        target: ${{ matrix.target }}

    - name: Install cross-compilation linker (Linux arm64)
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu
        echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

    - name: Cache cargo
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release binary
      run: cargo build --release --target ${{ matrix.target }}

    - name: Prepare binary artifact
      shell: bash
      run: |
        mkdir -p release
        BINARY_NAME=csm-${{ matrix.platform }}-${{ matrix.arch }}
        if [ "${{ matrix.platform }}" = "win32" ]; then
          BINARY_NAME="${BINARY_NAME}.exe"
          cp target/${{ matrix.target }}/release/csm.exe release/${BINARY_NAME}
        else
          cp target/${{ matrix.target }}/release/csm release/${BINARY_NAME}
        fi
        cd release
        tar -czvf csm-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz ${BINARY_NAME}

    - name: Upload binary artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: csm-${{ matrix.platform }}-${{ matrix.arch }}
        path: release/*.tar.gz
        retention-days: 30

  build-wasm:
    runs-on: ubuntu-24.04
    needs: validate
    if: needs.validate.outputs.release-needed == 'true'
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ needs.validate.outputs.release-ref }}

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false
        toolchain: stable

    - name: Install WASM target
      run: rustup target add wasm32-unknown-unknown

    - name: Build WASM release
      run: cargo build --target wasm32-unknown-unknown --release -p csm-wasm

    - name: Prepare WASM artifact
      run: |
        mkdir -p release
        cp target/wasm32-unknown-unknown/release/csm_wasm.wasm release/chaotic_semantic_memory.wasm
        cd release
        tar -czvf chaotic_semantic_memory-${{ needs.validate.outputs.version }}-wasm.tar.gz chaotic_semantic_memory.wasm

    - name: Upload WASM artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: wasm-artifact
        path: release/*.tar.gz
        retention-days: 30

  publish-crates:
    runs-on: ubuntu-24.04
    needs: [validate, build-cli-matrix]
    if: needs.validate.outputs.release-needed == 'true'
    environment: crates.io
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ needs.validate.outputs.release-ref }}

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false
        toolchain: stable

    - name: Check if version already published to crates.io
      id: crates-check
      run: |
        VERSION="${{ needs.validate.outputs.version }}"
        if curl -s "https://crates.io/api/v1/crates/chaotic_semantic_memory/$VERSION" | grep -q '"version"'; then
          echo "⚠️ Version $VERSION already exists on crates.io, skipping publish"
          echo "already-published=true" >> $GITHUB_OUTPUT
        else
          echo "already-published=false" >> $GITHUB_OUTPUT
        fi

    - name: Publish workspace crates in dependency order
      if: steps.crates-check.outputs.already-published != 'true'
      run: |
        # Pre-check: Verify workspace crate names are not taken by unrelated projects
        echo "Checking crates.io name availability..."
        CRATES="csm-chaos csm-core csm-traits csm-embedding csm-memory csm-retrieval csm-persistence"
        NAME_CONFLICT=false
        for crate in $CRATES; do
          CRATE_VERSION=$(grep -m1 '^version' "crates/$crate/Cargo.toml" | cut -d'"' -f2)
          SEARCH_RESULT=$(cargo search "$crate" 2>/dev/null | head -1)
          if echo "$SEARCH_RESULT" | grep -q "^$crate = "; then
            # Name exists - check if it's our version or an unrelated crate
            EXISTING_VERSION=$(echo "$SEARCH_RESULT" | grep -oP '"\K[^"]+')
            if [ "$EXISTING_VERSION" != "$CRATE_VERSION" ]; then
              echo "❌ CONFLICT: $crate@$EXISTING_VERSION exists on crates.io (need $CRATE_VERSION)"
              echo "   This name is taken by an unrelated project. Rename the crate before publishing."
              NAME_CONFLICT=true
            fi
          fi
        done
        if [ "$NAME_CONFLICT" = true ]; then
          echo ""
          echo "::error::Workspace crate name conflicts detected. Rename crates and update Cargo.toml dependencies."
          exit 1
        fi
        echo "✅ All workspace crate names available"

        # Publish order based on dependency graph:
        # 1. csm-chaos (no internal deps)
        # 2. csm-core (depends on csm-chaos optionally)
        # 3. csm-traits, csm-embedding, csm-memory (depend on csm-core)
        # 4. csm-retrieval, csm-persistence (depend on csm-core + csm-memory)
        for crate in $CRATES; do
          echo "Publishing $crate..."
          # Skip if already published (idempotent)
          CRATE_VERSION=$(grep -m1 '^version' "crates/$crate/Cargo.toml" | cut -d'"' -f2)
          if cargo search "$crate" 2>/dev/null | grep -q "^$crate = \"$CRATE_VERSION\""; then
            echo "  ⏭️ $crate@$CRATE_VERSION already on crates.io, skipping"
            continue
          fi
          cargo publish -p "$crate" --allow-dirty || {
            echo "  ⚠️ $crate publish failed (may already exist), continuing..."
          }
          # Wait for crates.io index to propagate
          sleep 20
        done
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    - name: Publish to crates.io
      if: steps.crates-check.outputs.already-published != 'true'
      run: cargo publish --allow-dirty
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  create-github-release:
    runs-on: ubuntu-24.04
    needs: [validate, build-cli-matrix, build-wasm]
    if: needs.validate.outputs.release-needed == 'true'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ needs.validate.outputs.release-ref }}
        fetch-depth: 0

    - name: Check if GitHub release already exists
      id: release-check
      run: |
        VERSION="${{ needs.validate.outputs.version }}"
        TAG="v${VERSION}"
        if gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1; then
          echo "⚠️ GitHub release $TAG already exists, skipping creation"
          echo "release-exists=true" >> $GITHUB_OUTPUT
        else
          echo "release-exists=false" >> $GITHUB_OUTPUT
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Download all CLI binary artifacts
      if: steps.release-check.outputs.release-exists != 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: csm-*
        path: release
        merge-multiple: true

    - name: Download WASM artifact
      if: steps.release-check.outputs.release-exists != 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: wasm-artifact
        path: release

    - name: Extract changelog for this version
      id: changelog
      if: steps.release-check.outputs.release-exists != 'true'
      run: |
        VERSION="${{ needs.validate.outputs.version }}"

        # Single-quoted awk avoids all shell escaping issues.
        # -v passes the version string cleanly into awk.
        # index() does a plain string match, so dots in "0.2.1" are not treated as regex wildcards.
        CHANGELOG_CONTENT=$(awk -v ver="$VERSION" '
          /^## \[/ {
            if (found) exit
            if (index($0, "[" ver "]") > 0) { found=1; next }
          }
          found { print }
        ' CHANGELOG.md)

        if [ -z "$CHANGELOG_CONTENT" ]; then
          echo "⚠️ No changelog content found for version $VERSION"
          echo "Release $VERSION" > release_notes.md
        else
          printf '%s\n' "$CHANGELOG_CONTENT" > release_notes.md
          echo "✓ Extracted changelog content ($(wc -l < release_notes.md) lines)"
        fi

    - name: Create GitHub Release
      if: steps.release-check.outputs.release-exists != 'true'
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        tag_name: v${{ needs.validate.outputs.version }}
        target_commitish: ${{ github.sha }}
        name: v${{ needs.validate.outputs.version }}
        body_path: release_notes.md
        files: release/*.tar.gz
        draft: false
        prerelease: ${{ contains(needs.validate.outputs.version, '-') }}
        make_latest: true

  publish-npm-wasm:
    runs-on: ubuntu-24.04
    needs: [validate, build-wasm]
    if: needs.validate.outputs.release-needed == 'true'
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ needs.validate.outputs.release-ref }}

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        cache: false
        toolchain: stable
        target: wasm32-unknown-unknown

    - name: Install wasm-pack
      run: cargo install wasm-pack

    - name: Check if version already published to npm
      id: npm-check
      run: |
        VERSION="${{ needs.validate.outputs.version }}"
        NPM_VERSION=$(npm view @d-o-hub/chaotic_semantic_memory version 2>/dev/null || echo "none")
        if [ "$NPM_VERSION" = "$VERSION" ]; then
          echo "⚠️ Version $VERSION already exists on npm, skipping publish"
          echo "already-published=true" >> $GITHUB_OUTPUT
        else
          echo "already-published=false" >> $GITHUB_OUTPUT
        fi

    - name: Build WASM package
      if: steps.npm-check.outputs.already-published != 'true'
      run: |
        # ADR-0094: canonical npm artifact is crates/csm-wasm (matches CI wasm job).
        # Absolute out-dir: wasm-pack resolves relative paths from the crate dir.
        # Recovery tags may predate package-local wasm-opt metadata, so inject it
        # only when absent; this changes build metadata, not release code.
        if ! grep -q '^\[package.metadata.wasm-pack.profile.release\]' crates/csm-wasm/Cargo.toml; then
          cat >> crates/csm-wasm/Cargo.toml <<'EOF'

        [package.metadata.wasm-pack.profile.release]
        wasm-opt = ["-O", "--enable-bulk-memory", "--enable-sign-ext", "--enable-nontrapping-float-to-int"]
        EOF
        fi
        OUT="${{ github.workspace }}/wasm/pkg"
        wasm-pack build crates/csm-wasm --release --target web \
          --out-dir "${OUT}" \
          --out-name chaotic_semantic_memory
        cp LICENSE "${OUT}/"
        cp README.md "${OUT}/"
        # Use prepared package.json with scoped name @d-o-hub/chaotic_semantic_memory
        cp wasm/package.json "${OUT}/package.json"

    - name: Publish to npm
      if: steps.npm-check.outputs.already-published != 'true'
      run: |
        cd wasm/pkg
        VERSION="${{ needs.validate.outputs.version }}"
        WORKFLOW_NAME="release.yml"
        echo "Publishing @d-o-hub/chaotic_semantic_memory@${VERSION} to npm..."
        echo "Workflow: ${WORKFLOW_NAME} (must match npmjs Trusted Publisher config)"

        # Try OIDC Trusted Publishing first (preferred)
        if npm publish --provenance --access public 2>&1 | tee /tmp/npm-publish.log; then
          echo "✅ Published with OIDC Trusted Publishing"
          exit 0
        fi

        # Analyze OIDC failure
        if grep -q "404" /tmp/npm-publish.log; then
          echo "::error::OIDC 404 - Trusted Publisher workflow mismatch or not configured"
          echo "::error::Current workflow: ${WORKFLOW_NAME}"
          echo "::error::Fix: Go to npmjs.com/package/@d-o-hub/chaotic_semantic_memory/settings/trusted-publishers"
          echo "::error::Add Trusted Publisher for workflow: ${WORKFLOW_NAME}"
          echo "::error::If using multiple workflows, add entries for each (release.yml, npm-publish.yml)"
        fi

        # Check if NPM_TOKEN is available for fallback
        if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
          echo "::error::OIDC failed and NPM_TOKEN not configured"
          echo "::error::Fix: Configure Trusted Publisher on npmjs.com OR add NPM_TOKEN secret"
          exit 1
        fi

        # Fallback to NPM_TOKEN
        echo "Falling back to NPM_TOKEN..."
        npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-npm-cli:
    runs-on: ubuntu-24.04
    needs: [validate, build-cli-matrix, create-github-release]
    if: needs.validate.outputs.release-needed == 'true'
    environment: npm-cli
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ needs.validate.outputs.release-ref }}

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - name: Download CLI binary artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: csm-*
        path: cli-artifacts
        merge-multiple: true

    - name: Stage binaries inside npm package
      shell: bash
      run: |
        rm -f cli-npm/bin/* || true
        mkdir -p cli-npm/bin
        shopt -s nullglob
        COUNT=0
        for archive in cli-artifacts/*.tar.gz; do
          echo "Extracting $archive"
          tar -xzf "$archive" -C cli-npm/bin
          COUNT=$((COUNT + 1))
        done
        echo "Packaged binaries ($COUNT):"
        ls -R cli-npm/bin

        # Hard validation: ensure all 5 platform binaries are present before publishing
        if [ "$COUNT" -lt 5 ]; then
          echo "::error::Missing platform binaries! Expected 5, found $COUNT."
          exit 1
        fi

    - name: Check if CLI version already published to npm
      id: npm-check
      run: |
        VERSION="${{ needs.validate.outputs.version }}"
        NPM_VERSION=$(npm view @d-o-hub/csm version 2>/dev/null || echo "none")
        if [ "$NPM_VERSION" = "$VERSION" ]; then
          echo "⚠️ Version $VERSION already exists on npm for @d-o-hub/csm, skipping publish"
          echo "already-published=true" >> $GITHUB_OUTPUT
        else
          echo "already-published=false" >> $GITHUB_OUTPUT
        fi

    - name: Build CLI npm package
      if: steps.npm-check.outputs.already-published != 'true'
      run: |
        VERSION="${{ needs.validate.outputs.version }}"
        # CLI binaries are already staged under cli-npm/bin via downloaded artifacts.
        # Postinstall still falls back to GitHub Releases when a platform binary is absent.
        # Update version in package.json
        jq ".version = \"$VERSION\"" cli-npm/package.json > cli-npm/package.json.tmp
        mv cli-npm/package.json.tmp cli-npm/package.json
        # Ensure LICENSE and README are in place
        cp LICENSE cli-npm/
        # README already exists in cli-npm/

    - name: Publish CLI to npm
      if: steps.npm-check.outputs.already-published != 'true'
      run: |
        cd cli-npm
        VERSION="${{ needs.validate.outputs.version }}"
        WORKFLOW_NAME="release.yml"
        echo "Publishing @d-o-hub/csm@${VERSION} to npm..."
        echo "Workflow: ${WORKFLOW_NAME} (must match npmjs Trusted Publisher config)"

        # Try OIDC Trusted Publishing first (preferred)
        if npm publish --provenance --access public 2>&1 | tee /tmp/npm-publish.log; then
          echo "✅ Published @d-o-hub/csm with OIDC Trusted Publishing"
          exit 0
        fi

        # Analyze OIDC failure
        if grep -q "404" /tmp/npm-publish.log; then
          echo "::error::OIDC 404 - Trusted Publisher workflow mismatch or not configured"
          echo "::error::Current workflow: ${WORKFLOW_NAME}"
          echo "::error::Fix: Go to npmjs.com/package/@d-o-hub/csm/settings/trusted-publishers"
          echo "::error::Add Trusted Publisher for workflow: ${WORKFLOW_NAME}"
        fi

        # Check if NPM_TOKEN is available for fallback
        if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
          echo "::error::OIDC failed and NPM_TOKEN not configured"
          echo "::error::Fix: Configure Trusted Publisher on npmjs.com OR add NPM_TOKEN secret"
          exit 1
        fi

        # Fallback to NPM_TOKEN
        echo "Falling back to NPM_TOKEN..."
        npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  verify-release:
    runs-on: ubuntu-24.04
    needs: [validate, publish-crates, create-github-release, publish-npm-wasm, publish-npm-cli]
    if: always() && needs.validate.outputs.release-needed == 'true'
    steps:
    - name: Verify complete release across all registries (with retry)
      run: |
        VERSION="${{ needs.validate.outputs.version }}"
        ERRORS=""

        echo "## Release Verification for v${VERSION}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Retry helper: exponential backoff for registry checks
        # Registries take 1-2 minutes to index after publish
        check_with_retry() {
          local name="$1"
          local check_cmd="$2"
          local max_retries=6
          local delays=(5 10 15 20 30 30)
          local attempt=0

          while [ $attempt -lt $max_retries ]; do
            if eval "$check_cmd"; then
              echo "✅ $name: Published" >> $GITHUB_STEP_SUMMARY
              return 0
            fi
            attempt=$((attempt + 1))
            if [ $attempt -lt $max_retries ]; then
              echo "Waiting for $name to propagate... (attempt $attempt/$max_retries, delay ${delays[$attempt - 1]}s)"
              sleep ${delays[$attempt - 1]}
            fi
          done
          ERRORS="${ERRORS}${name}; "
          echo "❌ $name: Missing (after $max_retries attempts)" >> $GITHUB_STEP_SUMMARY
          return 1
        }

        # Check crates.io (with retry)
        echo "Checking crates.io..."
        check_with_retry "crates.io" "curl -s -H \"User-Agent: chaotic-semantic-memory-ci (github.com/d-o-hub/chaotic_semantic_memory)\" 'https://crates.io/api/v1/crates/chaotic_semantic_memory/$VERSION' | grep -q '\"version\"'"

        # Check npm WASM package (with retry)
        echo "Checking npm WASM package..."
        check_with_retry "npm (@d-o-hub/chaotic_semantic_memory)" "[ \"$(npm view @d-o-hub/chaotic_semantic_memory version 2>/dev/null || echo 'none')\" = \"$VERSION\" ]"

        # Check npm CLI package (with retry)
        echo "Checking npm CLI package..."
        check_with_retry "npm (@d-o-hub/csm)" "[ \"$(npm view @d-o-hub/csm version 2>/dev/null || echo 'none')\" = \"$VERSION\" ]"

        # Check GitHub release (no retry needed - immediate)
        echo "Checking GitHub release..."
        if gh release view "v${VERSION}" --repo ${{ github.repository }} >/dev/null 2>&1; then
          echo "✅ GitHub Release: Created" >> $GITHUB_STEP_SUMMARY
        else
          ERRORS="${ERRORS}github; "
          echo "❌ GitHub Release: Missing" >> $GITHUB_STEP_SUMMARY
        fi

        # Report result
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -n "$ERRORS" ]; then
          echo "::error::Partial release detected! Missing: ${ERRORS}"
          echo "⚠️ **Partial Release Detected**" >> $GITHUB_STEP_SUMMARY
          echo "Missing registries: ${ERRORS}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Recovery Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Check workflow logs for failure details" >> $GITHUB_STEP_SUMMARY
          echo "2. Re-run the failed workflow (idempotent)" >> $GITHUB_STEP_SUMMARY
          echo "3. Or manually publish to missing registries" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

        echo "✅ **All registries verified successfully**" >> $GITHUB_STEP_SUMMARY
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    runs-on: ubuntu-24.04
    needs: [validate, build-cli-matrix, build-wasm, publish-crates, create-github-release, publish-npm-wasm, publish-npm-cli, verify-release]
    if: always()
    steps:
    - name: Release summary
      run: |
        echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        VERSION="${{ needs.validate.outputs.version }}"

        if [ "${{ needs.validate.outputs.release-needed }}" != "true" ]; then
          echo "ℹ️ No release needed for v${VERSION} (tag already exists)." >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.publish-crates.result }}" == "skipped" ] || [ "${{ needs.publish-crates.result }}" == "success" ]; then
          echo "✅ crates.io: Published or already exists" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ crates.io: Failed" >> $GITHUB_STEP_SUMMARY
        fi

        if [ "${{ needs.create-github-release.result }}" == "skipped" ] || [ "${{ needs.create-github-release.result }}" == "success" ]; then
          echo "✅ GitHub Release: Created or already exists" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ GitHub Release: Failed" >> $GITHUB_STEP_SUMMARY
        fi

        if [ "${{ needs.publish-npm-wasm.result }}" == "skipped" ] || [ "${{ needs.publish-npm-wasm.result }}" == "success" ]; then
          echo "✅ npm (@d-o-hub/chaotic_semantic_memory): Published or already exists" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ npm (@d-o-hub/chaotic_semantic_memory): Failed" >> $GITHUB_STEP_SUMMARY
        fi

        if [ "${{ needs.publish-npm-cli.result }}" == "skipped" ] || [ "${{ needs.publish-npm-cli.result }}" == "success" ]; then
          echo "✅ npm (@d-o-hub/csm): Published or already exists" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ npm (@d-o-hub/csm): Failed" >> $GITHUB_STEP_SUMMARY
        fi
