name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v6

    - name: Extract version from tag
      id: version
      run: |
        VERSION="${GITHUB_REF#refs/tags/v}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"

    - name: Validate version matches Cargo.toml
      run: |
        TAG_VERSION="${GITHUB_REF#refs/tags/v}"
        CARGO_VERSION=$(grep '^version =' Cargo.toml | head -1 | cut -d'"' -f2)
        if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
          echo "❌ Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
          exit 1
        fi
        echo "✓ Version matches: $TAG_VERSION"

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Validate publish dry-run
      run: cargo publish --dry-run

  build-artifacts:
    runs-on: ubuntu-24.04
    needs: validate
    steps:
    - uses: actions/checkout@v6

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Cache cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release binary
      run: cargo build --release

    - name: Install WASM target
      run: rustup target add wasm32-unknown-unknown

    - name: Build WASM release
      run: cargo build --target wasm32-unknown-unknown --release --features wasm

    - name: Prepare release artifacts
      run: |
        mkdir -p release
        cp target/release/csm release/csm-x86_64-unknown-linux-gnu
        cp target/wasm32-unknown-unknown/release/chaotic_semantic_memory.wasm release/
        cd release
        tar -czvf chaotic_semantic_memory-${{ needs.validate.outputs.version }}-linux-x86_64.tar.gz csm-x86_64-unknown-linux-gnu
        tar -czvf chaotic_semantic_memory-${{ needs.validate.outputs.version }}-wasm.tar.gz chaotic_semantic_memory.wasm

    - name: Upload release artifacts
      uses: actions/upload-artifact@v6
      with:
        name: release-artifacts
        path: release/*.tar.gz
        retention-days: 30

  publish-crates:
    runs-on: ubuntu-24.04
    needs: [validate, build-artifacts]
    environment: crates.io
    steps:
    - uses: actions/checkout@v6

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Publish to crates.io
      run: cargo publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  create-github-release:
    runs-on: ubuntu-24.04
    needs: [validate, publish-crates, build-artifacts]
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Download release artifacts
      uses: actions/download-artifact@v7
      with:
        name: release-artifacts
        path: release

    - name: Extract changelog for this version
      id: changelog
      run: |
        VERSION="${{ needs.validate.outputs.version }}"
        awk "/^## \\[${VERSION}\\]/,/^## \\[/" CHANGELOG.md | sed '1d;$d' > release_notes.md
        if [ ! -s release_notes.md ]; then
          echo "Release $VERSION" > release_notes.md
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: chaotic_semantic_memory v${{ needs.validate.outputs.version }}
        body_path: release_notes.md
        files: release/*.tar.gz
        draft: false
        prerelease: ${{ contains(needs.validate.outputs.version, '-') }}
        generate_release_notes: true

  notify:
    runs-on: ubuntu-24.04
    needs: [validate, build-artifacts, publish-crates, create-github-release]
    if: always()
    steps:
    - name: Release summary
      run: |
        echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        VERSION="${{ needs.validate.outputs.version }}"

        if [ "${{ needs.publish-crates.result }}" == "success" ] && \
           [ "${{ needs.create-github-release.result }}" == "success" ]; then
          echo "✅ Successfully released v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **crates.io**: Published" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Release**: Created with artifacts" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Release v${VERSION} had failures:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| validate | ${{ needs.validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| build-artifacts | ${{ needs.build-artifacts.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| publish-crates | ${{ needs.publish-crates.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| create-github-release | ${{ needs.create-github-release.result }} |" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

  update-rolling-tags:
    runs-on: ubuntu-24.04
    needs: [validate, create-github-release]
    if: needs.create-github-release.result == 'success'
    steps:
    - uses: actions/checkout@v6

    - name: Update rolling tags
      uses: cssnr/update-version-tags-action@v2
      with:
        prefix: v
        major: true
        minor: true
        token: ${{ secrets.GITHUB_TOKEN }}
