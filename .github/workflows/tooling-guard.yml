name: Tooling Guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-critical-files:
    name: Check critical file deletions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for deleted critical files
        run: |
          # Critical tooling and security files that must not be deleted
          CRITICAL_FILES=(
            ".githooks/pre-commit"
            ".pre-commit-config.yaml"
            ".gitleaks.toml"
            ".secretlintrc.json"
            ".secretlintignore"
            ".github/workflows/secret-scan.yml"
            ".github/workflows/ci.yml"
            "scripts/harness-check.sh"
            "scripts/quality-gates.sh"
            "commitlint.config.cjs"
            "flake.nix"
          )

          # Get files deleted in this PR relative to the base branch
          DELETED_FILES=$(git diff --name-status origin/${{ github.base_ref }}...HEAD | grep '^D' | awk '{print $2}')

          VIOLATIONS=""
          for file in "${CRITICAL_FILES[@]}"; do
            if echo "$DELETED_FILES" | grep -qx "$file"; then
              VIOLATIONS="${VIOLATIONS}\n  ❌ ${file}"
            fi
          done

          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Critical tooling files are being deleted in this PR!"
            echo ""
            echo "═══════════════════════════════════════════════════════════════"
            echo "🚨 CRITICAL FILE DELETION DETECTED"
            echo "═══════════════════════════════════════════════════════════════"
            echo ""
            echo "The following protected files are deleted in this PR:"
            echo -e "$VIOLATIONS"
            echo ""
            echo "These files are essential for repository security and quality"
            echo "gates. If this deletion is intentional, a repository admin"
            echo "must approve this PR."
            echo ""
            echo "Common cause: Branch is behind main and needs to merge latest"
            echo "main to pick up newly added tooling files."
            echo ""
            echo "Fix: git merge origin/main"
            echo "═══════════════════════════════════════════════════════════════"
            exit 1
          fi

          echo "✅ No critical file deletions detected"
