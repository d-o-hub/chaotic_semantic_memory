name: Version Integrity

on:
  pull_request:
    paths:
    - 'Cargo.toml'
    - 'CHANGELOG.md'
    - 'wasm/package.json'
    - 'cli-npm/package.json'
    - 'VERSION'
  push:
    branches:
    - main
    paths:
    - 'Cargo.toml'
    - 'CHANGELOG.md'
    - 'wasm/package.json'
    - 'cli-npm/package.json'
    - 'VERSION'

permissions:
  contents: read

jobs:
  check-version-sync:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Verify version consistency
      run: |
        bash scripts/verify-version-sync.sh

  check-changelog-entry:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Validate CHANGELOG entry
      run: bash scripts/validate-changelog.sh