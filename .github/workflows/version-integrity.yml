name: Version Integrity

on:
  pull_request:
    paths:
    - 'Cargo.toml'
    - 'CHANGELOG.md'
    - 'wasm/package.json'
  push:
    branches:
    - main
    paths:
    - 'Cargo.toml'
    - 'CHANGELOG.md'
    - 'wasm/package.json'

permissions:
  contents: read

jobs:
  check-version-sync:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6

    - name: Verify version consistency
      run: |
        bash scripts/verify-version-sync.sh

  check-changelog-entry:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6

    - name: Validate CHANGELOG entry
      run: bash scripts/validate-changelog.sh