name: Version Integrity

on:
  pull_request:
    paths:
    - 'Cargo.toml'
    - 'CHANGELOG.md'
    - 'wasm/package.json'
    - 'cli-npm/package.json'
    - 'VERSION'
  push:
    branches:
    - main
    paths:
    - 'Cargo.toml'
    - 'CHANGELOG.md'
    - 'wasm/package.json'
    - 'cli-npm/package.json'
    - 'VERSION'

permissions:
  contents: read

jobs:
  check-version-sync:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Verify version consistency
      run: |
        bash scripts/verify-version-sync.sh

  check-changelog-entry:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Validate CHANGELOG entry
      run: bash scripts/validate-changelog.sh