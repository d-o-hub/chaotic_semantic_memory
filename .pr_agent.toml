# .pr_agent.toml
# Repository: d-o-hub/chaotic_semantic_memory
# Place this file in the repo root on the default branch.

[github_app]
pr_commands = [
  "/describe",
  "/review",
  "/improve"
]

[pr_reviewer]
persistent_comment = true
final_update_message = true
enable_help_text = false

require_score_review = true
require_tests_review = true
require_estimate_effort_to_review = true
require_can_be_split_review = true
require_security_review = true
require_ticket_analysis_review = true

enable_review_labels_security = true
enable_review_labels_effort = true

extra_instructions = """
Review this PR as a systems-level Rust library maintainer.

Project context:
- This repository is a Rust crate for chaotic semantic memory, echo-state networks,
  hyperdimensional vectors, SIMD-aware computation, and AI memory workflows.
- Prioritize correctness, determinism, stability, and crate usability over stylistic nits.

Focus especially on:
- Soundness: unsafe Rust, pointer/index safety, panics, integer overflow/underflow,
  unchecked assumptions, UB risks, and accidental allocations in hot paths.
- Numerical behavior: floating-point stability, normalization, saturation, thresholding,
  similarity calculations, reservoir update math, and reproducibility concerns.
- API quality: public API churn, feature-flag boundaries, serde compatibility,
  backward compatibility, naming clarity, and docs for exported items.
- Performance: unnecessary cloning, heap churn, cache-unfriendly layouts, missed borrowing
  opportunities, iterator misuse in hot loops, and SIMD regressions.
- Concurrency: Send/Sync assumptions, interior mutability, race-prone patterns,
  and thread-safety of shared state.
- Testing: edge cases, deterministic tests for stochastic/chaotic behavior, property tests,
  serialization roundtrips, and regressions around vector dimensions and memory capacity.
- Security: untrusted input handling, deserialization risks, file/path handling if added,
  and denial-of-service risks from unbounded allocations.

When giving feedback:
- Prefer high-signal findings only.
- Separate correctness issues from optional optimizations.
- Do not suggest broad rewrites unless the current approach is clearly risky.
- Call out missing benchmarks only when the PR changes hot-path code.
"""

[pr_description]
publish_labels = true
use_description_markers = false
add_original_user_description = true

[pr_code_suggestions]
num_code_suggestions = 6
commitable_code_suggestions = false
rank_suggestions = true

extra_instructions = """
Suggest improvements only when they are concrete and low-risk.

Prioritize:
- Replacing clones with borrows where safe.
- Improving error types and error propagation.
- Tightening trait bounds and lifetimes only when it simplifies usage or correctness.
- Adding tests for edge cases, deterministic seeds, and serialization compatibility.
- Improving docs on public APIs, examples, and feature-gated behavior.
- Making hot loops and vector operations more efficient without reducing readability.

Avoid:
- Cosmetic suggestions with little engineering value.
- Large architectural refactors.
- Suggestions that would change public behavior without a strong reason.
"""

[pr_update_changelog]
push_changelog_changes = false

[config]
publish_output = true
verbosity_level = 1
