---
# .pre-commit-config.yaml — Split fast (commit) vs thorough (push)
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# Install push hooks: pre-commit install --hook-type pre-push
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-toml
      - id: check-merge-conflict

  - repo: local
    hooks:
      # FAST: format check only — runs on every commit
      - id: cargo-fmt
        name: cargo fmt (fast)
        entry: bash scripts/harness-check.sh fmt
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      # THOROUGH: clippy — runs only on push
      - id: cargo-clippy
        name: cargo clippy (thorough)
        entry: bash scripts/harness-check.sh clippy
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      # THOROUGH: deny — runs only on push
      - id: cargo-deny
        name: cargo deny (thorough)
        entry: bash scripts/harness-check.sh deny
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: gitleaks
        name: gitleaks
        entry: gitleaks protect --staged --verbose
        language: system
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.21.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']

  - repo: https://github.com/shellcheck-contrib/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--strict, -d, "{rules: {line-length: {max: 120}}}"]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        args: ["--ignore", "node_modules", "--ignore", "target"]
