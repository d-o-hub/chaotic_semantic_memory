[workspace]
members = [
    "crates/csm-core",
    "crates/csm-embedding",
    "crates/csm-memory",
    "crates/csm-retrieval",
    "crates/csm-persistence",
    "crates/csm-cli",
    "crates/csm-traits",
    "crates/csm-wasm",
    "crates/csm-chaos",
    ".",
    "benchmarks",
    "crates/csm-duckdb",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/d-o-hub/chaotic_semantic_memory"
homepage = "https://github.com/d-o-hub/chaotic_semantic_memory"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.11"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["json"] }
tokio = "1.43.0"
anyhow = "1.0.102"
sha2 = "0.10.9"
rand = "0.10.1"
rand_chacha = "0.10.0"
uuid = { version = "1.23.2", features = ["v4", "serde"] }
tempfile = "3.16.0"
base64 = "0.22.1"

[package]
name = "chaotic_semantic_memory"
version = "0.3.7"
edition = "2024"
rust-version = "1.88"
description = "AI memory systems with hyperdimensional vectors and chaotic reservoirs"
license = "MIT"
repository = "https://github.com/d-o-hub/chaotic_semantic_memory"
homepage = "https://github.com/d-o-hub/chaotic_semantic_memory"
documentation = "https://docs.rs/chaotic_semantic_memory"
readme = "README.md"
keywords = ["ai", "memory", "hypervector", "reservoir", "wasm"]
categories = ["data-structures", "algorithms", "wasm"]
include = [
    "/src",
    "/benches",
    "/examples",
    "/tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[dependencies]
csm-core = { path = "crates/csm-core", version = "0.3.7" }
csm-embedding = { path = "crates/csm-embedding", version = "0.3.7" }
csm-memory = { path = "crates/csm-memory", version = "0.3.7" }
csm-retrieval = { path = "crates/csm-retrieval", version = "0.3.7" }

tempfile = { workspace = true }
# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
cloudevents-sdk = { version = "0.9.0", optional = true }
uuid = { workspace = true, optional = true }
bincode = "1.3.3"
base64 = { workspace = true }

# Error handling
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Random number generation
rand = { workspace = true }
rand_chacha = { workspace = true }

# Async trait support
async-trait = "0.1.83"

# HTTP client for remote embedding providers (opt-in)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], optional = true }

# Local ONNX embeddings (opt-in via embed-fastembed feature)
fastembed = { version = "4", optional = true }

# HNSW ANN index (opt-in via ann-hnsw feature)
hnsw_rs = { version = "0.3.4", optional = true }

# CLI dependencies (gated behind "cli" feature)
clap = { version = "4.5", features = ["derive", "env", "string"], optional = true }
clap_complete = { version = "4.5.42", optional = true }
anyhow = { workspace = true, optional = true }
colored = { version = "2.2.0", optional = true }
glob = { version = "0.3.2", optional = true }

# MCP server dependencies (gated behind "mcp" feature - ADR-0067)
rmcp = { version = "1.7", optional = true, features = ["server", "macros", "transport-io", "server-side-http", "transport-streamable-http-server"] }

# Observability dependencies (ADR-0072, opt-in via "prometheus" feature)
prometheus = { version = "0.13", optional = true, default-features = false }

# OTLP gRPC observability dependencies (ADR-0072/ADR-0086, opt-in via "otlp" feature)
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", optional = true }
opentelemetry-otlp = { version = "0.27", optional = true, features = ["grpc-tonic"] }
tracing-opentelemetry = { version = "0.28", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# CPU parallelism (opt-in via "parallel" feature)
rayon = { version = "1.10.0", optional = true }

# Database - Use libsql NOT turso-client (opt-in via "persistence" feature)
libsql = { version = "0.9.30", default-features = false, features = ["sync", "hrana", "remote"], optional = true }
csm-persistence = { path = "crates/csm-persistence", version = "0.3.7" }
# `net` is required by the Prometheus /metrics server (ADR-0072).
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "fs", "net"] }

# HTTP server for Prometheus /metrics endpoint (ADR-0072, opt-in via "prometheus" feature)
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
axum = { version = "0.7", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.2", features = ["wasm_js"] }
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.64"
js-sys = "0.3.77"
console_error_panic_hook = { version = "0.1", optional = false }
csm-persistence = { path = "crates/csm-persistence", version = "0.3.7", default-features = false, features = ["wasm"] }

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }
proptest = "1.6.0"
reqwest = { version = "0.12", features = ["json"] }
# CLI testing
assert_cmd = "2.0.16"
predicates = "3.1.3"
mockito = "1.5.0"

[[bench]]
name = "benchmark"
harness = false

[[bench]]
name = "persistence_benchmark"
harness = false

[[bench]]
name = "bm25_benchmark"
harness = false

[[bench]]
name = "rerank_benchmark"
harness = false

[[bench]]
name = "hybrid_benchmark"
harness = false

[[bench]]
name = "embedding_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"

# ============================================================================
# LINTS CONFIGURATION (Rust 2024)
# ============================================================================

[lints.rust]
# Safety lints
unsafe_code = "allow"  # SIMD uses intentional unsafe blocks
missing_docs = "allow"  # Project uses selective documentation
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("rerank-cross"))'] }

# Serialization struct fields may be unused but needed for format
dead_code = "allow"

[lints.clippy]
# Enable all clippy lints at warning level
all = { level = "warn", priority = -1 }

# Pedantic lints are too strict for this project
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }

# ============================================================================
# ADR-0077: Promoted from pedantic — correctness signal (Phase A)
# ============================================================================
float_cmp = "warn"                      # Strict f32/f64 == almost always a bug
significant_drop_tightening = "warn"    # Lock held longer than needed
cast_precision_loss = "warn"            # usize as f32 losing bits
cast_possible_truncation = "warn"       # i64 as u32 truncation risk
redundant_clone = "warn"                # Free perf wins
map_unwrap_or = "warn"                # Prefer map_or/map_or_else (DeepSource parity)
unnecessary_map_or = "warn"           # Then prefer is_some_and() or map_or_else()

# ============================================================================
# ADR-0077: Promoted from pedantic — library DX (Phase A allow, Phase C warn)
# ============================================================================
missing_errors_doc = "allow"            # Phase C: flip to warn after docs added
must_use_candidate = "allow"            # Phase C: flip to warn after audit

# ============================================================================
# ADR-0077: Promoted from nursery — free perf wins
# ============================================================================
missing_const_for_fn = "warn"           # Const fn free perf

# Explicit overrides for justified allows in source
too_many_arguments = "allow"  # Internal hot paths documented in GOAP_STATE
type_complexity = "allow"     # Complex generics in framework
needless_range_loop = "allow" # Intentional range iteration in hyperdim

# Production code should avoid panics but examples/benchmarks use them
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"

# Examples and benchmarks use println - allow in library
print_stdout = "allow"
print_stderr = "allow"

# Allow common short identifiers
many_single_char_names = "allow"

# Allow some cognitive complexity for hot paths
cognitive_complexity = "allow"

[lib]
crate-type = ["lib"]

[[bin]]
name = "csm"
path = "src/bin/csm.rs"
required-features = ["cli"]

[[example]]
name = "proof_of_concept"
path = "examples/proof_of_concept.rs"

[[example]]
name = "basic_in_memory"
path = "examples/basic_in_memory.rs"

[[example]]
name = "chatbot_memory"
path = "examples/chatbot_memory.rs"

[[example]]
name = "document_rag"
path = "examples/document_rag.rs"

[[example]]
name = "knowledge_graph"
path = "examples/knowledge_graph.rs"

[[example]]
name = "streaming_temporal"
path = "examples/streaming_temporal.rs"

[[example]]
name = "observability_otlp"
path = "examples/observability_otlp.rs"
required-features = ["prometheus", "otlp-json"]

[features]
default = ["cli", "persistence", "parallel"]
cli = ["dep:clap", "dep:clap_complete", "dep:anyhow", "dep:colored", "dep:glob"]
persistence = ["dep:libsql"]
parallel = ["dep:rayon"]
wasm = []
mcp = ["dep:rmcp", "cli", "dep:axum", "dep:tower", "dep:tower-http"]  # ADR-0067: MCP server requires CLI infrastructure

# Embedding providers (ADR-0069)
embed-fastembed = ["csm-embedding/embed-fastembed"]
embed-openai = ["csm-embedding/embed-openai"]
embed-voyage = ["csm-embedding/embed-voyage"]

# ANN backends (ADR-0068)
ann-hnsw = ["dep:hnsw_rs", "csm-memory/ann-hnsw"]
ann-lsh = ["csm-memory/ann-lsh"]


# CloudEvents integration (ADR-0078)
cloudevents = ["dep:cloudevents-sdk", "dep:uuid", "uuid/js"]
events-http = ["cloudevents", "cloudevents-sdk/http-binding", "dep:reqwest"]

# Observability exports (ADR-0072)
# `prometheus` enables a /metrics HTTP endpoint and a counter/histogram registry.
# `otlp-json` enables JSON-structured tracing for log shippers (lightweight OTLP alternative).
# `otlp` enables full OTLP gRPC tracing export via tonic/prost/protobuf (ADR-0086).
# All are opt-in and have no effect on default builds.
prometheus = ["dep:prometheus", "dep:hyper", "dep:hyper-util", "dep:http-body-util"]
otlp-json = []
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-sign-ext"]
