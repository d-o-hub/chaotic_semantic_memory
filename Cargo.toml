[package]
name = "chaotic_semantic_memory"
version = "0.1.0"
edition = "2021"

[dependencies]
ndarray = "0.16"
rayon = "1.10"
simd-json = "0.14"
lru = "0.12"
object-store = { package = "object_store", version = "0.10" }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
bytemuck = { version = "1.17", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.40", features = ["full"] }
turso-client = "0.8"
wasmtime = "24"

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.40", default-features = false, features = ["sync", "macros", "time", "rt"] }
wasmtime = { version = "24", default-features = false, optional = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "benchmark"
harness = false

[patch.crates-io]
turso-client = { path = "turso-client" }
