[package]
name = "chaotic_semantic_memory"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# Database - Use libsql NOT turso-client
libsql = "0.4"

# Async runtime
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync"] }

# Numerical computing
ndarray = "0.16"
rayon = "1.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# WASM support
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Caching
lru = "0.12"

# Random number generation
rand = "0.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio-test = "0.4"
tempfile = "3.0"
rand = "0.8"

[[bench]]
name = "benchmark"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[lib]
crate-type = ["lib", "cdylib"]

[[example]]
name = "proof_of_concept"
path = "examples/proof_of_concept.rs"

[features]
default = []
wasm = ["wasm-bindgen", "js-sys"]