[package]
name = "chaotic_semantic_memory"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "AI memory systems with hyperdimensional vectors and chaotic reservoirs"
license = "MIT"
repository = "https://github.com/d-o-hub/chaotic_semantic_memory"
homepage = "https://github.com/d-o-hub/chaotic_semantic_memory"
documentation = "https://docs.rs/chaotic_semantic_memory"
readme = "README.md"
keywords = ["ai", "memory", "hypervector", "reservoir", "wasm"]
categories = ["data-structures", "algorithms", "wasm"]
resolver = "3"
include = [
    "/src",
    "/benches",
    "/examples",
    "/tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[dependencies]
# Serialization
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"
bincode = "1.3.3"

# Error handling
thiserror = "2.0.11"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"

# Random number generation
rand = "0.8.5"

# CLI dependencies (gated behind "cli" feature)
clap = { version = "4.5.60", features = ["derive", "env", "string"], optional = true }
clap_complete = { version = "4.5.42", optional = true }
anyhow = { version = "1.0.102", optional = true }
colored = { version = "2.2.0", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# CPU parallelism
rayon = "1.10.0"

# Database - Use libsql NOT turso-client
libsql = "0.4"
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "sync", "fs"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.15", features = ["js"] }
tokio = { version = "1.43.0", features = ["rt", "macros", "sync"] }
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.61"
js-sys = "0.3.77"

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }
tempfile = "3.16.0"
proptest = "1.6.0"
# CLI testing
assert_cmd = "2.0.16"
predicates = "3.1.3"

[[bench]]
name = "benchmark"
harness = false

[[bench]]
name = "persistence_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "csm"
path = "src/bin/csm.rs"
required-features = ["cli"]

[[example]]
name = "proof_of_concept"
path = "examples/proof_of_concept.rs"

[[example]]
name = "basic_in_memory"
path = "examples/basic_in_memory.rs"

[[example]]
name = "chatbot_memory"
path = "examples/chatbot_memory.rs"

[[example]]
name = "document_rag"
path = "examples/document_rag.rs"

[[example]]
name = "knowledge_graph"
path = "examples/knowledge_graph.rs"

[[example]]
name = "streaming_temporal"
path = "examples/streaming_temporal.rs"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:clap_complete", "dep:anyhow", "dep:colored"]
wasm = []

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-sign-ext"]
