[package]
name = "chaotic_semantic_memory"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Error handling
thiserror = "1.0"
tracing = "0.1"

# Random number generation
rand = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# CPU parallelism
rayon = "1.10"

# Database - Use libsql NOT turso-client
libsql = "0.4"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "fs"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
tokio = { version = "1.40", features = ["rt", "macros", "sync"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.0"
proptest = "1.6"

[[bench]]
name = "benchmark"
harness = false

[[bench]]
name = "persistence_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[lib]
crate-type = ["lib", "cdylib"]

[[example]]
name = "proof_of_concept"
path = "examples/proof_of_concept.rs"

[[example]]
name = "basic_in_memory"
path = "examples/basic_in_memory.rs"

[features]
default = []
wasm = []
