[package]
name = "csm-chaos"
version = "0.3.7"
edition = "2024"
rust-version.workspace = true
description = "Chaotic maps and hashing primitives for chaotic_semantic_memory"
license = "MIT"
repository = "https://github.com/d-o-hub/chaotic_semantic_memory"

[dependencies]
libm = "0.2.11"
serde = { workspace = true, optional = true }

[features]
experimental-neural-circuit = []
experimental-voronoi-lsh = []
default = []
std = []
serde = ["dep:serde"]

[lib]
crate-type = ["lib"]

[[bench]]
name = "chaotic_hashing"
harness = false

[[bench]]
name = "chaotic_hashing_chebyshev"
harness = false

[dev-dependencies]
criterion = "0.5"

[lints]
workspace = true
[[bench]]
name = "chaotic_hashing_neural_circuit"
harness = false
required-features = ["experimental-neural-circuit"]

[[bench]]
name = "chaotic_hashing_voronoi"
harness = false
required-features = ["experimental-voronoi-lsh"]
