[package]
name = "csm-cli"
version = "0.3.7"
edition = "2024"
rust-version = "1.85"
description = "CLI for chaotic_semantic_memory"
license = "MIT"
repository = "https://github.com/d-o-hub/chaotic_semantic_memory"

[dependencies]
chaotic_semantic_memory = { path = "../..", version = "0.3.7", default-features = false }
csm-core = { path = "../csm-core", version = "0.3.7" }
csm-memory = { path = "../csm-memory", version = "0.3.7" }
csm-embedding = { path = "../csm-embedding", version = "0.3.7" }
csm-retrieval = { path = "../csm-retrieval", version = "0.3.7" }
csm-persistence = { path = "../csm-persistence", version = "0.3.7" }
clap = { version = "4.5", features = ["derive", "env", "string"] }
clap_complete = { version = "4.5.42" }
anyhow = "1.0.102"
colored = "2.2.0"
glob = "0.3.2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "csm"
path = "src/main.rs"

[features]
default = ["cli", "persistence"]
cli = ["chaotic_semantic_memory/cli"]
persistence = ["csm-persistence/libsql", "chaotic_semantic_memory/persistence"]
mcp = ["chaotic_semantic_memory/mcp"]

[lints]
workspace = true