[package]
name = "csm-cli"
version = "0.3.7"
edition = "2024"
rust-version.workspace = true
description = "CLI for chaotic_semantic_memory"
license = "MIT"
repository = "https://github.com/d-o-hub/chaotic_semantic_memory"

[dependencies]
chaotic_semantic_memory = { path = "../..", version = "0.3.7", default-features = false }
clap = { version = "4.5", features = ["derive", "env", "string"] }
colored = "2.2.0"
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "csm"
path = "src/main.rs"

[features]
default = ["cli", "persistence"]
cli = ["chaotic_semantic_memory/cli"]
persistence = ["chaotic_semantic_memory/persistence"]
mcp = ["chaotic_semantic_memory/mcp"]

[lints]
workspace = true