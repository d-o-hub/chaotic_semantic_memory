[package]
name = "csm-core-lib"
version = "0.3.8"
edition = "2024"
rust-version = "1.85"
description = "Hyperdimensional computing kernel for chaotic_semantic_memory"
license = "MIT"
repository = "https://github.com/d-o-hub/chaotic_semantic_memory"

[dependencies]
csm-chaos = { path = "../csm-chaos", version = "0.3.8", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
bincode = "1.3.3"
base64 = { workspace = true }
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { version = "1.10.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.2", features = ["wasm_js"] }
js-sys = "0.3.77"

[features]
experimental-neural-circuit = []
default = []
chaotic-hashing = ["dep:csm-chaos", "csm-chaos/std"]
parallel = ["dep:rayon"]

[lib]
crate-type = ["lib"]

[[bench]]
name = "chaotic_hashing"
harness = false

[dev-dependencies]
criterion = "0.5"

[lints]
workspace = true