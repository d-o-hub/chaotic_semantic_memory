[package]
name = "csm-duckdb"
version = "0.3.7"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/d-o-hub/chaotic_semantic_memory"
description = "Optional analytics, Parquet export, and SQL inspection for chaotic_semantic_memory"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive", "env"], optional = true }
base64 = { workspace = true }
sha2 = { workspace = true, optional = true }
uuid = { workspace = true, optional = true, features = ["v4"] }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "macros"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
duckdb = { version = "1.1", features = ["bundled"] }

[dev-dependencies]
chaotic_semantic_memory = { path = "../../", version = "0.3.7", default-features = false, features = ["persistence"] }
tempfile = { workspace = true }
insta = "1.40.0"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
clap = { version = "4.5", features = ["derive"] }

[features]
default = []
parquet = ["dep:sha2", "dep:uuid"]
cli = ["dep:clap", "dep:tokio"]

[[bin]]
name = "csm-analytics"
path = "src/bin/csm-analytics.rs"
required-features = ["cli"]
