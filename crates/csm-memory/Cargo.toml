[package]
name = "csm-memory"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Memory API for chaotic_semantic_memory"
license = "MIT"

[dependencies]
csm-core = { path = "../csm-core" }
csm-embedding = { path = "../csm-embedding" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1.83"
uuid = { workspace = true, optional = true }
cloudevents-sdk = { version = "0.9.0", optional = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], optional = true }
tokio = { workspace = true, features = ["sync", "fs", "rt-multi-thread"] }
bincode = "1.3.3"
# For observability
prometheus = { version = "0.13", optional = true, default-features = false }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }

[features]
default = []
cloudevents = ["dep:cloudevents-sdk", "dep:uuid", "uuid/js"]
events-http = ["cloudevents", "cloudevents-sdk/http-binding", "dep:reqwest"]
prometheus = ["dep:prometheus", "dep:hyper", "dep:hyper-util", "dep:http-body-util"]
otlp-json = []
