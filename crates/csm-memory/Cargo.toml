[package]
name = "csm-memory"
version = "0.3.7"
edition = "2024"
rust-version.workspace = true
description = "Concept store and singularity engine for chaotic_semantic_memory"
license = "MIT"
repository = "https://github.com/d-o-hub/chaotic_semantic_memory"

[dependencies]
csm-core-lib = { path = "../csm-core-lib", version = "0.3.7" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true, optional = true }
# ANN backends (opt-in)
hnsw_rs = { version = "0.3.4", optional = true }
tempfile = { workspace = true, optional = true }
bincode = { version = "1.3.3", optional = true }
rand = { workspace = true, optional = true }
rand_chacha = { version = "0.10.0", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Optional: all parallel paths are cfg-gated on the `parallel` feature with
# sequential fallbacks (ADR-0094 feature contract).
rayon = { version = "1.10", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.77"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = []
parallel = ["dep:rayon", "csm-core-lib/parallel"]
ann-hnsw = ["dep:hnsw_rs", "dep:tempfile", "dep:bincode"]
ann-lsh = ["dep:bincode", "dep:rand", "dep:rand_chacha"]

[lib]
crate-type = ["lib"]

[lints]
workspace = true