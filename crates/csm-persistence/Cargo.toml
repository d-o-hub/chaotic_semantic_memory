[package]
name = "csm-persistence"
version = "0.3.8"
edition = "2024"
rust-version = "1.85"
description = "Persistence backends for chaotic_semantic_memory"
license = "MIT"
repository = "https://github.com/d-o-hub/chaotic_semantic_memory"

[dependencies]
csm-core-lib = { path = "../csm-core-lib", version = "0.3.8" }
csm-memory = { path = "../csm-memory", version = "0.3.8" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true, optional = true, features = ["js"] }

# libSQL backend - gated to non-WASM targets only (mio incompatible with wasm32)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libsql = { version = "0.9.30", default-features = false, features = ["sync", "hrana", "remote"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }

[features]
default = ["persistence"]
persistence = ["dep:libsql"]
libsql = ["persistence"]
wasm = ["uuid"]

[lib]
crate-type = ["lib"]

[lints]
workspace = true