[package]
name = "csm-persistence"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Turso/libsql persistence for chaotic_semantic_memory"
license = "MIT"

[dependencies]
csm-core = { path = "../csm-core" }
csm-memory = { path = "../csm-memory" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "fs"] }
libsql = { version = "0.9.30", default-features = false, features = ["sync", "hrana", "remote"] }
sha2 = "0.10.9"
