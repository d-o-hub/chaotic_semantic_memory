[package]
name = "csm-traits"
version = "0.3.7"
edition = "2024"
rust-version.workspace = true
description = "Shared types and traits for chaotic_semantic_memory workspace"
license = "MIT"
repository = "https://github.com/d-o-hub/chaotic_semantic_memory"

[dependencies]
csm-core-lib = { path = "../csm-core-lib", version = "0.3.7" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4.45", features = ["serde"] }
async-trait = "0.1.83"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.77"

[features]
default = []
parallel = ["csm-core-lib/parallel"]

[lib]
crate-type = ["lib"]

[lints]
workspace = true