[package]
name = "csm-wasm"
version = "0.3.7"
edition = "2024"
rust-version = "1.85"
description = "WASM bindings for chaotic_semantic_memory"
license = "MIT"
repository = "https://github.com/d-o-hub/chaotic_semantic_memory"

[dependencies]
chaotic_semantic_memory = { path = "../..", version = "0.3.7", default-features = false, features = ["wasm"] }
csm-core-lib = { path = "../csm-core-lib", version = "0.3.7" }
csm-memory = { path = "../csm-memory", version = "0.3.7" }
csm-retrieval = { path = "../csm-retrieval", version = "0.3.7", default-features = false }
csm-traits = { path = "../csm-traits", version = "0.3.7" }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
web-sys = { version = "0.3.77", features = ["console"] }
console_error_panic_hook = { version = "0.1", optional = true }
getrandom = { version = "0.4.2", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.50"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-sign-ext", "--enable-nontrapping-float-to-int"]

[lints]
workspace = true
