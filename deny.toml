[graph]
targets = []
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained, no replacement in transitive deps (fastembed)" },
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x unmaintained, pinned by libsql" },
    { id = "RUSTSEC-2025-0119", reason = "number_prefix unmaintained, transitive dep from indicatif" },
    # Dependabot alert #22: opentelemetry_sdk unbounded memory in W3C Baggage (GHSA-w9wp-h8wv-79jx)
    # Patched in 0.32.1, we're at 0.27.1. Upgrade requires major API migration (deferred).
    # No RUSTSEC ID yet; added proactively for when one is assigned.
    # { id = "RUSTSEC-20XX-XXXX", reason = "opentelemetry_sdk 0.32 requires major API migration, blocked until ecosystem catches up" },
    # Dependabot alert #21: time DoS via stack exhaustion in RFC2822 parsing (RUSTSEC-2026-0009)
    # Patched in 0.3.47, pinned at 0.3.45 by tantivy 0.22.1 (transitive via fastembed).
    # We don't parse user-supplied RFC2822 dates; tantivy uses time internally.
    { id = "RUSTSEC-2026-0009", reason = "time 0.3.45 pinned by tantivy (via fastembed), no user-facing RFC2822 parsing" },
    # Dependabot alert #20: lru IterMut unsoundness (RUSTSEC-2026-0002)
    # Patched in 0.16.3, pinned at 0.12.5 by tantivy 0.22.1 (transitive via fastembed).
    # Informational/unsound — theoretical Stacked Borrows violation, no practical exploit.
    { id = "RUSTSEC-2026-0002", reason = "lru 0.12.5 pinned by tantivy (via fastembed), informational unsoundness" },
    # Dependabot alert: h2 unbounded empty DATA frames (RUSTSEC-2026-0258)
    # 0.4 copy bumped to 0.4.19 (fixed >=0.4.16). 0.3.27 copy is pinned by
    # hyper 0.14 via libsql/tonic/axum; no 0.3.x patch — requires libsql
    # upgrade (deferred, tracked in plans).
    { id = "RUSTSEC-2026-0258", reason = "h2 0.3.27 pinned by hyper 0.14 (libsql chain), no 0.3.x patch; 0.4 copy bumped to 0.4.19" },
    # zip 6.0.0 is a libduckdb-sys build dependency; csm-duckdb enables bundled,
    # so the vulnerable non-bundled build_linked extraction path is not compiled here.
    { id = "RUSTSEC-2026-0367", reason = "zip 6 build-dep; vulnerable extract path is cfg(not bundled); csm-duckdb enables duckdb/bundled" },
    { id = "RUSTSEC-2026-0368", reason = "zip 6 build-dep; vulnerable extract path is cfg(not bundled); csm-duckdb enables duckdb/bundled" },
    { id = "RUSTSEC-2026-0369", reason = "zip 6 build-dep; vulnerable extract path is cfg(not bundled); csm-duckdb enables duckdb/bundled" },
    # Issue #945: the zstd 2026-10-26 advisory cluster reaches this workspace only
    # through tantivy-sstable 0.3.0 (tantivy 0.22 pins zstd "0.13", features
    # ["experimental"]), and tantivy-sstable's entire call surface is
    # zstd::bulk::{Compressor, Decompressor} + compress_bound — none of the
    # advisory functions (with_context stream reuse, seekable, dictionary
    # cdict/ddict/train_*, CCtx::try_clone threading, DCtx::decompress_stream)
    # is reachable. Patched sets (zstd >=0.14.3, zstd-safe >=8.2.0) are outside
    # tantivy's 0.13 pin, same class as the lru/time/h2 pins above.
    { id = "RUSTSEC-2026-0391", reason = "zstd 0.13.3 pinned by tantivy's zstd 0.13; with_context stream reuse never called (bulk API only)" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7.2.4 behind tantivy's zstd 0.13 pin; seekable decompress never called" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7.2.4 behind tantivy's zstd 0.13 pin; DCtx::decompress_stream never called" },
    { id = "RUSTSEC-2026-0410", reason = "zstd-sys wasm32-only allocator shim; zstd-sys is absent from the csm-wasm dependency tree" },
    # Dependabot alerts #1, #4: libsql-sqlite3-parser crash on invalid UTF-8 (GHSA-8m95-fffc-h4c5)
    # No patch available upstream. Low severity, requires malformed SQL input.
    # No RUSTSEC ID; will add when assigned.
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "Unicode-DFS-2016",
    "OpenSSL",
    "MPL-2.0",
    "NCSA",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
crate = "bincode"
allow = ["MIT"]

[[licenses.exceptions]]
crate = "cloudevents-sdk"
allow = ["Apache-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "allow"
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
