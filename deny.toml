[graph]
targets = []
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained, no replacement in transitive deps (fastembed)" },
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x unmaintained, pinned by libsql" },
    { id = "RUSTSEC-2025-0119", reason = "number_prefix unmaintained, transitive dep from indicatif" },
    # Dependabot alert #22: opentelemetry_sdk unbounded memory in W3C Baggage (GHSA-w9wp-h8wv-79jx)
    # Patched in 0.32.1, we're at 0.27.1. Upgrade requires major API migration (deferred).
    # No RUSTSEC ID yet; added proactively for when one is assigned.
    # { id = "RUSTSEC-20XX-XXXX", reason = "opentelemetry_sdk 0.32 requires major API migration, blocked until ecosystem catches up" },
    # Retired 2026-11-25 (#1066): RUSTSEC-2026-0009 (time 0.3.45) and
    # RUSTSEC-2026-0002 (lru 0.12.5) left with csm-retrieval's dead optional
    # tantivy 0.22.1 dep (they entered the lock only through it — the old
    # "via fastembed" attribution was wrong; fastembed never depended on
    # tantivy). Same retirement rule as the zip block below: the package
    # leaves Cargo.lock, its ignores leave with it. If tantivy (or another
    # pin of time < 0.3.47 / lru < 0.16.3) returns, re-derive the
    # reachability analysis before re-adding any ignore.
    # Dependabot alert: h2 unbounded empty DATA frames (RUSTSEC-2026-0258)
    # 0.4 copy bumped to 0.4.19 (fixed >=0.4.16). 0.3.27 copy is pinned by
    # hyper 0.14 via libsql/tonic/axum; no 0.3.x patch — requires libsql
    # upgrade (deferred, tracked in plans).
    { id = "RUSTSEC-2026-0258", reason = "h2 0.3.27 pinned by hyper 0.14 (libsql chain), no 0.3.x patch; 0.4 copy bumped to 0.4.19" },
    # Dependabot alert #40 / GHSA-m665-v7pm-7grj / CVE-2026-115905 (critical;
    # zip <= 9.0.4, patched 9.0.5): resolved 2026-11-03. libduckdb-sys
    # 1.20000.1 dropped its zip build-dependency, so `zip` is absent from
    # Cargo.lock and the RUSTSEC-2026-0367/0368/0369 ignores were removed with
    # it. The bundled argument stays the safety condition if zip returns:
    # crates/csm-duckdb/Cargo.toml enables `duckdb/bundled`, and libduckdb-sys
    # compiles ZipArchive::extract only in its cfg(not(feature = "bundled"))
    # download path. Re-check: when libduckdb-sys reintroduces zip, run
    # scripts/check-bundled-ignore-reason.sh before adding any ignore.
    # Retired 2026-11-25 (#1066): the zstd family (RUSTSEC-2026-0391 zstd,
    # 2026-0398/0403 zstd-safe, 2026-0410 zstd-sys) left with csm-retrieval's
    # dead optional tantivy dep — the entire cluster entered only through
    # tantivy-sstable 0.3.0. Issue #945's reachability analysis (only
    # zstd::bulk was ever called) is preserved in git and remains the
    # template if zstd returns via another pin.
    # RUSTSEC-2026-0543 (2026-11): chrono is flagged unmaintained for *all* versions,
    # so there is no patched release to upgrade to. Informational notice, not a
    # vulnerability. chrono is a direct dependency here (root, csm-traits,
    # csm-retrieval, csm-persistence) AND reaches the tree through libsql, rmcp,
    # schemars and cloudevents-sdk, so migrating our own uses to jiff/time would not
    # remove it from Cargo.lock. Revisit when those upstreams drop chrono.
    # (RUSTSEC-2026-0592, url <= 2.5.8 blob: origin() stack overflow, is NOT ignored:
    # it is fixed by locking url >= 2.5.9.)
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained (all versions, no patch); also pulled transitively by libsql/rmcp/schemars/cloudevents-sdk, informational only" },
    # Dependabot alerts #1, #4: libsql-sqlite3-parser crash on invalid UTF-8 (GHSA-8m95-fffc-h4c5)
    # No patch available upstream. Low severity, requires malformed SQL input.
    # No RUSTSEC ID; will add when assigned.
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "Unicode-DFS-2016",
    "OpenSSL",
    "MPL-2.0",
    "NCSA",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
crate = "bincode"
allow = ["MIT"]

[[licenses.exceptions]]
crate = "cloudevents-sdk"
allow = ["Apache-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "allow"
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
