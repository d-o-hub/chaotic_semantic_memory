  modules_under_loc_limit: 12/12
  performance_gates: 4/4 passing
  
guardrails:
  - Never create unused code
  - Verify at least one real usage site before adding proc-macros, traits, or convenience APIs
  - Write/update ADR for architecture changes
  - Do not assume crate existence/version; verify
  - Prefer exact, testable instructions over high-level advice
  - When uncertain on modern Rust practice, verify with web research
